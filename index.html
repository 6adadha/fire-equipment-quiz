年","C":"X：1 年，Y：2 年","D":"X：2 年，Y：3 年"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2019-消防法規-29","year":2019,"roc_year":108,"subject":"消防法規","category":"其他消防法規","no":29,"question":"依建築法之規定，下列敘述何者正確？","options":{"A":"公有建築物，為政府機關、公民營事業機構、自治團體及具有紀念性之建築物","B":"直轄市、縣（市）（局）主管建築機關收到起造人申請建造執照或雜項執照書件之日起， 應於 10 日內審查完竣，合格者即發給執照","C":"供公眾使用之建築物，為供民眾工作居住、娛樂之建築物","D":"鄉、鎮（縣轄市）公所依規定可核發供公眾使用之建築物執照"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2019-消防法規-30","year":2019,"roc_year":108,"subject":"消防法規","category":"各類場所設置標準","no":30,"question":"依據各類場所消防安全設備設置標準，所謂有效開口之規定中，下列何者錯誤？","options":{"A":"開口下端距樓地板面 120 公分以內","B":"開口面臨道路或寬度 1 公尺以上之通路","C":"開口無柵欄且內部未設妨礙避難之構造或阻礙物","D":"開口為可自外面開啟或輕易破壞得以進入室內之構造。採一般玻璃門窗時，厚度應在 10 毫米以下"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2019-消防法規-31","year":2019,"roc_year":108,"subject":"消防法規","category":"各類場所設置標準","no":31,"question":"依據各類場所消防安全設備設置標準，下列使用瓦斯之場所，何者非屬於應設置瓦斯漏氣火 警自動警報設備者？","options":{"A":"11 層以上建築物，屋頂設置餐廳者","B":"總樓地板面積在 1000 平方公尺以上之地下建築物","C":"供本標準第 12 條第 5 款第 1 目使用之地下層，樓地板面積合計 1000 平方公尺以上，且其 中甲類場所樓地板面積合計 500 平方公尺以上者","D":"地下層供本標準第 12 條第 1 款所列場所使用，樓地板面積合計 1000 平方公尺以上者"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2019-消防法規-32","year":2019,"roc_year":108,"subject":"消防法規","category":"其他消防法規","no":32,"question":"某史蹟資料館其展示室樓地板面積為 210 平方公尺，閱覽室樓地板面積為 150 平方公尺，會 議室樓地板面積為 120 平方公尺，休息室樓地板面積為 60 平方公尺，館內員工有 6 人，其 可收容多少人員？","options":{"A":"180 人","B":"186 人","C":"192 人","D":"360 人"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2019-消防法規-33","year":2019,"roc_year":108,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":33,"question":"依據公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法，可燃性高壓氣體儲存場所之 構造、設備及安全管理之規定，下列何者正確？","options":{"A":"採用不燃材料構造之地面一層建築物，屋頂應以輕質金屬板或其他輕質不燃材料覆蓋，屋 簷並應距離地面 1.5 公尺以上","B":"保持攝氏 50 度以下之溫度；容器並應防止日光之直射","C":"通路面積至少應占儲存場所面積之百分之十以上","D":"周圍 2 公尺範圍內，應嚴禁煙火，且不得存放任何可燃性物質。但儲存場所牆壁以厚度 9 公分以上鋼筋混凝土造或具有同等以上強度構築防護牆者，不在此限"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2019-消防法規-34","year":2019,"roc_year":108,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":34,"question":"依據公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法，有關第三類公共危險物品之 三氯矽甲烷，其第一、二、三級管制量分別為多少？","options":{"A":"20 公斤、100 公斤、200 公斤","B":"5 公斤、50 公斤、100 公斤","C":"10 公斤、50 公斤、300 公斤","D":"10 公斤、100 公斤、200 公斤"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2019-消防法規-35","year":2019,"roc_year":108,"subject":"消防法規","category":"消防設備人員制度","no":35,"question":"依據消防安全設備檢修專業機構管理辦法，合格證書有效期限為 X 年。檢修機構除有下列情 形之一者外，得於合格證書有效期限屆滿前 2 個月至 1 個月內向內政部申請延展，每次延展 期限為 Y 年：一、消防設備師或消防設備士檢修不實經裁罰達 Z 件以上。二、違反第 8 條規定情節輕微、違反第 17 條規定、未依業務執行規範或檢修作業手冊執行檢修業務。 三、符合第 18 條各款所定情形之一。請問 X、Y、Z 之總和為多少？","options":{"A":"9","B":"10","C":"11","D":"12"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2019-消防法規-36","year":2019,"roc_year":108,"subject":"消防法規","category":"建築防火／原有合法建築","no":36,"question":"依據原有合法建築物防火避難設施及消防設備改善辦法規定，避難層之出入口，依下列規定 改善：一、應有一處以上之出入口寬度不得小於 X 公分，高度不得低於 Y 公尺。二、樓地 板面積超過 Z 平方公尺者，至少應有二個不同方向之出入口。請問 X、Y、Z 各為多少？","options":{"A":"X=80,Y=2.0,Z=600","B":"X=90,Y=1.8,Z=500","C":"X=100,Y=1.6,Z=400","D":"X=110,Y=1.4,Z=300"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2019-消防法規-37","year":2019,"roc_year":108,"subject":"消防法規","category":"防火管理","no":37,"question":"依據消防法施行細則，下列何者並非消防防護計畫應包括事項？","options":{"A":"自衛消防編組：員工在 10 人以上者，至少編組滅火班、通報班及避難引導班；員工在 50 人以上者，應增編安全防護班及救護班","B":"防火避難設施之自行檢查：每月至少檢查一次，檢查結果遇有缺失，應報告管理權人立即 改善","C":"滅火、通報及避難訓練之實施；每半年至少應舉辦一次，每次不得少於 4 小時，並應事先 通報當地消防機關","D":"經中央主管機關評鑑合格之試驗機構出具之防焰性能試驗合格報告書"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2019-消防法規-38","year":2019,"roc_year":108,"subject":"消防法規","category":"防焰","no":38,"question":"依防焰性能認證實施要點之規定，下列敘述何者正確？","options":{"A":"申請防焰性能認證案不合程序或有欠缺，其可以補正者，補正期間以 2 個月為限","B":"得使用同一試驗合格號碼防焰窗簾之單位面積質量，其實測值與申請值之相對誤差，應在正 負百分之 10 以內","C":"業者申請防焰性能認證，應檢具文件 2 份並繳納審查費，向內政部委託之機關(構)、學校、團 體提出","D":"取得防焰性能認證之業者，防焰處理技術人員變更，得免實地調查，但應通知當地消防機關"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2019-消防法規-39","year":2019,"roc_year":108,"subject":"消防法規","category":"其他消防法規","no":39,"question":"依據消防法之規定，下列敘述何者錯誤？","options":{"A":"各級消防機關應設救災救護指揮中心，以統籌指揮、調度、管制及聯繫救災、救護相關事宜","B":"直轄市、縣（市）政府，為消防需要，應會同自來水事業機構選定適當地點，設置消防栓， 所需費用由直轄市、縣（市）政府、鄉（鎮、市）公所酌予補助；其保養、維護由消防機關 負責","C":"電信機構，應視消防需要，設置報警專用電話設施","D":"消防人員對火災處所及其周邊之土地、建築物、車輛及其他物品，非使用、損壞或限制其 使用，不能達搶救之目的時，得使用、損壞或限制其使用"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2019-消防法規-40","year":2019,"roc_year":108,"subject":"消防法規","category":"其他消防法規","no":40,"question":"依據消防法規定，使用燃氣之熱水器及配管之承裝業，應向直轄市、縣（市）政府申請營業 登記後，始得營業。自何時開始，使用燃氣熱水器之安裝，非經僱用領有合格證照者，不得 為之？","options":{"A":"中華民國 85 年 2 月 1 日","B":"中華民國 90 年 2 月 1 日","C":"中華民國 95 年 2 月 1 日","D":"中華民國 100 年 2 月 1 日"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-01","year":2020,"roc_year":109,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":1,"question":"依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法有關第四類 公共危險物品之相關名詞定義，下列敘述何者正確？","options":{"A":"易燃液體：指在一大氣壓時，閃火點在攝氏 60 度以下之液體","B":"可燃液體：指在一大氣壓時，閃火點超過攝氏 93 度未滿攝氏 250 度之液體","C":"第一石油類：指在一大氣壓時，閃火點未達攝氏 70 度者","D":"高閃火點物品：指閃火點在攝氏 130 度以上之第四類公共危險物品"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-02","year":2020,"roc_year":109,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":2,"question":"某液化石油氣容器串接使用場所串接使用量為 100 公斤，依公共危險物品及可燃性高壓氣體 製造儲存處理場所設置標準暨安全管理辦法規定，其使用之燃氣橡膠管長度不得超過 X 公 尺，且最小彎曲半徑為 Y 毫米以上，請問前述 X、Y 各為何？","options":{"A":"X=1.2、Y=50","B":"X=1.5、Y=80","C":"X=1.6、Y=100","D":"X=1.8、Y=110"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-03","year":2020,"roc_year":109,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":3,"question":"某化工廠欲新設一座室外儲槽儲存柴油（閃火點攝氏 60 度），該儲槽水平剖面最大直徑為 8 公尺，經檢討該儲槽側板至其廠區境界線距離應有 40 公尺，惟實際量測僅有 30 公尺，若 欲於廠區境界線上設置防火水幕，依防火牆及防火水幕設置基準規定，請問防火水幕防護高 度應為何？","options":{"A":"2 公尺","B":"3 公尺","C":"4 公尺","D":"6 公尺"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-04","year":2020,"roc_year":109,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":4,"question":"依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法規定，有關可 燃性高壓氣體儲存場所之構造、設備及安全管理，下列敘述何者正確？","options":{"A":"採用不燃材料構造之地面一層建築物，屋頂應以輕質金屬板或其他輕質不燃材料覆蓋，屋 簷並應距離地面 2.5 公尺以上","B":"保持攝氏 50 度以下之溫度；容器並應防止日光之直射","C":"周圍 3 公尺範圍內，應嚴禁煙火，且不得存放任何可燃性物質","D":"供 3 家以上販賣場所使用者，應製作平面配置圖，註明場所之面積、數量、編號及商號名 稱等資料，並懸掛於明顯處所"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-05","year":2020,"roc_year":109,"subject":"消防法規","category":"複合用途建築","no":5,"question":"有一棟 3 層樓的建築物，每層樓地板面積皆為 100 平方公尺，且非為無開口樓層，各層用途 分別是一樓：診所，二樓、三樓：住宅，依複合用途建築物判斷基準，請問本棟建築物之用 途屬性為何？","options":{"A":"複合用途建築物","B":"住宅","C":"單一用途建築物診所","D":"集合住宅"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-06","year":2020,"roc_year":109,"subject":"消防法規","category":"防焰","no":6,"question":"依防焰性能認證實施要點規定，某業者申請防焰性能認證經審查合格，發給其認證合格登錄 編號 AE-01-1234，下列敘述何者錯誤？","options":{"A":"登錄編號中 AE 係指業別，其中 A 為製造業","B":"登錄編號中 AE 係指業別，其中Ｅ為裁剪、縫製、安裝業","C":"登錄編號中 01 係指防焰物品種類，而 01 為防焰窗簾","D":"登錄編號中 1234 為序號"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-07","year":2020,"roc_year":109,"subject":"消防法規","category":"各類場所設置標準","no":7,"question":"依各類場所消防安全設備設置標準規定，請問電影院之各樓層其應設之避難器具，在符合下 列何者之構造及相關設施等得予免設？","options":{"A":"主要構造為防火構造，居室面向戶外部分，設有陽臺等有效避難設施，且該陽臺等設施設 有可通往地面之樓梯或通往他棟建築物之設施","B":"主要構造為防火構造，由居室或住戶可直接通往直通樓梯，且該居室或住戶所面向之直通 樓梯，設有隨時可自動關閉之甲種防火門（不含防火鐵捲門），且收容人員未滿 500 人","C":"使用之樓層，主要構造為防火構造且設有 2 座以上安全梯，且該樓層各部分均有 2 個以上 不同避難逃生路徑能通達安全梯","D":"使用之樓層，主要構造為防火構造並設有 2 座以上安全梯，且設有自動撒水設備或內部裝 修符合建築技術規則建築設計施工篇第 88 條規定者"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-08","year":2020,"roc_year":109,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":8,"question":"依各類場所消防安全設備設置標準規定，請就下列公共危險物品製造場所之面積、公共危險 物品數量或設備高度進行判定，何者屬顯著滅火困難場所？","options":{"A":"總樓地板面積為 900 平方公尺","B":"第二類公共危險物品之硫磺、鐵粉、金屬粉、鎂合計數量達管制量 120 倍","C":"第四類公共危險物品之重油（閃火點攝氏 150 度）數量達管制量 250 倍，其操作溫度未滿 攝氏 100 度","D":"製造設備高於地面 6.5 公尺。其處理之公共危險物品為易燃液體（閃火點攝氏 90 度）"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-09","year":2020,"roc_year":109,"subject":"消防法規","category":"各類場所設置標準","no":9,"question":"依各類場所消防安全設備設置標準規定，有關滅火器核算其最低滅火效能值規定，下列敘述 何者正確？","options":{"A":"公共危險物品處理場所之建築物外牆為非防火構造者，總樓地板面積每 50 平方公尺（含 未滿）有一滅火效能值","B":"甲類場所各層樓地板面積每 50 平方公尺（含未滿）有一滅火效能值","C":"公共危險物品儲存場所之建築物，外牆為防火構造者，總樓地板面積每 100 平方公尺（含 未滿）有一滅火效能值","D":"位於公共危險物品製造場所之室外具有連帶使用關係之附屬設施，以該設施水平最大面積 為其樓地板面積，每 150 平方公尺（含未滿）有一滅火效能值"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-10","year":2020,"roc_year":109,"subject":"消防法規","category":"各類場所設置標準","no":10,"question":"某室內停車空間，第一層樓地板面積為 600 平方公尺，依各類場所消防安全設備設置標準規 定，應就水霧、泡沫、乾粉、二氧化碳滅火設備等選擇設置之，但外牆開口面積（常時開放 部分）達多少平方公尺時，滅火設備得採移動式設置？","options":{"A":"60","B":"90","C":"120","D":"180"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-11","year":2020,"roc_year":109,"subject":"消防法規","category":"各類場所設置標準","no":11,"question":"依各類場所消防安全設備設置標準相關規定，下列敘述何者正確？","options":{"A":"建築物之各層樓在判定是否為無開口樓層之標準是相同的","B":"易燃性液體物質之閃火點超過攝氏 60 度之作業場所是屬於高度危險工作場所","C":"圖書館與紀念館是同一目用途的場所","D":"各類場所符合建築技術規則以無開口且具半小時以上防火時效之牆壁、樓地板區劃分隔 者，適用各類場所消防安全設備設置標準各編規定，視為另一場所"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-12","year":2020,"roc_year":109,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":12,"question":"依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法規定，某公共 危險物品室內儲存場所規劃儲存達管制量 200 倍以上易燃液體，經檢討其四周保留空地寬度 依法需 10 公尺，倘該場所臨近河川，其保留空地面臨河川部分，得縮減為幾公尺？","options":{"A":"0","B":"1","C":"3","D":"5"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-13","year":2020,"roc_year":109,"subject":"消防法規","category":"其他消防法規","no":13,"question":"有關火警受信總機認可基準規定，下列敘述何者錯誤？","options":{"A":"接受由探測器或火警發信機所發出之信號，或經中繼器或介面器轉換成警報信號，告知有 關人員火警發生之設備，附有防災連動控制之設備者應同時啟動之者，係為 R 型受信總機","B":"反覆試驗係指將受信總機之任一回路以額定電壓施予 10000 次之火警動作試驗後，對受信 總機本身之構造及功能不得有異狀發生","C":"新技術開發之火警受信總機，依形狀、構造、材質及性能判定，如符合火警受信總機認可 基準規定及同等以上性能，並經中央消防主管機關認定者，得不受火警受信總機認可基準 之規範","D":"辦理型式認可作業時，僅提供型式試驗之樣品 1 個即可"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-14","year":2020,"roc_year":109,"subject":"消防法規","category":"其他消防法規","no":14,"question":"依滅火器認可基準規定，有關住宅用滅火器之型式及構造，下列敘述何者正確？","options":{"A":"應為蓄壓式滅火器，且不具更換或充填滅火藥劑之構造","B":"應為加壓式滅火器，且不具更換或充填滅火藥劑之構造","C":"應為蓄壓式滅火器，且具更換或充填滅火藥劑之構造","D":"應為加壓式滅火器，且具更換或充填滅火藥劑之構造"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-15","year":2020,"roc_year":109,"subject":"消防法規","category":"其他消防法規","no":15,"question":"依消防機具器材及設備認可實施辦法規定，下列敘述何者錯誤？","options":{"A":"消防機具器材及設備之型式認可基準係由內政部公告","B":"取得個別認可之消防機具器材及設備，登錄機構應予編號登錄，並將各項認可資訊登載於 網站，隨時更新","C":"申請個別認可，應檢附文件向登錄機構辦理，而型式認可書影本是其中一項","D":"申請個別認可時，得向登錄機構申請預先領用標示"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-16","year":2020,"roc_year":109,"subject":"消防法規","category":"其他消防法規","no":16,"question":"依滅火器藥劑更換及充填作業規定，廠商更換滅火藥劑並完成檢修或更新後應於滅火器加裝 檢修環，有關檢修環相關規定，下列敘述何者錯誤？","options":{"A":"應於滅火器瓶頸加裝檢修環","B":"檢修環材質以一體成型之硬質無縫塑膠、壓克力或鐵環製作","C":"檢修環內徑不得大於滅火器瓶口 1 mm","D":"檢修環顏色以紅色、黃色交替更換"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-17","year":2020,"roc_year":109,"subject":"消防法規","category":"其他消防法規","no":17,"question":"依滅火器藥劑更換及充填作業規定，下列敘述何者錯誤？","options":{"A":"充填滅火藥劑之容器及鋼瓶，應符合滅火器認可基準之氣密試驗","B":"重新充填滅火藥劑後之滅火器，於充填完成時其噴射性能須能噴射所充填滅火劑容量或重 量 80%以上之量，其使用期限內噴射性能須能噴射所充填滅火劑容量或重量 90%以上之量","C":"泡沫滅火藥劑因經較長時間後會產生變化，應依滅火器銘板上所標示之時間或依製造商之 使用規範，定期加以更換。其餘類型滅火器之滅火藥劑若無固化結塊、異物、沉澱物、變 色、污濁或異臭者等情形，滅火藥劑可繼續使用","D":"新增充填之滅火藥劑應為經內政部認可之產品，汰換之滅火藥劑未經回收處理重新辦理認 可，取得個別認可標示，不得重複使用"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-18","year":2020,"roc_year":109,"subject":"消防法規","category":"其他消防法規","no":18,"question":"依水道連結型自動撒水設備設置基準，有關水道連結型自動撒水設備設置規定，下列敘述何 者錯誤？","options":{"A":"水源容量：以 4 顆水道連結型撒水頭，持續放水 20 分鐘以上計算之","B":"設置水道連結型自動撒水設備之長期照顧服務機構等場所，其洗手間、浴室或廁所免設水 道連結型撒水頭","C":"水道連結型撒水頭放水量應在每分鐘 30 公升以上","D":"水道連結型撒水頭最末端放水壓力應在每平方公分 0.5 公斤以上或 0.05 百萬帕斯卡（MPa） 以上"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-19","year":2020,"roc_year":109,"subject":"消防法規","category":"住宅用火災警報器","no":19,"question":"依住宅用火災警報器設置辦法規定，有關住宅用火災警報器安裝方式，下列敘述何者正確？","options":{"A":"裝置於天花板或樓板者，警報器下端距離天花板或樓板 60 公分以內","B":"裝置於天花板或樓板者，裝設於距離牆面或樑 50 公分以上之位置","C":"裝置於牆面者，距天花板或樓板下方 30 公分以上 60 公分以下","D":"距離出風口 1.2 公尺以上"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-20","year":2020,"roc_year":109,"subject":"消防法規","category":"其他消防法規","no":20,"question":"依避難器具支固器具及固定部之結構、強度計算及施工方法規定，下列敘述何者錯誤？","options":{"A":"在設計載重時，裝置避難器具之固定部應能承受承載荷重與附加荷重之和","B":"支固器具之材料，應為耐蝕性材料，或採取有效之耐蝕處理者","C":"支固器具之材料，如有受雨淋之虞時（限直接接觸外氣部分），應使用符合 CNS 2473（一 般結構用鋼料）、CNS 4435（一般結構用碳鋼鋼管）、CNS 7141（一般結構用矩形碳鋼鋼 管）或 CNS 941-953（鋼索）規定或具有同等以上強度與耐久性之材料","D":"支固器具之固定方式，包括：直接裝置在建築物的主要構造部、裝置在固定基座上、裝置 在採有補強措施時，及其他與上揭具同等強度以上之施工方法"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-21","year":2020,"roc_year":109,"subject":"消防法規","category":"其他消防法規","no":21,"question":"依潔淨區消防安全設備設置要點規定，電子工業廠房潔淨區檢討設置消防安全設備時，下列 敘述何者正確？","options":{"A":"設置自動撒水設備時，氣淋室得免設撒水頭","B":"回風豎井所設之吸氣式偵煙探測系統，取樣管之裝置位置應在上回風層天花板下方距離 50 公分範圍內","C":"潔淨室、上回風層、下回風層及回風豎井頂部所設置密閉濕式自動撒水設備，撒水密度每 平方公尺每分鐘 6.15 公升以上","D":"潔淨室、下回風層及管橋已經設置室內消防栓設備時，得免設二氧化碳滅火器"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-22","year":2020,"roc_year":109,"subject":"消防法規","category":"其他消防法規","no":22,"question":"依建築法規定，有關建造之相關行為與定義，下列敘述何者錯誤？","options":{"A":"新建：為新建造之建築物或將原建築物全部拆除而重行建築者","B":"增建：於原建築物增加其面積或高度者。但以過廊與原建築物連接者，應視為修建","C":"改建：將建築物之一部分拆除，於原建築基地範圍內改造，而不增高或擴大面積者","D":"修建：建築物之基礎、樑柱、承重牆壁、樓地板、屋架及屋頂，其中任何一種有過半之修 理或變更者"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-23","year":2020,"roc_year":109,"subject":"消防法規","category":"建築防火／原有合法建築","no":23,"question":"依建築技術規則用語定義，下列敘述何者正確？","options":{"A":"天花板高度：自室內地板面至天花板之高度，同一室內之天花板高度不同時，以其室內樓 地板面積除室內容積之商作天花板高度","B":"地下層：地板面在基地地面以下之樓層。但天花板高度有二分之一以上在基地地面上者， 視為地面層","C":"閣樓：在屋頂內之樓層，樓地板面積在該建築物建築面積二分之一以上時，視為另一樓層","D":"夾層：夾於樓地板與天花板間之樓層；同一樓層內夾層面積之和，超過該層樓地板面積二 分之一或 50 平方公尺者，視為另一樓層"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-24","year":2020,"roc_year":109,"subject":"消防法規","category":"其他消防法規","no":24,"question":"依建築法規中高層建築物之規定，下列敘述何者錯誤？","options":{"A":"高層建築物應依規定設置防災中心，且設於避難層或其直上層或直下層","B":"防災中心樓地板面積不得小於 40 平方公尺，防災中心應以具有 2 小時以上防火時效之牆 壁、防火門窗等防火設備及該層防火構造之樓地板予以區劃分隔，室內牆面及天花板（包 括底材），以耐燃一級材料為限","C":"高層建築物所設消防安全設備等 7 類防災設備，其顯示裝置及控制應設於防災中心","D":"高層建築物高度達 25 層或 90 公尺以上者，其防災中心應具備防災、警報、通報、滅火、 消防及其他必要之監控系統設備。且應具有配合系統型式提供模擬等 7 種功能"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-25","year":2020,"roc_year":109,"subject":"消防法規","category":"其他消防法規","no":25,"question":"依消防及建築法規定，下列敘述何者錯誤？","options":{"A":"各類場所消防安全設備設置標準中的居室，係指供居住、工作、集會、娛樂、烹飪等使用 之房間。故衣帽間、儲藏室、機械室、車庫等亦視為居室","B":"各類場所消防安全設備設置標準中的樓地板面積和總樓地板面積定義，係依照「建築技術 規則」建築設計施工編建築技術用語定義辦理","C":"在建築法規中有無窗戶居室之定義，在消防法規中有無開口樓層之定義，而且二個定義不 相同","D":"在建築法規中有架空走廊構造之規定，在消防法規中有過廊之規定"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-26","year":2020,"roc_year":109,"subject":"消防法規","category":"消防法／施行細則","no":26,"question":"下列何者非屬消防法第 13 條第 1 項所定有關應實施防火管理場所之一定規模以上供公眾使 用建築物？","options":{"A":"總樓地板面積在 300 平方公尺之餐廳","B":"總樓地板面積在 500 平方公尺之百貨商場、超級市場","C":"總樓地板面積在 100 平方公尺之補習班或訓練班","D":"總樓地板面積在 150 平方公尺之學校"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-27","year":2020,"roc_year":109,"subject":"消防法規","category":"消防法／施行細則","no":27,"question":"依消防法規定，有關火災原因調查鑑定，下列敘述何者錯誤？","options":{"A":"檢察、警察機關或消防機關皆得封鎖火災現場","B":"申請火災證明內容以火災發生時間及地點為限","C":"直轄市、縣（市）消防機關依消防法第 26 條第 1 項規定調查、鑑定火災原因後，應即製 作火災原因調查鑑定書，移送當地警察機關依法處理","D":"直轄市、縣（市）政府，得設火災鑑定會，調查、鑑定火災原因；其組織由中央消防主管 機關定之"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-28","year":2020,"roc_year":109,"subject":"消防法規","category":"其他消防法規","no":28,"question":"有關消防法之罰則，下列敘述何者錯誤？","options":{"A":"未依消防法設置消防安全設備之管理權人處新臺幣 6 千元以上 3 萬元以下罰鍰","B":"消防設備士卻從事消防安全設備之設計業務，則處該消防設備士新臺幣 3 萬元以上 15 萬 元以下罰鍰","C":"消防設備士或消防設備師為消防安全設備不實檢修報告者，處新臺幣 2 萬元以上 10 萬元 以下罰鍰","D":"某一消防設備師擔任一場所之防火管理人，雖然製定了消防防護計畫，並報請消防機關核 備，但卻未依該計畫執行有關防火管理上必要之業務，則處該消防設備師新臺幣 1 萬元以 上 5 萬元以下罰鍰"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-29","year":2020,"roc_year":109,"subject":"消防法規","category":"防火管理","no":29,"question":"依消防法施行細則規定，消防防護計畫中之滅火、通報及避難訓練之實施次數及時間，下列 敘述何者正確？","options":{"A":"每半年至少應舉辦一次，每次不得少於 2 小時","B":"每半年至少應舉辦一次，每次不得少於 4 小時","C":"每年至少應舉辦一次，每次不得少於 2 小時","D":"每年至少應舉辦一次，每次不得少於 4 小時"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-30","year":2020,"roc_year":109,"subject":"消防法規","category":"消防設備人員制度","no":30,"question":"依消防設備師及消防設備士管理辦法規定，消防設備師及消防設備士，自取得證書日起每 X 年應接受講習一次或取得累計積分達 Y 分以上之訓練證明文件，請問 X+Y 之值為何？","options":{"A":"122","B":"123","C":"162","D":"163"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-31","year":2020,"roc_year":109,"subject":"消防法規","category":"消防設備人員制度","no":31,"question":"依消防法相關規定，有關消防設備士的業務範圍，下列敘述何者正確？","options":{"A":"消防安全設備施工完成後之功能測試，並製作消防安全設備測試報告書","B":"規劃消防安全設備種類及數量，並製作消防安全設備圖說","C":"查核消防安全設備施工中須經試驗或勘驗事項，並製作紀錄","D":"依「消防機關辦理建築物消防安全設備審查及查驗作業基準」檢討樓層為無開口樓層或一 般樓層"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-32","year":2020,"roc_year":109,"subject":"消防法規","category":"消防設備人員制度","no":32,"question":"依消防設備師及消防設備士管理辦法規定，有關消防設備師及消防設備士業務執行等事項， 下列敘述何者正確？","options":{"A":"請領消防設備師及消防設備士證書必須檢附國民身分證正本向中央消防主管機關申請","B":"消防設備師及消防設備士執行業務，以電子檔案方式之業務登記簿，至少應保存 5 年","C":"消防設備師及消防設備士之證書係由中央消防主管機關核發，故僅受中央消防主管機關之 監督","D":"消防設備師及消防設備士之獎勵事項，僅由直轄市、縣（市）政府來辦理"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-33","year":2020,"roc_year":109,"subject":"消防法規","category":"消防設備人員制度","no":33,"question":"依消防安全設備檢修專業機構管理辦法規定，某公司欲申請消防安全設備檢修專業機構，請 問該公司之實收資本額、資本總額或登記財產總額應在新臺幣幾元以上？","options":{"A":"500 萬元","B":"800 萬元","C":"1,000 萬元","D":"1,200 萬元"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-34","year":2020,"roc_year":109,"subject":"消防法規","category":"消防設備人員制度","no":34,"question":"依消防安全設備檢修專業機構管理相關規定，下列敘述何者錯誤？","options":{"A":"檢修專業機構得辦理地下建築物消防安全設備定期檢修業務","B":"檢修專業機構應置有消防設備師及消防設備士合計 10 人以上，均為專任，其中消防設備 士至少 2 人","C":"內政部受理檢修專業機構之申請許可，經書面審查合格者，應實地審查","D":"檢修專業機構所檢修場所發生火災事故致人員死亡或重傷，且經當地消防主管機關查有重 大檢修不實情事，中央主管機關應撤銷或廢止許可並註銷證書"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-35","year":2020,"roc_year":109,"subject":"消防法規","category":"檢修申報／檢修基準","no":35,"question":"依消防安全設備檢修及申報辦法規定，檢修人員或檢修機構對檢修完成之室內消防栓設備 （加壓用送水裝置採用消防幫浦方式），應於何處附加檢修完成標示？","options":{"A":"「消防栓箱箱面」與「加壓送水裝置控制盤盤面」","B":"「消防水帶」與「消防幫浦」","C":"「消防水帶」與「加壓送水裝置控制盤盤面」","D":"「消防栓箱箱面」與「消防幫浦」"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-36","year":2020,"roc_year":109,"subject":"消防法規","category":"檢修申報／檢修基準","no":36,"question":"執行消防安全設備檢修作業時，依消防安全設備檢修及申報辦法規定，下列敘述何者正確？","options":{"A":"經由消防安全設備整體性之運作或使用，判別其機能，係為性能檢查","B":"扭力扳手、空氣注入試驗器及糖度計，非屬於執行檢修業務必要設備及器具之範圍","C":"消防安全設備檢修完成標示附加的位置，火警自動警報設備是在手動報警機之明顯易見處","D":"檢修完成之消防安全設備，應依規定附加檢修完成標示，其中標示之規格樣式底色，檢修 人員專用樣式的是綠色，檢修機構專用樣式的是紅色"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-37","year":2020,"roc_year":109,"subject":"消防法規","category":"其他消防法規","no":37,"question":"依消防機關辦理建築物消防安全設備審查及查驗作業基準規定，消防安全設備設計人應配合 消防機關通知，會同審查消防安全設備圖說，但新建、增建、改建、修建、變更用途、室內 裝修或變更設計等，申請全案僅涉下列何種設備時，設計人得免會同審查？","options":{"A":"標示設備","B":"火警自動警報設備","C":"連結送水管","D":"緊急電源插座"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-38","year":2020,"roc_year":109,"subject":"消防法規","category":"其他消防法規","no":38,"question":"建築物消防安全設備竣工查驗時，應檢附消防安全設備測試報告書，依消防安全設備測試報 告書測試方法及判定要領規定，下列敘述何者錯誤？","options":{"A":"室內消防栓設備測試時，包括外觀試驗、性能試驗及綜合試驗","B":"水道連結型自動撒水設備之增壓供水裝置施行外觀試驗時，以目視確認設置場所之狀況， 應為檢修便利及無受火災等災害損害之虞的處所。綜合試驗之放水試驗，係在末端查驗閥 （壓力錶）測定放水壓力及放水量","C":"火警自動警報設備測試時，只有外觀試驗及性能試驗，並無綜合試驗項目","D":"排煙設備測試時，性能試驗包括：自動啟動裝置動作試驗、手動啟動裝置動作試驗、排煙 風量測試"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-39","year":2020,"roc_year":109,"subject":"消防法規","category":"檢修申報／檢修基準","no":39,"question":"有關消防機關受理集合住宅消防安全設備檢修申報作業處理原則之規定，下列敘述何者錯誤？","options":{"A":"對於檢修申報管理權人之認定，集合住宅專有部分、約定專用部分消防安全設備檢修申報 之管理權人，係屬區分所有權人或約定專用部分之使用人","B":"對於檢修申報管理權人之認定，集合住宅共用部分、約定共用部分消防安全設備檢修申報 之管理權人，係屬管理負責人或管理委員會","C":"集合住宅之消防安全設備檢修，如採個別申報方式者，其系統性設備之設置含括專有部分、 約定專用部分、共用部分、約定共用部分，可併建築物共用部分申報時一併申報","D":"未成立管理委員會之集合住宅，共有及共用部分如未依規定辦理檢修申報時，須針對該部 分之各區分所有權人一併依法裁處；專有部分及約定專用部分則須針對該部分之區分所有 權人分別依法裁處，並提報縣、市政府公共安全會報（治安會報）"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2020-消防法規-40","year":2020,"roc_year":109,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":40,"question":"依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法規定，有關公 共危險物品處理場所之第一種販賣場所其位置、構造及設備，下列敘述何者錯誤？","options":{"A":"第一種販賣場所係指販賣裝於容器之第一類至第六類公共危險物品，其數量未達管制量 15 倍之場所","B":"其使用建築物之部分，窗戶及出入口應設置 60 分鐘以上防火時效之防火門窗","C":"應設於建築物之地面層","D":"內設第一類至第六類公共危險物品調配室者，樓地板面積應在 6 平方公尺以上，10 平方公 尺以下，且出入口應設置 1 小時以上防火時效之防火門"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-01","year":2021,"roc_year":110,"subject":"消防法規","category":"住宅用火災警報器","no":1,"question":"依住宅用火災警報器設置辦法規定，住宅用火災警報器安裝之位置，下列敘述何者錯誤？","options":{"A":"寢室、旅館客房或其他供就寢用之居室","B":"廚房","C":"避難層設有寢室之樓梯","D":"設有符合各類場所消防安全設備設置標準之自動撒水設備或同等性能以上之滅火設備（限 使用標示溫度在 75 度以下，動作時間在 60 秒以內之密閉型撒水頭）者，在該有效範圍內， 得免設置住宅用火災警報器"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-02","year":2021,"roc_year":110,"subject":"消防法規","category":"液化石油氣","no":2,"question":"有關液化石油氣容器之安全管理規定，下列敘述何者正確？","options":{"A":"容器管理資料應定期向中央消防機關申報","B":"容器應取得型式認可證書後，始得銷售","C":"容器未附加合格標示即銷售，處新臺幣 2 萬元以上 10 萬元以下罰鍰","D":"容器檢驗所需費用，由消費者負擔"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-03","year":2021,"roc_year":110,"subject":"消防法規","category":"防火管理","no":3,"question":"有關防火管理人之設置及管理，下列敘述何者正確？","options":{"A":"百貨商場之總樓地板面積在 200 平方公尺以上者，應設置防火管理人","B":"餐廳之總樓地板面積在 300 平方公尺以上者，應設置防火管理人","C":"防火管理人每 3 年至少應接受複訓一次，複訓不得少於 8 小時","D":"防火管理人每週至少檢查防火避難設施 1 次"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-04","year":2021,"roc_year":110,"subject":"消防法規","category":"消防設備人員制度","no":4,"question":"依消防法規定，中央主管機關許可之消防安全設備檢修專業機構、消防設備師或消防設備士， 未依消防法第 9 條第 2 項所定辦法中有關定期檢修項目、方式、基準、期限之規定檢修消防 安全設備或為消防安全設備不實檢修報告者，處新臺幣 2 萬元以上 10 萬元以下罰鍰，並得按 次處罰；必要時，並得予以多久停止執行業務或停業之處分？","options":{"A":"1 個月以上 1 年以下","B":"1 個月以上 2 年以下","C":"2 個月以上 1 年以下","D":"2 個月以上 2 年以下"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-05","year":2021,"roc_year":110,"subject":"消防法規","category":"消防法／施行細則","no":5,"question":"依消防法施行細則規定，有關消防安全設備種類及數量之規劃，並製作消防安全設備圖說之 工作項目，係指下列何者？","options":{"A":"設計","B":"監造","C":"裝置","D":"檢修"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-06","year":2021,"roc_year":110,"subject":"消防法規","category":"消防設備人員制度","no":6,"question":"消防設備師及消防設備士執行業務，應備業務登記簿，至少應保存幾年？","options":{"A":"3 年","B":"4 年","C":"5 年","D":"6 年"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-07","year":2021,"roc_year":110,"subject":"消防法規","category":"檢修申報／檢修基準","no":7,"question":"依消防安全設備檢修及申報辦法規定，甲類場所經當地消防機關會勘通過依法取得使用執照、 變更使用執照或室內裝修許可等證明文件之合法場所，自該證明文件核發之日期起算，距申 報期限在多久以內，免辦理當次檢修及申報備查？","options":{"A":"6 個月","B":"9 個月","C":"1 年","D":"1 年半"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-08","year":2021,"roc_year":110,"subject":"消防法規","category":"消防設備人員制度","no":8,"question":"有關消防安全設備檢修專業機構之管理，下列敘述何者錯誤？","options":{"A":"申請機構者，應置有消防設備師及消防設備士合計 10 人以上，其中消防設備師至少 2 人","B":"機構證書有效期限為 3 年，每次延展期限為 3 年","C":"機構所屬消防設備師或消防設備士檢修不實，經裁罰達 10 件以上，1 年內不得重新申請","D":"檢修報告書至少保存 5 年"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-09","year":2021,"roc_year":110,"subject":"消防法規","category":"防焰","no":9,"question":"有關防焰物品之認證及管理，下列敘述何者錯誤？","options":{"A":"手工毯、室內展示用廣告合板均為防焰物品","B":"防焰性能認證 D 類，係指進口販賣業","C":"防焰標示使用狀況紀錄至少保存 6 年","D":"窗簾及布幕具耐洗性能者之標示方法為縫製"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-10","year":2021,"roc_year":110,"subject":"消防法規","category":"其他消防法規","no":10,"question":"有關緊急發電機設備之輸出容量計算基本原則，下列敘述何者錯誤？","options":{"A":"兩種以上之消防安全設備同時啟動時，設有能按次序逐次於 50 秒內供給消防安全設備電 力之裝置，或消防安全設備依其種類或組合不可能同時啟動或同時使用（如二氧化碳滅火 設備與排煙設備）時，得免計入瞬時全負載投入之輸出容量","B":"一場所設置兩種以上之消防安全設備時，其輸出之電力容量，須足供該等消防用電設備同 時啟動且能同時使用","C":"同一建築基地之不同場所，其各類場所之消防安全設備緊急電源負載總容量，大於供給其 最大場所之負載所需之輸出容量時，得共用緊急電源，由一緊急發電機設備供給電力","D":"每一建築物應個別設置緊急電源"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-11","year":2021,"roc_year":110,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":11,"question":"有關公共危險物品及可燃性高壓氣體各類場所之定義，下列敘述何者錯誤？","options":{"A":"室外儲存場所：在建築物外地面上設置容量超過 600 公升且不可移動之儲槽儲存六類物品之 場所","B":"第二種販賣場所：販賣裝於容器之六類物品，其數量達管制量 15 倍以上，未達 40 倍之場所","C":"瓦斯行是可燃性高壓氣體處理場所","D":"液化石油氣容器檢驗場所是可燃性高壓氣體處理場所"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-12","year":2021,"roc_year":110,"subject":"消防法規","category":"防焰","no":12,"question":"有關防焰物品之性能試驗，下列敘述何者正確？","options":{"A":"自點火時間終了起，至試樣停止燃燒之時間，稱為餘焰時間","B":"試樣經加熱燃燒後碳化部分之最小長度，稱為碳化距離","C":"防焰物品地毯其餘焰時間不得超過 20 秒","D":"防焰物品展示用廣告板其餘燃時間不得超過 20 秒"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-13","year":2021,"roc_year":110,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":13,"question":"有關公共危險物品之種類及管制量，下列敘述何者錯誤？","options":{"A":"氯酸鹽類屬氧化性固體","B":"金屬鈉屬易燃固體","C":"在一大氣壓時，閃火點為 73 ℃者，屬第三石油類","D":"第四石油類之管制量為 6000 公升"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-14","year":2021,"roc_year":110,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":14,"question":"依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法規定，六類公 共危險物品製造場所，其外牆與廠區外鄰近場所之安全距離，下列敘述何者正確？","options":{"A":"與收容人員在 300 人以上之電影院之距離，應在 50 公尺以上","B":"與收容人員在 20 人以上之醫院之距離，應在 50 公尺以上","C":"與加油站之距離，應在 20 公尺以上","D":"與博物館之距離，應在 30 公尺以上"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-15","year":2021,"roc_year":110,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":15,"question":"依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法規定，針對可 燃性高壓氣體儲存場所之構造、設備及安全管理，下列敘述何者錯誤？","options":{"A":"設置防止氣體滯留之有效通風裝置","B":"設置氣體漏氣自動警報設備","C":"周圍 2 公尺範圍內，應嚴禁煙火，且不得存放任何可燃性物質","D":"設有警戒標示及一般型緊急照明設備"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-16","year":2021,"roc_year":110,"subject":"消防法規","category":"各類場所設置標準","no":16,"question":"依各類場所消防安全設備設置標準之規定，室外消防栓在 X 公尺以內，應保持空曠，於 Y 公 尺範圍內，應附設水帶箱，X，Y 分別為何？","options":{"A":"X＝5，Y＝3","B":"X＝3，Y＝3","C":"X＝3，Y＝5","D":"X＝5，Y＝5"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-17","year":2021,"roc_year":110,"subject":"消防法規","category":"各類場所設置標準","no":17,"question":"各類場所消防安全設備設置標準所稱顯著滅火困難場所設置之室內消防栓，下列敘述何者錯誤？","options":{"A":"緊急電源之供電容量應供其有效動作 30 分鐘以上","B":"任一樓層內，全部室內消防栓同時使用時，各消防栓瞄子放水壓力在每平方公分 3.5 公斤以上","C":"各消防栓瞄子放水量在每分鐘 260 公升以上。但全部消防栓數量超過 5 支時，以同時使用 5 支 計算","D":"所在建築物其各層任一點至消防栓接頭之水平距離在 25 公尺以下，且各層之出入口附近設置 1 支以上之室內消防栓"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-18","year":2021,"roc_year":110,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":18,"question":"所謂顯著滅火困難場所，係指公共危險物品等場所符合下列規定之一者，下列敘述何者錯誤？","options":{"A":"公共危險物品製造場所或一般處理場所總樓地板面積在 2000 平方公尺以上","B":"公共危險物品製造場所或一般處理場所公共危險物品數量達管制量 100 倍以上。但第一類 公共危險物品之氯酸鹽類、過氯酸鹽類、硝酸鹽類、第二類公共危險物品之硫磺、鐵粉、 金屬粉、鎂、第五類公共危險物品之硝酸酯類、硝基化合物、金屬疊氮化合物，或含有以 上任一種成分之物品且供作爆炸物原料使用，或高閃火點物品其操作溫度未滿攝氏 100 度 者，不列入管制量計算","C":"公共危險物品製造場所或一般處理場所之製造或處理設備高於地面 6 公尺以上。但高閃火 點物品其操作溫度未滿攝氏 100 度者，不在此限","D":"公共危險物品製造場所或一般處理場所建築物除供一般處理場所使用以外，尚有其他用途。 但以無開口且具 1 小時以上防火時效之牆壁、樓地板區劃分隔者，或處理高閃火點物品其 操作溫度未滿攝氏 100 度者，不在此限"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-19","year":2021,"roc_year":110,"subject":"消防法規","category":"各類場所設置標準","no":19,"question":"依各類場所消防安全設備設置標準之規定，有關滅火器設置規定，下列敘述何者錯誤？","options":{"A":"高度危險工作場所使用之場所，每 100 平方公尺（含未滿），有 1 滅火效能值","B":"公共危險物品場所設置之滅火器屬第五種滅火設備","C":"設有滅火器之樓層，自樓面居室任一點至滅火器之步行距離在 20 公尺以下","D":"懸掛於牆上之 18 公斤以上滅火器，其上端與樓地板面之距離，應在 1 公尺以下"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-20","year":2021,"roc_year":110,"subject":"消防法規","category":"其他消防法規","no":20,"question":"有關自動撒水設備之設置規定，下列敘述何者錯誤？","options":{"A":"預動式：平時管內貯滿低壓空氣，以感知裝置啟動流水檢知裝置，且撒水頭動作時即撒水","B":"集會堂等表演場所之舞臺，應設開放式，任一點至撒水頭之水平距離，在 1.7 公尺以下","C":"醫院之病房，得採用小區劃型撒水頭（以第一種感度為限），任一撒水頭之防護面積在 15 平方公尺以下","D":"側壁型撒水頭與裝置面（牆壁）之間距，在 15 公分以下"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-21","year":2021,"roc_year":110,"subject":"消防法規","category":"其他消防法規","no":21,"question":"有關出口標示燈及避難方向指示燈之設置規定，下列敘述何者錯誤？","options":{"A":"供集合住宅使用之居室得免設出口標示燈、避難方向指示燈或避難指標","B":"避難方向指示燈，應裝設於設置場所之走廊、樓梯及通道，並優先設於轉彎處","C":"出口標示燈具閃滅或音聲引導功能者，由主要出入口往避難方向所設探測器動作時，該出 入口之出口標示燈應開啟閃滅及音聲引導","D":"觀眾席引導燈之照度，在觀眾席通道地面之水平面上測得之值，在 0.2 勒克司（lx）以上"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-22","year":2021,"roc_year":110,"subject":"消防法規","category":"其他消防法規","no":22,"question":"所謂無開口樓層係指建築物之各樓層供避難及消防搶救用之有效開口面積未達下列那一項規定？","options":{"A":"11 層以上之樓層，具可內切直徑 50 公分以上圓孔之開口，合計面積為該樓地板面積三十 分之一以上者","B":"11 層以上之樓層，具可內切直徑 30 公分以上圓孔之開口，合計面積為該樓地板面積三十 分之一以上者","C":"10 層以下之樓層，具可內切直徑 50 公分以上圓孔之開口，合計面積為該樓地板面積五十 分之一以上者。但其中至少應具有 2 個內切直徑 1 公尺以上圓孔或寬 75 公分以上、高 120 公分以上之開口","D":"10 層以下之樓層，具可內切直徑 30 公分以上圓孔之開口，合計面積為該樓地板面積三十 分之一以上者。但其中至少應具有 2 個內切直徑 1 公尺以上圓孔或寬 75 公分以上、高 120 公分以上之開口"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-23","year":2021,"roc_year":110,"subject":"消防法規","category":"其他消防法規","no":23,"question":"裝置自動撒水之建築物，應於地面層室外臨建築線，消防車容易接近處，設置口徑 63 毫米之 送水口，並符合下列那一項規定？","options":{"A":"應為共用","B":"裝置自動撒水設備之樓層，樓地板面積在 3000 平方公尺以下，至少設置雙口形送水口 1 個，並裝接陰式快速接頭","C":"樓地板面積在 3000 平方公尺以上，每超過 1000 平方公尺，增設 1 個。但應設數量超過 3 個時，以 3 個計","D":"設在無送水障礙處，且其高度距基地地面在 1.5 公尺以下 0.8 公尺以上"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-24","year":2021,"roc_year":110,"subject":"消防法規","category":"各類場所設置標準","no":24,"question":"依各類場所消防安全設備設置標準規定，室內停車空間或汽車修理廠等場所，須使用泡沫噴 頭，並樓地板面積每多少平方公尺設置一個，使防護對象在其有效防護範圍內？","options":{"A":"7","B":"8","C":"9","D":"10"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-25","year":2021,"roc_year":110,"subject":"消防法規","category":"其他消防法規","no":25,"question":"有關消防幫浦之呼水裝置，下列敘述何者錯誤？","options":{"A":"呼水裝置是水源之水位低於幫浦位置時，常時充水於幫浦及配管之裝置","B":"呼水槽水位降至其容量三分之一前，應能發出警報音響至平時有人駐在處","C":"應有 100 公升以上之有效儲存量","D":"補給水管之管徑應在 15 A 以上"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-26","year":2021,"roc_year":110,"subject":"消防法規","category":"其他消防法規","no":26,"question":"消防幫浦本體必須能耐最高水壓之 X 倍以上，且加壓 Y 分鐘後，各部位仍無洩漏現象才算合 格。X、Y 分別為何？","options":{"A":"X=3，Y=3","B":"X=1.5，Y=3","C":"X=1.5，Y=1.5","D":"X=2，Y=2"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-27","year":2021,"roc_year":110,"subject":"消防法規","category":"其他消防法規","no":27,"question":"有關半導體封裝及測試業潔淨區之潔淨室、上回風層、下回風層及回風豎井頂部，設置密閉 濕式自動撒水設備，應符合之規定，下列敘述何者正確？","options":{"A":"撒水頭應為快速反應型（第一種感度）","B":"撒水密度每平方公尺每分鐘 6 公升以上","C":"水源容量應在最遠之 30 個撒水頭連續放射 90 分鐘之水量以上。但撒水頭數未達 30 個者， 依實際撒水頭數計算水量","D":"氣淋室應設撒水頭"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-28","year":2021,"roc_year":110,"subject":"消防法規","category":"住宅用火災警報器","no":28,"question":"依住宅用火災警報器設置辦法規定，住宅用火災警報器裝置於牆面者，距天花板或樓板下方 X 公分以上 Y 公分以下。X、Y 分別為何？","options":{"A":"X=15，Y=50","B":"X=15，Y=30","C":"X=30，Y=15","D":"X=30，Y=50"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-29","year":2021,"roc_year":110,"subject":"消防法規","category":"各類場所設置標準","no":29,"question":"依各類場所消防安全設備設置標準之規定，每 100 公升乾燥砂之滅火效能值為：","options":{"A":"0.5","B":"1.0","C":"1.5","D":"2.0"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-30","year":2021,"roc_year":110,"subject":"消防法規","category":"其他消防法規","no":30,"question":"依水道連結型自動撒水設備設置基準規定，下列敘述何者錯誤？","options":{"A":"水道連結型自動撒水設備得排除各類場所消防安全設備設置標準之配管、配件、屋頂水箱、 竣工時之加壓試驗、配置、放水量、放水壓力、流水檢知裝置、水源容量、加壓送水裝置、 送水口及緊急電源等規定","B":"水源容量：以 8 顆水道連結型撒水頭，持續放水 20 分鐘以上計算之","C":"撒水頭放水壓力未符規定者，應設增壓供水裝置或其他有效增壓措施","D":"民生水箱共用式室內水平配管應避免傾斜且裝置時儘量縮短配管與撒水頭間管距，撒水頭 應配接防止水滯留之管接頭，配管末端連結水龍頭或馬桶水箱等日常生活用水設施，俾使 配管內水源流動不滯留"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-31","year":2021,"roc_year":110,"subject":"消防法規","category":"其他消防法規","no":31,"question":"依水道連結型自動撒水設備設置基準規定，有關撒水頭放水量應在每分鐘 X 公升以上，最末 端放水壓力應在每平方公分 Y 公斤以上。X、Y 分別為何？","options":{"A":"X=20，Y=0.5","B":"X=30，Y=1","C":"X=20，Y=1","D":"X=30，Y=0.5"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-32","year":2021,"roc_year":110,"subject":"消防法規","category":"建築防火／原有合法建築","no":32,"question":"依原有合法建築物防火避難設施及消防設備改善辦法第 5 條規定，防火構造建築物其總樓地 板面積在 1500 平方公尺以上者，應按多少平方公尺區劃分隔？","options":{"A":"300","B":"500","C":"1000","D":"1500"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-33","year":2021,"roc_year":110,"subject":"消防法規","category":"其他消防法規","no":33,"question":"有關建築物之建築許可及施工管理，下列敘述何者錯誤？","options":{"A":"昇降設備、機械停車設備、防空避難設備，應請領雜項執照","B":"改建：建築物之基礎、樑柱、承重牆壁、樓地板、屋架或屋頂，其中任何一種有過半之修 理或變更者","C":"敷設於建築物之空氣調節、昇降、消防等設備，均為建築法所稱之建築物設備","D":"承造人因故未能於建築期限內完工時，得申請展期 1 年，並以 1 次為限"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-34","year":2021,"roc_year":110,"subject":"消防法規","category":"建築防火／原有合法建築","no":34,"question":"依建築技術規則相關規定，樓地板面積超過 50 平方公尺之居室，其天花板或天花板下方 80 公分範圍以內之有效通風面積，未達樓地板面積多少比率者，可視為無窗戶居室？","options":{"A":"百分之一","B":"百分之二","C":"百分之三","D":"百分之五"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-35","year":2021,"roc_year":110,"subject":"消防法規","category":"建築防火／原有合法建築","no":35,"question":"依建築技術規則建築設計施工編規定，建築物在 A 層以上，第 B 層以下之各樓層，應設置緊 急進口。但面臨道路或寬度 C 公尺以上之通路，且各層之外牆每 D 公尺設有窗戶或其他開口 者，不在此限。下列敘述何者錯誤？","options":{"A":"A=2","B":"B=10","C":"C=8","D":"D=10"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-36","year":2021,"roc_year":110,"subject":"消防法規","category":"建築防火／原有合法建築","no":36,"question":"依建築技術規則建築設計施工編第 205 條規定，有關地下建築物之給水管、瓦斯管、配電管 及其他管路均應以不燃材料製成，其貫通防火區劃時，貫穿部位與防火區劃合成之構造應具 有多少小時以上之防火時效？","options":{"A":"1","B":"2","C":"3","D":"4"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-37","year":2021,"roc_year":110,"subject":"消防法規","category":"建築防火／原有合法建築","no":37,"question":"依建築技術規則建築設計施工編規定，高層建築物應設置防災中心，下列敘述何者錯誤？","options":{"A":"防災中心應設於避難層或其直上層或直下層","B":"樓地板面積不得小於 60 平方公尺","C":"高層建築物消防安全設備，其顯示裝置及控制應設於防災中心","D":"高層建築物高度達 25 層或 90 公尺以上者，其防災中心並應具備防災、警報、通報、滅火、 消防及其他必要之監控系統設備"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-38","year":2021,"roc_year":110,"subject":"消防法規","category":"其他消防法規","no":38,"question":"臺灣的電子業在世界上相當有名且發達，試問有關積體電路製造業潔淨區之潔淨室、下回風 層及管橋應設置之消防安全設備，下列敘述何者錯誤？","options":{"A":"應設置二氧化碳滅火器","B":"應設置室外消防栓設備","C":"應設置手動報警設備","D":"應設置標示設備"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-39","year":2021,"roc_year":110,"subject":"消防法規","category":"其他消防法規","no":39,"question":"下列場所何者得設置水道連結型自動撒水設備？","options":{"A":"樓地板面積合計 550 平方公尺之長期照顧服務機構","B":"樓地板面積合計 1100 平方公尺之老人福利機構","C":"樓地板面積合計 1500 平方公尺之護理機構","D":"樓地板面積合計 2000 平方公尺之身心障礙福利機構"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2021-消防法規-40","year":2021,"roc_year":110,"subject":"消防法規","category":"其他消防法規","no":40,"question":"依消防機具器材及設備認可實施辦法規定，有關型式認可之有效期間為幾年？","options":{"A":"3 年","B":"4 年","C":"5 年","D":"6 年"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-01","year":2022,"roc_year":111,"subject":"消防法規","category":"消防法／施行細則","no":1,"question":"依消防法規定，下列敘述何者與規定不符？","options":{"A":"本法所稱管理權人係指依法令或契約對各該場所有實際支配管理權者；其屬法人者，為其 負責人","B":"消防主管機關：在中央為內政部；在直轄市為直轄市政府；在縣（市）為縣（市）政府","C":"直轄市、縣（市）政府，應每半年定期舉辦防火教育及宣導，並由機關、學校、團體及大 眾傳播機構協助推行","D":"本法所定各類場所之管理權人對其實際支配管理之場所，應設置並維護其消防安全設備"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-02","year":2022,"roc_year":111,"subject":"消防法規","category":"消防法／施行細則","no":2,"question":"依消防法第 2 章火災預防之規定，下列敘述何者與規定不符？","options":{"A":"供公眾使用建築物之消防安全設備圖說，應由直轄市、縣（市）消防機關於主管建築機關 許可開工前，審查完成","B":"供公眾使用建築物，其管理權人應使用附有防焰標示之地毯、窗簾、布幕、展示用廣告板 及其他指定之防焰物品","C":"非供公眾使用建築物變更為供公眾使用時，主管建築機關應會同消防機關審查其消防安全 設備圖說","D":"地面樓層達十一層以上建築物、地下建築物或中央主管機關指定之建築物，其管理權有分 屬時，各管理權人應協議製定共同消防防護計畫，並報請消防機關核備"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-03","year":2022,"roc_year":111,"subject":"消防法規","category":"液化石油氣","no":3,"question":"依消防法規定，下列有關液化石油氣容器之敘述，何者與規定不同？","options":{"A":"液化石油氣容器（以下簡稱容器）製造或輸入業者，應向中央主管機關申請型式認可，發 給型式認可證書，始得申請個別認可","B":"容器應定期檢驗，零售業者應於檢驗期限屆滿後，將容器送經中央主管機關登錄之容器檢 驗機構實施檢驗，使用年限屆滿應汰換之","C":"容器定期檢驗期限、項目、方式、結果判定、合格標示應載事項與附加方式、不合格容器 之銷毀、容器閥之銷毀及其他相關事項之標準，由中央主管機關公告之","D":"容器檢驗機構辦理容器檢驗所需費用，由零售業者負擔，其收費項目及費額，由該機構報 請中央主管機關核定"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-04","year":2022,"roc_year":111,"subject":"消防法規","category":"消防法／施行細則","no":4,"question":"依消防法施行細則規定，下列敘述何者與規定不同？","options":{"A":"防火管理人講習訓練時數，初訓不得少於 12 小時；複訓不得少於 6 小時","B":"液化石油氣零售業安全技術人員講習訓練時間不得少於 16 小時，每次複訓時數不得少於 8 小時","C":"防火管理人初訓合格後，每 3 年至少應接受複訓一次","D":"液化石油氣零售業安全技術人員每 3 年應接受複訓一次"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-05","year":2022,"roc_year":111,"subject":"消防法規","category":"消防法／施行細則","no":5,"question":"依消防法施行細則規定，有關公眾使用建築物，下列敘述何者與規定相異？","options":{"A":"總樓地板面積在 500 平方公尺以上之餐廳","B":"總樓地板面積在 500 平方公尺以上之百貨商場、超級市場及遊藝場等場所","C":"總樓地板面積在 200 平方公尺以上之補習班或訓練班","D":"總樓地板面積在 500 平方公尺以上，其員工在 30 人以上之工廠或機關（構）"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-06","year":2022,"roc_year":111,"subject":"消防法規","category":"消防設備人員制度","no":6,"question":"依消防設備師及消防設備士管理辦法規定，下列敘述何者與規定不同？","options":{"A":"大專以上之在職進修或推廣教育，取得學分或結業證明者，每一學分積分 10 分，單一課程 以 30 分為限","B":"消防設備師及消防設備士，自取得證書日起每 3 年應接受講習一次或取得累計積分達 160 分以上之訓練證明文件","C":"依專門職業及技術人員考試法規定，經撤銷考試及格資格者，不得請領消防設備師或消防 設備士證書，其已領取者撤銷之","D":"直轄市、縣（市）之消防設備師或消防設備士達 30 人以上者，得組織直轄市、縣（市）消 防設備師公會或消防設備士公會"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-07","year":2022,"roc_year":111,"subject":"消防法規","category":"消防設備人員制度","no":7,"question":"依據消防安全設備檢修專業機構管理辦法規定，下列敘述何者與規定不同？","options":{"A":"檢修機構應於年度終結後 5 個月內，檢具相關書表，報請中央主管機關備查","B":"檢修機構應於年度開始前 2 個月至 1 個月內，檢具相關書表，報請中央主管機關備查","C":"檢修機構於證書有效期限內，其消防設備師或消防設備士有僱用、解聘、資遣、離職、退 休、死亡或其他異動情事者，應於事實發生之日起 1 個月內，檢具相關文件，報請中央主 管機關備查","D":"檢修機構於證書有效期限屆滿前 2 個月至 1 個月內，得檢具相關文件，向中央主管機關申 請延展許可，每次延展期限為 3 年"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-08","year":2022,"roc_year":111,"subject":"消防法規","category":"防焰","no":8,"question":"依據防焰性能認證實施要點規定，下列敘述何者與規定不同？","options":{"A":"申請防焰性能認證，專業機構或直轄市、縣（市）消防機關受理申請之日起 1 個月內，將 審查結果通知申請人","B":"申請防焰性能認證，申請案不合程序或有欠缺，其可以補正者，補正期間以 1 個月為限","C":"使用防焰標示之業者，每月之使用狀況紀錄至少保存 10 年，並於每月 10 日前至專業機構 網站登錄，以供內政部或各級消防機關查核","D":"防焰性能試驗合格號碼產品於效期內因重新製造或進口販賣前，已重新試驗或屆期前 1 年 內經消防機關抽購樣試驗合格者，仍應於試驗合格號碼到期前 2 個月重新申請再登錄，但 得免試驗"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-09","year":2022,"roc_year":111,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":9,"question":"依據公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法，有關六類 物品製造場所或一般處理場所設置、構造、設備之規定，下列敘述何者與規定不同？","options":{"A":"其外牆或相當於該外牆之設施外側，與公共危險物品及可燃性高壓氣體製造、儲存或處理 場所之安全距離，應在 20 公尺以上","B":"四周保留空地寬度應在 3 公尺以上；儲存量達管制量 10 倍以上者，四周保留空地寬度應在 5 公尺以上","C":"除本辦法另有規定外，窗戶及出入口應設置 1 小時以上防火時效之防火門窗","D":"有積存可燃性蒸氣或可燃性粉塵之虞之建築物，應設置將蒸氣或粉塵有效排至屋簷以上或 室外距地面 4 公尺以上高處之設備"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-10","year":2022,"roc_year":111,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":10,"question":"依據公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法，有關室內 儲槽場所之位置、構造及設備規定，下列敘述何者與規定不同？","options":{"A":"儲槽專用室之牆壁、柱及地板應為防火構造，樑應以不燃材料建造，外牆有延燒之虞者， 除出入口外，不得設置開口","B":"儲槽專用室之屋頂應以耐燃材料建造，且不得設置天花板","C":"儲槽專用室之窗戶及出入口，應設置 30 分鐘以上防火時效之防火門窗","D":"儲槽專用室之外牆有延燒之虞者，出入口應設置 1 小時以上防火時效之常時關閉式防火門"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-11","year":2022,"roc_year":111,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":11,"question":"依據公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法，有關室內 儲槽場所輸送液體六類物品之配管規定，下列敘述何者與規定不同？","options":{"A":"應為鋼製或金屬製。但鋼製或金屬製配管會造成作業污染者，得設置塑材雙套管","B":"埋設於地下者，外部應有防蝕功能；接合部分，應有可供檢查之措施。但以熔接接合者， 不在此限","C":"應經該配管最大常用壓力之 1.5 倍以上水壓進行耐壓試驗 10 分鐘，不得洩漏或變形","D":"以水壓進行耐壓試驗確有困難者，得以該配管最大常用壓力之 1 倍以上氣壓進行耐壓試驗。 塑材雙套管，其耐壓試驗以內管為限"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-12","year":2022,"roc_year":111,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":12,"question":"依據公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法，有關使用 量規定，下列敘述何者與規定不同？","options":{"A":"液化石油氣使用量，供營業使用者，不得超過 80 公斤；供家庭使用者，不得超過 40 公斤","B":"容器串接使用場所串接使用量不得超過 1,000 公斤","C":"新建建築物之容器應設置於室外或屋外，液化石油氣之使用量在 10 公斤以下者，容器得不 受前項規定之限制","D":"串接使用量在超過 300 公斤至 1,000 公斤以下者，應設置自動緊急遮斷裝置"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-13","year":2022,"roc_year":111,"subject":"消防法規","category":"檢修申報／檢修基準","no":13,"question":"依據消防安全設備及必要檢修項目檢修基準，有關警報設備規定，下列敘述何者與規定不同？","options":{"A":"火警自動警報設備受信總機周圍狀況，受信機前應確保 1 公尺以上之空間","B":"緊急廣播設備標示燈與裝置面成 15 度角，在 10 公尺距離內應均能明顯易見","C":"一一九火災通報裝置（以下簡稱通報裝置）本體判定方法，通報裝置前應確保 1 公尺以上 之空間","D":"瓦斯漏氣火警自動警報設備任一檢知器動作，於距該裝置之裝設位置中心 1 公尺處，使用 噪音計確認其音壓應在 90 分貝以上"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-14","year":2022,"roc_year":111,"subject":"消防法規","category":"各類場所設置標準","no":14,"question":"依據各類場所消防安全設備設置標準，有關消防搶救上之必要設備規定，下列敘述何者與規 定不同？","options":{"A":"排煙設備排煙口開啟時應連動停止空氣調節及通風設備運轉","B":"防災監控系統綜合操作裝置應設置於防災中心、中央管理室或值日室等經常有人之處所","C":"防災監控系統綜合操作裝置之緊急電源其供電容量應供其有效動作 1 小時以上","D":"共構之建築物內有二處以上場所設置無線電通信輔助設備時，應有能使該設備訊號連通之 措施"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-15","year":2022,"roc_year":111,"subject":"消防法規","category":"其他消防法規","no":15,"question":"依據消防機關辦理建築物消防安全設備審查及查驗作業基準，有關竣工查驗規定，下列敘述 何者與規定不同？","options":{"A":"經內政部公告應實施認可之消防機具器材及設備，消防機關於竣工查驗時，應查核其認可標示","B":"申請竣工查驗，各項圖紙均須摺疊成 A4 尺寸規格並裝訂成冊俾利查驗","C":"竣工查驗之期限，以受理案件後 7 至 10 日內結案為原則","D":"供公眾使用建築物或構造複雜者，竣工查驗之期限，得視需要延長，並通知申請人，最長 不得超過 1 個月"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-16","year":2022,"roc_year":111,"subject":"消防法規","category":"檢修申報／檢修基準","no":16,"question":"依據消防安全設備及必要檢修項目檢修基準，有關放水量規定，下列敘述何者與規定不同？","options":{"A":"公共危險物品等場所達顯著滅火困難者設置之第一種滅火設備之室內消防栓，應在 260 L/min 以上","B":"補助撒水栓應在 130 L/min 以上","C":"室外消防栓應 350 L/min 以上","D":"射水設備每具應在 450 L/min 以上"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-17","year":2022,"roc_year":111,"subject":"消防法規","category":"其他消防法規","no":17,"question":"依據潔淨區消防安全設備設置要點，應設置二氧化碳滅火器規定，下列何者與規定不同？","options":{"A":"潔淨室","B":"上回風層","C":"下回風層","D":"管橋"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-18","year":2022,"roc_year":111,"subject":"消防法規","category":"建築防火／原有合法建築","no":18,"question":"依據建築技術規則設計施工編，有關寬度與高度規定，下列何者與規定不同？","options":{"A":"建築物使用類組為 A-1、B-1、B-2、D-1、D-2 組者，直通樓梯於避難層開向屋外之出入口， 寬度不得小於 1.2 公尺，高度不得小於 1.8 公尺","B":"防火門之門扇寬度應在 75 公分以上，高度應在 180 公分以上","C":"緊急進口，進口之寬度應在 75 公分以上，高度應在 120 公分以上","D":"建築物使用類組為 A-1、B-1、B-2、D-1、D-2 組者，避難層以外之樓層，出入口寬度，不 得小於 1.2 公尺"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-19","year":2022,"roc_year":111,"subject":"消防法規","category":"建築防火／原有合法建築","no":19,"question":"依據建築技術規則設計施工編規定，有關防火構造之建築物，其主要構造之防火時效，下列 何者與規定不同？","options":{"A":"自頂層起算超過第四層至第十四層之各樓層的樓地板應具有 2 小時防火時效","B":"自頂層起算不超過四層之各樓層的柱應具有 2 小時防火時效","C":"自頂層起算第十五層以上之各樓層的承重牆壁應具有 2 小時防火時效","D":"屋頂應具有半小時防火時效"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-20","year":2022,"roc_year":111,"subject":"消防法規","category":"建築防火／原有合法建築","no":20,"question":"依據建築技術規則設計施工編規定，有關防火區劃以具有 1 小時以上防火時效之牆壁、防火 門窗等防火設備與該處防火構造之樓地板區劃分隔，下列何者與規定不同？","options":{"A":"防火構造建築物總樓地板面積在 1,500 平方公尺以上者，應按每 1,500 平方公尺","B":"地下建築物供地下通道使用，其總樓地板面積在 1,500 平方公尺以上者，應按每 1,500 平方 公尺","C":"非防火構造之建築物，其主要構造為木造等可燃材料建造者，應按其總樓地板面積每 1,000 平方公尺","D":"地下建築物供地下使用單元使用之總樓地板面積在 1,000 平方公尺以上者，應按每 1,000 平 方公尺"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-21","year":2022,"roc_year":111,"subject":"消防法規","category":"防焰","no":21,"question":"依消防法與防焰性能認證實施要點，有關防焰物品之規定，下列何者錯誤？","options":{"A":"邊長在 12 公釐以下之施工用帆布","B":"供舞台或攝影棚使用之布幕","C":"室內展示用廣告合板","D":"梭織地毯、植簇地毯、合成纖維地毯、手工毯、滿舖地毯、方塊地毯、人工草皮與面積 2 平 方公尺以上之門墊"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-22","year":2022,"roc_year":111,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":22,"question":"有關公共危險物品之範圍及分類，下列何者正確？","options":{"A":"易燃液體及可燃液體：屬於第一類公共危險物品","B":"氧化性液體：屬於第二類公共危險物品","C":"發火性液體、發火性固體及禁水性物質：屬於第三類公共危險物品","D":"自反應物質及有機過氧化物：屬於第四類公共危險物品"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-23","year":2022,"roc_year":111,"subject":"消防法規","category":"消防設備人員制度","no":23,"question":"依消防法規定，對於消防設備師或消防設備士之相關規定，下列何者錯誤？","options":{"A":"高層建築物或地下建築物消防安全設備之定期檢修，應委託消防設備師為之","B":"消防設備士可進行消防安全設備之裝置及檢修","C":"消防設備師可進行消防安全設備之裝置及檢修","D":"消防設備師或消防設備士未達定量人數前，得由現有相關專門職業及技術人員或技術士暫 行為之"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-24","year":2022,"roc_year":111,"subject":"消防法規","category":"防火管理","no":24,"question":"依消防法規定，管理權人對其實際支配管理之場所，應設置並維護其消防安全設備。以國內 私立大學而言，其管理權人為何人？","options":{"A":"校長","B":"總務長","C":"董事長","D":"學務長"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-25","year":2022,"roc_year":111,"subject":"消防法規","category":"消防設備人員制度","no":25,"question":"有關消防設備師及消防設備士之講習與積分相關規定，下列何者正確？","options":{"A":"中央主管機關舉辦或認可之講習會、研討會或專題演講之每項課程或講題，其總分以 40 分 為限","B":"消防設備師及消防設備士，自取得證書日起每 3 年應接受講習一次或取得累計積分達 180 分以上之訓練證明文件","C":"中央主管機關舉辦或認可之專業訓練課程，每小時積分 20 分","D":"研究所以上之在職進修或推廣教育，取得學分或結業證明者，每一學分積分 20 分，單一課 程以 40 分為限"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-26","year":2022,"roc_year":111,"subject":"消防法規","category":"防火管理","no":26,"question":"依消防法施行細則，有關消防防護計畫須包括事項，下列何者錯誤？","options":{"A":"應對於消防安全設備進行維護管理","B":"具有防止縱火措施","C":"滅火、通報及避難訓練之實施；每半年至少應舉辦一次，每次不得少於 4 小時，並應事先 通報當地消防機關","D":"遇有增建、改建、修建、室內裝修施工時，應依原訂消防防護計畫，監督施工單位用火、 用電情形"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-27","year":2022,"roc_year":111,"subject":"消防法規","category":"住宅用火災警報器","no":27,"question":"依住宅用火災警報器設置辦法，下列敘述何者正確？","options":{"A":"寢室、樓梯及走廊等空間，應設置定溫式","B":"裝設位置應距離出風口 1.8 公尺以上","C":"裝置於牆面者，距天花板或樓板下方 15 公分以上 50 公分以下","D":"裝置於居室牆面為原則"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-28","year":2022,"roc_year":111,"subject":"消防法規","category":"防火管理","no":28,"question":"下列有關消防法第 2 條管理權人之說明，何者錯誤？","options":{"A":"消防安全設備之設置維護費用，最終是否係由消防法所定之「管理權人」負擔，並非消防 法規範之範疇，當事人得透過契約自行約定經費最終之負擔對象及方式","B":"連棟式建築物之所有人將建築物出租而供他人使用時，必須在契約載明消防安全事項之權 利義務轉移者，始以使用人為管理權人","C":"私立學校或公立學校之場所均應以學校校長為管理權人","D":"若場所之營業地點、營業項目、統一編號及違規事實等並無不同，僅管理權人變更時，則 消防機關逕對變更後之管理權人依法接續查處作為，抑或對變更後之管理權人重為查處程 序，均無不可"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-29","year":2022,"roc_year":111,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":29,"question":"依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法第 73 條之 1 規定，下列敘述何者錯誤？","options":{"A":"串接使用量在超過 300 公斤至 1,000 公斤以下者，應設置自動緊急遮斷裝置","B":"串接使用量在超過 120 公斤至 300 公斤以下者，容器應與用火設備保持 2 公尺以上距離","C":"串接使用量在 80 公斤以上至 120 公斤以下者，應設置標示板標示緊急聯絡人姓名及電話","D":"液化石油氣販賣場所之經營者發現供氣之容器串接使用場所無嚴禁煙火標示者，不得供氣"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-30","year":2022,"roc_year":111,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":30,"question":"依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法第 73 條之 2 規定，下列敘述何者正確？","options":{"A":"為避免液化石油氣容器放置室內，漏氣時易於蓄積而致災，爰明定新建及既存建築物之液 化石油氣容器均應設置於室外或屋外","B":"本條於 110 年 11 月 10 日修正發布，惟為減緩實務衝擊，爰另定本條自 111 年 7 月 1 日施 行","C":"如設置於屋外確有困難，且設置防止氣體滯留之有效通風裝置者，則不受本條容器應設置 於室外或屋外之限制","D":"液化石油氣之使用量在 20 公斤以下者，容器得不受應設置於室外或屋外之限制"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-31","year":2022,"roc_year":111,"subject":"消防法規","category":"各類場所設置標準","no":31,"question":"依據各類場所消防安全設備設置標準第 30 條之 1 規定，下列場所何者無須設置防災監控系 統綜合操作裝置？","options":{"A":"高層建築物","B":"總樓地板面積在 50,000 平方公尺以上之建築物","C":"總樓地板面積在 3,000 平方公尺以上之地下建築物","D":"總樓地板面積在 1,000 平方公尺以上之複合用途建築物"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-32","year":2022,"roc_year":111,"subject":"消防法規","category":"其他消防法規","no":32,"question":"依潔淨區消防安全設備設置要點之規定，針對潔淨室、上回風層、下回風層及回風豎井頂部 應設置密閉濕式自動撒水設備。下列何者正確？","options":{"A":"撒水頭應為一般反應型","B":"撒水密度每平方公尺每分鐘 8.15 公升以上","C":"水源容量應在最遠之 30 個撒水頭連續放射 30 分鐘之水量以上。但撒水頭數未達 30 個者， 依實際撒水頭數計算水量","D":"氣淋室須設撒水頭"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-33","year":2022,"roc_year":111,"subject":"消防法規","category":"其他消防法規","no":33,"question":"依消防機具器材及設備認可標準規定，針對型式認可、型式變更及個別認可試驗發現之缺點 之判定方式，下列敘述何者錯誤？","options":{"A":"致命缺點：對人體有危害之虞或無法達到消防機具器材及設備之應有功能者","B":"嚴重缺點：雖非致命缺點，但對消防機具器材及設備之功能有產生重大障礙之虞者","C":"重大缺點：非致命缺點或嚴重缺點。但對消防機具器材及設備之功能有產生障礙之虞；或 產品構造與認可之型式有異；或標示錯誤，致使用功能產生障礙之虞者","D":"輕微缺點：非屬消防機具器材及設備認可標準第 3 條第 1 項前 3 款規定之輕微障礙"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-34","year":2022,"roc_year":111,"subject":"消防法規","category":"其他消防法規","no":34,"question":"依消防機具器材及設備認可實施辦法，有關申請型式認可時所需紀錄或報告之相關規定，下 列敘述何者正確？","options":{"A":"申請人出具之廠內試驗紀錄，須為申請日前 1 年內，並載明引用中央主管機關公告之基準 或國外標準，與測試之標準值及結果值","B":"登錄機構出具之試驗報告，須為申請日前 3 年內，並載明引用中央主管機關公告之基準或 國外標準，與測試之標準值及結果值","C":"中央主管機關公告之國內外第三公證機構出具之試驗報告，須為申請日前 5 年內，並載明 引用中央主管機關公告之基準或國外標準，與測試之標準值及結果值","D":"附持續有效登載證明文件之中央主管機關公告之國內外第三公證機構出具之試驗報告"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-35","year":2022,"roc_year":111,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":35,"question":"依據公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法規定，下列 敘述何者與規定不同？","options":{"A":"在常用溫度下或溫度在攝氏 35 度以下時，表壓力達每平方公分 2 公斤以上或 0.2 百萬帕斯 卡（MPa）以上之液化氣體中之丙烷、丁烷及液化石油氣屬於可燃性高壓氣體","B":"容器檢驗場所：檢驗供家庭用或營業用之液化石油氣容器之場所","C":"可燃性高壓氣體儲存場所，係指可燃性高壓氣體製造或處理場所設置之容器儲存室","D":"容器串接使用場所：使用液化石油氣作為燃氣來源，其串接處理量達 80 公斤以上之場所"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-36","year":2022,"roc_year":111,"subject":"消防法規","category":"各類場所設置標準","no":36,"question":"依各類場所消防安全設備設置標準之規定，每 800 公升的膨脹蛭石之滅火效能值為：","options":{"A":"2","B":"3","C":"4","D":"5"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-37","year":2022,"roc_year":111,"subject":"消防法規","category":"其他消防法規","no":37,"question":"有關自動撒水設備之免設規定，下列非屬免設條件？","options":{"A":"洗手間、浴室或廁所","B":"電信機械室或電腦室","C":"儲存鋁粉、碳化鈣、磷化鈣、鈉、生石灰、鎂粉、鉀、過氧化鈉等禁水性物質","D":"各類場所消防安全設備設置標準第 12 條第 1 款第 1 目所列場所及第 2 目之集會堂使用之 觀眾席，設有固定座椅部分，且撒水頭裝置面高度在 4 公尺以下者"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-38","year":2022,"roc_year":111,"subject":"消防法規","category":"其他消防法規","no":38,"question":"有關乾粉滅火設備之滅火藥劑儲存容器規定，下列敘述何者正確？","options":{"A":"儲存場所應置於溫度攝氏 45 度至 60 度，溫度變化較少處","B":"使用第二種乾粉之充填比為 0.85 以上，1.45 以下","C":"使用第三種乾粉之充填比為 1.5 以上，2.5 以下","D":"儲存容器設置符合 CNS11176 規定之安全裝置"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-39","year":2022,"roc_year":111,"subject":"消防法規","category":"其他消防法規","no":39,"question":"有關得免設探測器之場所或處所，以下敘述何者錯誤？","options":{"A":"洗手間、廁所或浴室","B":"室內游泳池之水面或溜冰場之冰面上方","C":"外氣流通無法有效探測火災之場所","D":"主要構造為防火構造，且開口設有具半小時防火時效防火門之金庫"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2022-消防法規-40","year":2022,"roc_year":111,"subject":"消防法規","category":"其他消防法規","no":40,"question":"探測器會依其特性有不同之探測區域已達到最佳探測能力。一般來說，指探測器裝置面之四 周以淨高 X 公分以上之樑或類似構造體區劃包圍者。但差動式分布型及偵煙式探測器，其裝 置面之四周淨高應為 Y 公分以上。其中 X、Y 分別應為多少？","options":{"A":"X=40, Y=60","B":"X=40, Y=80","C":"X=60, Y=90","D":"X=60, Y=120"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-01","year":2023,"roc_year":112,"subject":"消防法規","category":"檢修申報／檢修基準","no":1,"question":"依消防安全設備檢修及申報辦法之規定，對於所謂各類場所所在之建築物整棟已無使用情形 之認定基準，可分為使用狀態或管理狀態等，下列何者不屬於使用狀態之認定基準？","options":{"A":"建築物於避難層開向屋外之出入口及車輛出入口均已全日上鎖或封閉，且各出入口明顯處 所張貼禁止進入之告示","B":"建築物內部之場所均已歇業、停業或現場無實際使用情形","C":"因地震、水災、風災、火災或其他重大事變，致建築物毀損無法使用","D":"因違反相關法規，經有關機關採取停止供水、供電或封閉等措施"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-02","year":2023,"roc_year":112,"subject":"消防法規","category":"防火管理","no":2,"question":"依消防法、消防法施行細則，有關製定消防防護計畫之規定，下列敘述何者正確？","options":{"A":"地面樓層達 10 層以上建築物，其管理權有分屬時，各管理權人應協議製定共同消防防護 計畫","B":"地下建築物應製定共同消防防護計畫","C":"一定規模以上供公眾使用建築物，應由管理權人，遴用防火管理人，責其製定消防防護 計畫","D":"建築物管理權有分屬無法互推召集人時，防火管理人得申請直轄市、縣（市）消防機關指 定之"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-03","year":2023,"roc_year":112,"subject":"消防法規","category":"消防設備人員制度","no":3,"question":"依消防設備師及消防設備士管理辦法第 14 條之 3 之規定，各級消防設備師公會及消防設備 士公會之組織及活動，應依下列那一項法規辦理？","options":{"A":"消防法","B":"各類場所消防安全設備設置標準","C":"人民團體法","D":"工會法"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-04","year":2023,"roc_year":112,"subject":"消防法規","category":"消防法／施行細則","no":4,"question":"依消防法施行細則第 21 條之規定，直轄市、縣（市）政府對轄內無自來水供應或消防栓設置 不足地區，應籌建或整修蓄水池及其他消防水源，並由當地何者機關列管檢查？","options":{"A":"消防機關","B":"自來水事業單位","C":"水資源局","D":"經濟部"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-05","year":2023,"roc_year":112,"subject":"消防法規","category":"消防設備人員制度","no":5,"question":"依消防設備師及消防設備士管理辦法之規定，消防設備師及消防設備士，自取得證書日起每 A 年應接受講習一次或取得累計積分達 B 分以上之訓練證明文件。下列 A 與 B 何者正確？","options":{"A":"A=5，B=200","B":"A=3，B=160","C":"A=4，B=180","D":"A=2，B=120"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-06","year":2023,"roc_year":112,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":6,"question":"依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法第 42 條之規 定，有關雙重殼之地下儲槽場所位置、構造及設備，下列敘述何者正確？","options":{"A":"儲槽應於雙重殼間設置固體洩漏檢測設備","B":"儲槽應具有氣密性，並使用厚度 3.2 毫米以上之鋼板或具有同等以上性能之材質","C":"使用強化塑料之儲槽者，其外表應有防蝕功能","D":"使用鋼板之儲槽者，其外表應有防塵功能"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-07","year":2023,"roc_year":112,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":7,"question":"依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法第 73 條之 2 之規定，新建建築物之容器應設置於室外或屋外，且不適用下列何種情形？","options":{"A":"有嚴禁煙火標示","B":"設置於屋外確有困難，且設置防止氣體滯留之有效通風裝置者","C":"場所之溫度應經常保持攝氏 40 度以下，並有防止日光直射措施","D":"容器應直立放置且有防止傾倒之固定措施"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-08","year":2023,"roc_year":112,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":8,"question":"依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法之規定，液化 石油氣販賣場所之經營者發現供氣之容器串接使用場所有下列情形之一者，不得供氣。下列 何者正確？①容器置於地下室 ②無嚴禁煙火標示 ③使用或備用之容器未直立放置或未有 防止傾倒之固定措施 ④未設置氣體漏氣警報器","options":{"A":"僅①②③","B":"僅②③④","C":"僅①③④","D":"①②③④"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-09","year":2023,"roc_year":112,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":9,"question":"依公共危險物品試驗方法及判定基準之規定，試驗物品為未知物者，應先確認其物性，判定 其為液體或固體，再進行分類試驗。其中，所謂液體，係指在一大氣壓下，且 A℃時為液態 者或 A℃時為固態、超過 A℃在 B℃以下為液態者。下列 A 與 B 何者正確？","options":{"A":"A=10，B=30","B":"A=15，B=35","C":"A=20，B=40","D":"A=25，B=45"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-10","year":2023,"roc_year":112,"subject":"消防法規","category":"其他消防法規","no":10,"question":"依防火牆及防火水幕設置基準之規定，若防護高度 15 公尺時，其每公尺水幕長度放水量應為 多少？","options":{"A":"每分鐘 100 公升","B":"每分鐘 120 公升","C":"每分鐘 130 公升","D":"每分鐘 150 公升"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-11","year":2023,"roc_year":112,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":11,"question":"依可燃性高壓氣體儲存場所防爆牆設置基準之規定，採鋼板製之防爆牆，鋼板厚度應在多少 mm 以上？","options":{"A":"3.2","B":"4.5","C":"6.0","D":"15"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-12","year":2023,"roc_year":112,"subject":"消防法規","category":"其他消防法規","no":12,"question":"依消防機具器材及設備認可實施辦法之規定，消防機具器材及設備之型式認可之有效期間為 幾年，有效期限屆滿前得申請展延？","options":{"A":"2","B":"3","C":"4","D":"5"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-13","year":2023,"roc_year":112,"subject":"消防法規","category":"其他消防法規","no":13,"question":"依緩降機認可基準修正之規定，有關緩降機之構造及性能部分，下列敘述何者錯誤？","options":{"A":"芯線應施予外裝，全繩為均勻構造；芯線直徑並應在 0.1 公分以上","B":"調速器無須經常拆開清理亦能正常運作","C":"於繩索之兩端應具備以不會脫開之方法連結相當於最大使用人數之穿著用具","D":"套帶以相當於最大使用載重除以最大使用人數，再乘以 6.5（係數）所得之拉力載重加載持 續 5 分鐘後，不得產生斷裂或明顯之變形現象"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-14","year":2023,"roc_year":112,"subject":"消防法規","category":"其他消防法規","no":14,"question":"依消防機具器材及設備認可實施辦法之規定，登錄機構應對個別認可合格之消防機具器材及 設備辦理產品產製廠（場）抽樣或市場購樣試驗，每年抽樣或購樣以該年度申請個別認可案 件之型式為對象，每一應實施認可之消防機具器材及設備品目至少抽驗一件。必要時，中央 主管機關得增減抽樣或購樣產品數量。下列那一種情形可免實施抽樣或購樣？","options":{"A":"經會同實施半數以上試驗者","B":"經會同實施四分之三以上試驗者","C":"經會同實施全數試驗者","D":"無經會同實施試驗者"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-15","year":2023,"roc_year":112,"subject":"消防法規","category":"檢修申報／檢修基準","no":15,"question":"依消防機關受理集合住宅消防安全設備檢修申報作業處理原則之規定，對於未成立管理委員 會之集合住宅辦理檢修申報之主動協助作為，不包括下列何者？","options":{"A":"協調促請地方建築主管機關對未成立管理委員會之集合住宅訂定分期、分區、分類計畫，並 輔導其召開區分所有權人會議，成立管理委員會或推選管理負責人，以利推動檢修申報制度","B":"轄區分隊對各住戶加強宣導檢修申報制度，必要時得利用轄內有線電視節目播送系統、村 （里）民大會等相關途徑宣導","C":"轄區分隊指導協助其得共同委託消防設備師（士）或檢修專業機構辦理檢修，並向消防機 關辦理申報","D":"未成立管理委員會之集合住宅，共有及共用部分如未依規定辦理檢修申報時，須針對該部 分之各區分所有權人一併依法裁處；專有部分及約定專用部分則須針對該部分之區分所有 權人分別依法裁處，並提報縣、市政府災害防救會報"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-16","year":2023,"roc_year":112,"subject":"消防法規","category":"各類場所設置標準","no":16,"question":"依各類場所消防安全設備設置標準，有關失智照顧型長期照顧機構避難器具得免設之規定， 下列敘述何者錯誤？","options":{"A":"設有隨時可自動關閉之具 1 小時以上防火時效之防火門（不含防火鐵捲門） ，且收容人員未 滿 30 人","B":"裝修材料以耐燃一級材料裝修","C":"各樓層以具 1 小時以上防火時效之牆壁及防火設備分隔為二個以上之區劃，各區劃均以走 廊連接安全梯，或分別連接不同安全梯","D":"設有火警自動警報設備及自動撒水設備（含同等以上效能之滅火設備）"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-17","year":2023,"roc_year":112,"subject":"消防法規","category":"各類場所設置標準","no":17,"question":"依各類場所消防安全設備設置標準第 46 條，有關高架儲存倉庫設在貨架之撒水頭配置之規 定，下列敘述何者錯誤？","options":{"A":"任一點至撒水頭之水平距離，在 2.1 公尺以下，並以交錯方式設置","B":"儲存棉花類、塑膠類、木製品、紙製品或紡織製品等易燃物品時，每 4 公尺高度至少設置 一個；儲存其他物品時，每 6 公尺高度至少設置一個","C":"儲存之物品會產生撒水障礙時，該物品下方亦應設置","D":"設置符合各類場所消防安全設備設置標準第 47 條第 2 項規定之防護板。但使用經中央主 管機關認可之貨架撒水頭者，不在此限"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-18","year":2023,"roc_year":112,"subject":"消防法規","category":"各類場所設置標準","no":18,"question":"依各類場所消防安全設備設置標準第 123 條，有關光電式分離型探測器設置之規定，下列敘 述何者錯誤？","options":{"A":"設在與探測器光軸平行牆壁距離 60 公分以上之位置","B":"設在天花板等高度 20 公尺以下之場所","C":"探測器之光軸高度，在天花板等高度 50%以上之位置","D":"探測器之光軸與警戒區任一點之水平距離，在 7 公尺以下"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-19","year":2023,"roc_year":112,"subject":"消防法規","category":"各類場所設置標準","no":19,"question":"依各類場所消防安全設備設置標準之規定，有關特別安全梯或緊急昇降機間排煙室之排煙設 備設置排煙、進風風管時，排煙量、進風量在每秒 A 立方公尺（兼用時，每秒 B 立方公尺） 以上；另排煙口、進風口、排煙機及進風機連接緊急電源，其供電容量應供其有效動作 C 分 鐘以上。下列 A、B、C 何者正確？","options":{"A":"A=4，B=6，C=30","B":"A=4，B=8，C=30","C":"A=4，B=6，C=60","D":"A=4，B=8，C=60"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-20","year":2023,"roc_year":112,"subject":"消防法規","category":"各類場所設置標準","no":20,"question":"依各類場所消防安全設備設置標準之規定，當起火建築物為 5 樓以上，且總樓地板面積在 3000 平方公尺以上，火警自動警報設備鳴動後，於幾分鐘內或受信總機再接受火災信號時，應立 即全區鳴動？","options":{"A":"3","B":"5","C":"10","D":"15"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-21","year":2023,"roc_year":112,"subject":"消防法規","category":"各類場所設置標準","no":21,"question":"依各類場所消防安全設備設置標準之規定，應設置無線電通信輔助設備之場所，下列何者正 確？①樓高在 100 公尺以上建築物之地下層 ②地下層在 4 層以上，且地下層樓地板面積合 計在 3000 平方公尺以上建築物之地下層 ③總樓地板面積在 1000 平方公尺以上之地下建築 物 ④高層建築物","options":{"A":"①②③","B":"②③④","C":"①③④","D":"①②③④"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-22","year":2023,"roc_year":112,"subject":"消防法規","category":"各類場所設置標準","no":22,"question":"依各類場所消防安全設備設置標準之定義，消防搶救上之必要設備種類，下列何者正確？ ①一一九火災通報裝置 ②連結送水管 ③無線電通信輔助設備 ④防災監控系統綜合 操作裝置","options":{"A":"①②③","B":"②③④","C":"①③④","D":"①②③④"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-23","year":2023,"roc_year":112,"subject":"消防法規","category":"其他消防法規","no":23,"question":"依消防機關辦理建築物消防安全設備審查及查驗作業基準之規定，消防安全設備圖說審查及 竣工查驗之期限，以受理案件後 A 至 B 日內結案為原則。但供公眾使用建築物或構造複雜 者，得視需要延長，並通知申請人，最長不得超過 C 日。下列 A、B、C 何者正確？","options":{"A":"A=5；B=7；C=15","B":"A=7；B=10；C=20","C":"A=10；B=15；C=30","D":"A=15；B=20；C=30"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-24","year":2023,"roc_year":112,"subject":"消防法規","category":"檢修申報／檢修基準","no":24,"question":"依消防安全設備及必要檢修項目檢修基準之規定，在進行水道連結型自動撒水設備綜合檢查 時，下列敘述何者錯誤？","options":{"A":"於建築物各層放水壓力最低之最遠支管末端，打開末端查驗閥或連結之水龍頭等日常生活 用水設施，確認系統性能是否正常及壓力表之指示值，另設置末端查驗閥者，應設有與撒 水頭同等放水性能之限流孔","B":"設有增壓供水裝置者，於打開末端查驗閥或連結之水龍頭等日常生活用水設施降低配管內 的壓力後，該增壓供水裝置應於 5 分鐘後開始動作","C":"末端查驗閥或連結之水龍頭等日常生活用水設施配置的壓力表，其放水壓力應在 0.5 kgf/cm2 以上 10 kgf/cm2 以下","D":"增壓供水裝置應能確實啟動，且運轉中應無不規則、不連續之雜音或異常之振動、發熱等"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-25","year":2023,"roc_year":112,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":25,"question":"依消防安全設備及必要檢修項目檢修基準之規定，設有滅火器之可燃性高壓氣體儲存場所， 任一點至滅火器之步行距離應在多少公尺以下，並不得妨礙出入作業？","options":{"A":"15","B":"20","C":"30","D":"50"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-26","year":2023,"roc_year":112,"subject":"消防法規","category":"複合用途建築","no":26,"question":"依複合用途建築物判斷基準之規定，一棟建築物中供住宅使用之樓地板合計面積為 2500 平 方公尺，另供乙類場所之補習班（300 平方公尺）、訓練班（400 平方公尺）、K 書中心（500 平方公尺） 、兒童課後照顧服務中心（600 平方公尺）及金融機構（700 平方公尺） ，試問此一 棟建築物應視為下列何種用途建築物？","options":{"A":"複合用途建築物","B":"住宅用途建築物","C":"金融機構用途建築物","D":"各自用途之建築物"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-27","year":2023,"roc_year":112,"subject":"消防法規","category":"其他消防法規","no":27,"question":"依消防幫浦加壓送水裝置等及配管摩擦損失計算基準所述之技術用語定義，下列敘述何者 正確？","options":{"A":"加壓送水裝置等：水源之水位低於幫浦位置時，常時充水於幫浦及配管之裝置","B":"呼水裝置：消防栓開關開啟，配管內水壓降低，或撒水頭動作，自動啟動加壓送水裝置之 裝置","C":"幫浦性能試驗裝置：確認加壓送水裝置之全揚程及出水量之試驗裝置","D":"啟動用水壓開關裝置：由幫浦、電動機之加壓送水裝置及控制盤、呼水裝置、防止水溫上 升用排放裝置、幫浦性能試驗裝置、啟動用水壓開關裝置、底閥等附屬裝置或附屬機器所 構成"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-28","year":2023,"roc_year":112,"subject":"消防法規","category":"複合用途建築","no":28,"question":"依複合用途建築物判斷基準之規定，有關建築物主用途及從屬用途關係對照表所述，主用途 部分樓地板面積合計應超過該建築物總樓地板面積百分之 A 以上，且從屬用途部分之樓地板 面積合計未超過 B 平方公尺。下列 A 與 B 何者正確？","options":{"A":"A=85，B=400","B":"A=95，B=100","C":"A=80，B=500","D":"A=90，B=300"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-29","year":2023,"roc_year":112,"subject":"消防法規","category":"其他消防法規","no":29,"question":"依避難器具支固器具及固定部之結構、強度計算及施工方法之規定，有關裝置避難器具固定 部之承載荷重（kgf），下列敘述何者錯誤？","options":{"A":"緩降機之承載荷重為最大使用人數乘以 330","B":"袋長長度小於 10 公尺之直降式救助袋承載荷重為 660","C":"袋長長度小於 15 公尺之斜降式救助袋承載荷重上端為 375，下端為 285","D":"避難橋之承載荷重為每 1 平方公尺 330"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-30","year":2023,"roc_year":112,"subject":"消防法規","category":"其他消防法規","no":30,"question":"依消防安全設備測試報告書測試方法及判定要領，有關一一九火災通報裝置性能試驗之規定， 下列敘述何者錯誤？","options":{"A":"每一區段之蓄積語音應在 20 秒內","B":"蓄積語音應在發出撥號信號並偵測應答後自動送出","C":"可正確偵測回撥信號，確認信號時可以音效表示，通報裝置側的電話機回撥時，其與試驗 機之消防機關側電話機間應可相互通話","D":"操作手動啟動裝置或連動啟動（限與火警自動警報設備連動者），消防機關側保持不應答 時，從通報裝置應繼續送出蓄積語音"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-31","year":2023,"roc_year":112,"subject":"消防法規","category":"其他消防法規","no":31,"question":"依滅火器性能檢查及藥劑更換充填作業專業廠商認可及管理要點，有關申請專業廠商認可者， 應符合資格之規定，下列何者錯誤？","options":{"A":"取得公司或商業登記","B":"有必要之設備及器具","C":"有固定之作業場所","D":"置有專任符合消防法規定之消防專技人員（如消防設備師、消防設備士或暫行從事消防安 全設備裝置檢修人員）至少 2 人，且不得同時任職於其他工廠或公司（商業）"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-32","year":2023,"roc_year":112,"subject":"消防法規","category":"其他消防法規","no":32,"question":"依潔淨區消防安全設備設置要點之規定，潔淨室、上回風層、下回風層及回風豎井頂部應設 置密閉濕式自動撒水設備，並應符合之規定，下列敘述何者正確？","options":{"A":"撒水密度每平方公尺每分鐘 8 公升以上，其計算方式由中央消防主管機關另定之","B":"水源容量應在最遠之 20 個撒水頭連續放射 30 分鐘之水量以上。但撒水頭數未達 30 個者， 依實際撒水頭數計算水量","C":"氣淋室得免設撒水頭","D":"撒水頭應為一般反應型（第二種感度）"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-33","year":2023,"roc_year":112,"subject":"消防法規","category":"建築防火／原有合法建築","no":33,"question":"依原有合法建築物防火避難設施及消防設備改善辦法之規定，有關醫院、戲院、電影院、歌 廳、演藝場、商場（包括營業面積在 1500 平方公尺以上之加工服務部）、舞廳、遊藝場、集 會堂及市場等建築物，直通樓梯及平臺淨寬不得小於多少？","options":{"A":"75 公分","B":"1.2 公尺","C":"1.3 公尺","D":"1.4 公尺"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-34","year":2023,"roc_year":112,"subject":"消防法規","category":"住宅用火災警報器","no":34,"question":"依住宅用火災警報器設置辦法之規定，住宅用火災警報器安裝方式，下列何者正確？①裝置 於天花板或樓板者，警報器下端距離天花板或樓板 60 公分以內 ②裝置於天花板或樓板者， 裝設於距離牆面或樑 60 公分以上之位置 ③裝置於牆面者，距天花板或樓板下方 15 公分以 上 50 公分以下 ④距離出風口 1.5 公尺以上","options":{"A":"①②③","B":"②③④","C":"①③④","D":"①②③④"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-35","year":2023,"roc_year":112,"subject":"消防法規","category":"防焰","no":35,"question":"依防焰性能認證實施要點第 17 點之規定，有關防焰地毯得使用同一試驗合格號碼，惟其織 法、材質、形式、毛高、底材相同，僅花色不同者，同一試驗合格號碼至多 a 款試樣，須於 申請時檢附每款長 30 公分、寬 30 公分小樣供掃描建檔，試樣件數應一次提送，不可分次提 送；並於通過防焰性能試驗後於試驗報告書上註明試樣款數且附加測試件試樣。下列敘述何 者正確？","options":{"A":"a=9","B":"a=10","C":"a=11","D":"a=12"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-36","year":2023,"roc_year":112,"subject":"消防法規","category":"其他消防法規","no":36,"question":"依建築法之規定，試問將建築物之基礎、樑柱、承重牆壁、樓地板、屋架及屋頂，其中任何 一種有過半之修理或變更者，係屬下列那一項建造行為？","options":{"A":"修建","B":"新建","C":"增建","D":"改建"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-37","year":2023,"roc_year":112,"subject":"消防法規","category":"其他消防法規","no":37,"question":"依水道連結型自動撒水設備設置基準之規定，下列何者非屬水道連結型自動撒水設備的設置 目的與規定？","options":{"A":"水源容量：以四顆水道連結型撒水頭，持續放水 20 分鐘以上計算之","B":"所謂水道連結型自動撒水設備，指為控制火災、降低火場溫度及阻隔濃煙，而利用場所內 自來水系統連結水箱、增壓給水裝置、撒水配管、水道連結型撒水頭之簡易自動撒水滅火 設備","C":"水道連結型撒水頭放水量應在每分鐘 30 公升以上，最末端放水壓力應在每平方公分 0.5 公 斤以上或 0.05 百萬帕斯卡（MPa）以上","D":"設置水道連結型自動撒水設備之長期照顧服務機構等場所，其洗手間、浴室或廁所亦應設 置水道連結型撒水頭，住宅場所亦同"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-38","year":2023,"roc_year":112,"subject":"消防法規","category":"其他消防法規","no":38,"question":"依潔淨區消防安全設備設置要點之規定，排放易燃性氣體之排氣導管，其材質非不燃材料， 且排氣導管內最大截面積在多少平方公尺以上時，導管內部應設置自動撒水設備？","options":{"A":"0.048","B":"0.038","C":"0.025","D":"0.008"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-39","year":2023,"roc_year":112,"subject":"消防法規","category":"建築防火／原有合法建築","no":39,"question":"依建築技術規則建築設計施工編之規定，貫穿防火區劃牆壁或樓地板之風管、電力管線、通 訊管線及給排水管線或管線匣，與貫穿部位合成之構造，應具有多少小時以上之防火時效？","options":{"A":"3 小時以上","B":"2 小時以上","C":"1 小時以上","D":"半小時以上"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2023-消防法規-40","year":2023,"roc_year":112,"subject":"消防法規","category":"建築防火／原有合法建築","no":40,"question":"依原有合法建築物防火避難設施及消防設備改善辦法之規定，避難層樓地板面積超過多少平 方公尺者，至少應有 2 個不同方向之出入口？","options":{"A":"500","B":"400","C":"300","D":"250"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-01","year":2024,"roc_year":113,"subject":"消防法規","category":"消防法／施行細則","no":1,"question":"下列何者符合消防法第 13 條第 1 項所定一定規模以上建築物之界定範圍？","options":{"A":"總樓地板面積在 150 平方公尺以上之補習班或訓練班（運動訓練班除外）","B":"總樓地板面積在 200 平方公尺以上之餐廳及咖啡廳","C":"總樓地板面積在 300 平方公尺以上之百貨商場及超級市場","D":"觀光旅館及旅館"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-02","year":2024,"roc_year":113,"subject":"消防法規","category":"防火管理","no":2,"question":"有關消防防護計畫應包括事項內容，下列何者錯誤？","options":{"A":"自衛消防編組：員工在 10 人以上者，至少編組滅火班、通報班及避難引導班；員工在 50 人以上者，應增編安全防護班及救護班","B":"防火避難設施之自行檢查：每年至少檢查一次，檢查結果遇有缺失，應報告管理權人立即 改善","C":"滅火、通報及避難訓練之實施；每半年至少應舉辦一次，每次不得少於 4 小時，並應事先 通報當地直轄市、縣（市）主管機關","D":"應包括防災應變之教育訓練、用火及用電之監督管理、防止縱火措施、場所之位置圖、逃 生避難圖及平面圖"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-03","year":2024,"roc_year":113,"subject":"消防法規","category":"防火管理","no":3,"question":"共同消防防護計畫有關自衛消防編組指揮中心之組成方式，下列敘述何者正確？","options":{"A":"指揮中心應設指揮班、警戒班及滅火班，並得視需要增編收容安置班、水電設備班及後勤 班等，其所需人員由協議會協議組成之","B":"指揮中心應設指揮班、搜索班及滅火班，並得視需要增編危險物品班、交通運輸班及行政 班等，其所需人員由協議會協議組成之","C":"指揮中心應設指揮班、通報班及滅火班，並得視需要增編避難引導班、安全防護班及救護 班等，其所需人員由協議會協議組成之","D":"指揮中心應設指揮班、管制班及滅火班，並得視需要增編器材維護班、計劃管理班及清潔 班等，其所需人員由協議會協議組成之"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-04","year":2024,"roc_year":113,"subject":"消防法規","category":"防火管理","no":4,"question":"依防火管理人訓練與專業機構登錄及管理辦法之規定，防火管理人或共同防火管理人應經主 管機關或中央主管機關登錄之專業機構施予訓練，領有防火管理人訓練合格證書，始得充任。 有關複訓訓練時數不得少於幾小時及訓練項目分別為何？","options":{"A":"12 小時；防火管理對策、自衛消防編組實施要領及測驗","B":"6 小時；防火管理對策、自衛消防編組實施要領及測驗","C":"12 小時；員工教育及自衛消防編組訓練、消防防護計畫及測驗","D":"6 小時；員工教育及自衛消防編組訓練、消防防護計畫及測驗"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-05","year":2024,"roc_year":113,"subject":"消防法規","category":"其他消防法規","no":5,"question":"依服勤人員訓練與專業機構登錄及管理辦法之規定，服勤人員應經主管機關或中央主管機關 登錄之專業機構施予訓練，領有服勤人員訓練合格證書，始得充任。下列何者非屬中央主管 機關應停止專業機構施予服勤人員訓練 3 個月以上 6 個月以下之處分？","options":{"A":"一年內累計警告達 6 次以上","B":"經主管機關警告後並通知限期改善，屆期未改善或改善不完全","C":"委託未經中央主管機關登錄之機構辦理招生及訓練","D":"由未經中央主管機關審查合格之講師授課"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-06","year":2024,"roc_year":113,"subject":"消防法規","category":"消防設備人員制度","no":6,"question":"依消防設備人員專業訓練機關（構）學校團體認可及管理辦法之規定，申請消防設備人員專 業訓練機構、學校或團體認可，應具備資格及認可證書有效期間，下列敘述何者正確？","options":{"A":"職業訓練機構或法人，並設有訓練場地；認可證書有效期間為 2 年","B":"職業訓練機構或大專校院，並設有訓練場地；認可證書有效期間為 2 年","C":"職業訓練機構、法人或大專校院，並設有訓練場地；認可證書有效期間為 3 年","D":"職業訓練機構、法人或大專校院，並設有訓練場地；認可證書有效期間為 4 年"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-07","year":2024,"roc_year":113,"subject":"消防法規","category":"消防設備人員制度","no":7,"question":"依消防設備人員法及消防法規定，消防設備人員執行業務方式，以及違反設立事務所規定者 或執業機構執行業務規定之罰鍰額度，下列何者正確？","options":{"A":"受聘於依消防法規定應辦理消防安全設備檢修之場所為消防安全設備不實檢修報告者；處 新臺幣 6 萬元以上 30 萬元以下罰鍰","B":"設立以登記消防安全設備安裝工程業或消防安全設備檢修業為營業項目之公司、有限合夥、 商業或其他專業機構；處新臺幣 3 萬元以上 30 萬元以下罰鍰","C":"受聘於依工程技術顧問公司管理條例許可及登記之工程技術顧問公司；處新臺幣 3 萬元以 上 15 萬元以下罰鍰","D":"設立事務所（含分事務所）或組織聯合事務所；處新臺幣 2 萬元以上 10 萬元以下罰鍰"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-08","year":2024,"roc_year":113,"subject":"消防法規","category":"消防設備人員制度","no":8,"question":"依消防設備人員執業執照登記辦法規定，已領有消防設備人員證書並具有二年以上消防實務 經驗者，得檢具相關文件向消防設備人員法規定之事務所等執業機構所在地直轄市、縣（市） 主管機關提出申請登記及核發執業執照，有關二年以上消防實務經驗，下列敘述何者正確？","options":{"A":"曾於政府機關（構）、大專院校及公法人實際參與消防安全設備技術或工程執行工作","B":"曾於消防設備師公會或消防設備士公會從事消防安全設備圖說審查、竣工查驗或安全檢查 工作","C":"消防設備師與消防設備士之消防實務經驗，應包括一年以上實際參與消防安全設備設計、 監造、測試、檢修實務之經驗","D":"二年以上消防實務經驗應為專任之工作年資"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-09","year":2024,"roc_year":113,"subject":"消防法規","category":"各類場所設置標準","no":9,"question":"依據各類場所消防安全設備設置標準，下列何者不屬於緊急供電系統電源之設置規定？","options":{"A":"蓄電池設備充電電源之配線設專用回路，並應優先配置鋰鐵電池","B":"緊急電源使用符合 CNS、一○二○四規定之發電機設備、一○二○五規定之蓄電池設備或 具有相同效果之設備","C":"緊急電源裝置切換開關，於常用電源切斷時自動切換供應電源至緊急用電器具，並於常用 電源恢復時，自動恢復由常用電源供應","D":"發電機裝設適當開關或連鎖機件，以防止向正常供電線路逆向電力"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-10","year":2024,"roc_year":113,"subject":"消防法規","category":"其他消防法規","no":10,"question":"消防設備人員執行消防安全設備之設計、監造、測試及檢修業務，其圖說、紀錄、測試報告 書及檢修報告書之製作規定，下列敘述何者錯誤？","options":{"A":"圖說：由消防安全設備設計人員依電氣設備、水源管線、電信網路配線、瓦斯管路之必要 設備及其他經中央主管機關認定之消防安全設備等依序繪製","B":"紀錄：消防安全設備監造人員應依監造計畫執行監造事宜，依各類場所消防安全設備設置 標準規定設置之各類配管，於實施施工、加壓試驗及配合建築物樓地板、樑、柱、牆施工 須預埋消防管線時，應製作紀錄，並一併拍照建檔存證","C":"測試報告書：由消防安全設備測試人員將消防安全設備依序製表，並確認各項消防安全設 備之外觀、性能及綜合試驗符合規定","D":"檢修報告書：消防安全設備檢修人員依各種設備檢查表填具檢查結果；有消防安全設備不 符規定者，應清楚載明其不良狀況情形、位置及處置措施"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-11","year":2024,"roc_year":113,"subject":"消防法規","category":"消防設備人員制度","no":11,"question":"依據消防安全設備檢修專業機構管理辦法，合格證書有效期限為 W 年。檢修機構得於合格證 書有效期限屆滿前二個月至一個月內向中央主管機關申請延展，每次延展期限為 X 年，但消 防設備師或消防設備士檢修不實經裁罰達 Y 件以上，不予許可其延展，且於 Z 年不得重新申 請。WXYZ 之總和為多少？","options":{"A":"12","B":"11","C":"10","D":"9"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-12","year":2024,"roc_year":113,"subject":"消防法規","category":"消防設備人員制度","no":12,"question":"依消防設備人員法第 14 條規定，消防設備人員辦理各項業務，應遵守誠信原則，不得容許他 人借用本人名義執行業務。違反此規定之罰則為何？","options":{"A":"停止執行業務 6 個月以上 2 年以下，併處新臺幣 3 萬元以上 15 萬元以下罰鍰","B":"停止執行業務 6 個月以上 3 年以下，併處新臺幣 5 萬元以上 25 萬元以下罰鍰","C":"停止執行業務 9 個月以上 4 年以下，併處新臺幣 10 萬元以上 50 萬元以下罰鍰","D":"停止執行業務 1 年以上 5 年以下，併處新臺幣 10 萬元以上 50 萬元以下罰鍰"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-13","year":2024,"roc_year":113,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":13,"question":"為強化使用中儲存液體公共危險物品儲槽之整體安全性，消防法第 15 條之 5 第 4 項規定儲 存液體公共危險物品之儲槽達中央主管機關公告一定規模者，其管理權人於開始使用後，應 委託專業機構實施定期檢查，作成紀錄，並至少保存（A）年；公告生效前已設置之儲槽，應 自公告生效之日起（B）年內完成初次定期檢查，其所定之一定規模之儲槽容量（C）如未依 規定期限完成初次定期檢查者，處罰鍰額度（D），下列敘述何者正確？","options":{"A":"A＝3、B＝3、C＝1 萬公秉以上之室內儲槽、D＝新臺幣 6 千以上 3 萬元以下","B":"A＝4、B＝4、C＝1 萬公秉以上之室內儲槽、D＝新臺幣 1 萬元以上 5 萬元以下","C":"A＝5、B＝5、C＝1 萬公秉以上之室外儲槽、D＝新臺幣 2 萬元以上 10 萬元以下","D":"A＝6、B＝6、C＝1 萬公秉以上之室外儲槽、D＝新臺幣 2 萬元以上 30 萬元以下"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-14","year":2024,"roc_year":113,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":14,"question":"消防法第 15 條之 5 第 3 項所定儲存液體公共危險物品之儲槽起造人申請使用執照前應完成 之檢查，下列何者並非其檢查項目？","options":{"A":"滿水檢查：室內及室外之非壓力儲槽","B":"靜電接地檢查：預防雷擊與靜電造成儲槽之危害","C":"水壓檢查：壓力儲槽及設置於地下之非壓力儲槽","D":"地盤及基礎、熔接檢查：容量達一千公秉以上之儲槽"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-15","year":2024,"roc_year":113,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":15,"question":"依據公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法，第五類公 共危險物品之有機過氧化物，其 A 型及 C 型之分級管制量分別為多少？","options":{"A":"30 公斤、300 公斤","B":"20 公斤、200 公斤","C":"10 公斤、100 公斤","D":"5 公斤、50 公斤"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-16","year":2024,"roc_year":113,"subject":"消防法規","category":"防焰","no":16,"question":"各類防焰物品或其材料之防焰性能試驗結果具有防焰性能之規定，下列敘述何者正確？","options":{"A":"地毯：餘焰時間在 30 秒以下；碳化距離在 20 公分以下","B":"纖維製品：餘焰時間：薄纖維製品在 10 秒以下，厚纖維製品在 15 秒以下","C":"試體為經接觸火源產生收縮之纖維製品：碳化距離在 30 公分以下","D":"展示用廣告板：餘焰時間在 10 秒以下；餘燃時間在 30 秒以下；碳化面積在 50 平方公分以下"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-17","year":2024,"roc_year":113,"subject":"消防法規","category":"防焰","no":17,"question":"依防焰性能認證實施辦法規定，申請防焰性能認證之製造業者，應符合相關規定，下列敘述 何者正確？","options":{"A":"處理不須再經防焰處理即已具防焰性能之產品，仍應設置鑑別欲施以防焰處理之布料及其 他材料之器具","B":"設置測試防焰性能用機器、測試耐洗性能用水洗機或乾洗機等品質管理用機器","C":"訂有物料、產品之檢查基準及其檢查結果之品質管理方法","D":"品質管理部門應置 2 名以上防焰處理技術人員"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-18","year":2024,"roc_year":113,"subject":"消防法規","category":"檢修申報／檢修基準","no":18,"question":"依消防安全設備及必要檢修項目檢修基準第 15 章瓦斯漏氣火警自動警報設備規定，有關不 得設置瓦斯漏氣檢知器之處所，下列敘述何者錯誤？","options":{"A":"在出入口附近外氣流通處","B":"距吸氣口 1.5 公尺範圍內","C":"瓦斯燃燒器具之廢氣容易接觸處","D":"明顯無法確保檢知器性能處"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-19","year":2024,"roc_year":113,"subject":"消防法規","category":"消防設備人員制度","no":19,"question":"依消防安全設備檢修專業機構管理辦法規定，申請消防安全設備檢修專業機構許可者，經書 面審查合格，應實地審查；經實地審查合格者，應以書面通知申請人於一定期限內，檢具已 投保意外責任保險證明文件後，予以許可並發給消防安全設備檢修專業機構證書。有關所定 意外責任保險之最低保險金額為何？","options":{"A":"每一個人身體傷亡新臺幣 4 百萬元、每一事故身體傷亡 3 千 5 百萬元、每一事故財產損失 3 百萬元、保險期間總保險金額 6 千 4 百萬元","B":"每一個人身體傷亡新臺幣 3 百萬元、每一事故身體傷亡 3 千萬元、每一事故財產損失 2 百 萬元、保險期間總保險金額 6 千 4 百萬元","C":"每一個人身體傷亡新臺幣 2 百萬元、每一事故身體傷亡 2 千 5 百萬元、每一事故財產損失 1 百 50 萬元、保險期間總保險金額 6 千萬元","D":"每一個人身體傷亡新臺幣 1 百 50 萬元、每一事故身體傷亡 2 千萬元、每一事故財產損失 1 百萬元、保險期間總保險金額 5 千 6 百萬元"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-20","year":2024,"roc_year":113,"subject":"消防法規","category":"其他消防法規","no":20,"question":"有關消防安全設備設計監造測試及檢修作業，下列敘述何者錯誤？","options":{"A":"消防安全設備為滅火器、標示設備或緊急照明燈等非系統式設備者，應訂定特別監造計畫","B":"消防安全設備設計人員受委託設計之消防安全設備圖說，應合於消防法、各類場所消防安 全設備設置標準及其他有關法令之規定；其設計內容，應使消防安全設備合於功能，並使 消防安全設備施工廠商可按圖施工","C":"消防安全設備施工前，消防安全設備監造人員應訂定監造計畫，送交委託人審閱，並依監 造計畫執行消防安全設備監造及填寫紀錄","D":"監造計畫，其製作綱要應包含監造範圍、監造組織與權責分工、品質計畫審查作業程序、 施工計畫審查作業程序、材料設備抽驗程序與標準、設備功能運轉測試抽驗程序與標準、 施工抽查程序與標準、品質稽核及文件紀錄管理系統"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-21","year":2024,"roc_year":113,"subject":"消防法規","category":"建築防火／原有合法建築","no":21,"question":"依原有合法建築物公共安全改善辦法規定，下列敘述何者不屬於消防設備之改善？","options":{"A":"自室內通陽臺或進入排煙室之出入口，應裝設具有一小時以上防火時效及遮煙性之防火門， 自陽臺或排煙室進入樓梯間之出入口應裝設具有半小時以上防火時效之防火門","B":"已敷設於建築物內之消防設備，如消防水池、消防立管、消防栓、滅火設備、警報設備、 避難器具等設備，其功能正常者得維持原有使用","C":"滅火設備之施工及結構安全確有困難者，應設有與現行法令同等滅火效能之滅火設備","D":"排煙設備之施工及結構安全確有困難者，於樓地板面積每一百平方公尺以防煙壁區劃間隔， 且天花板及牆面之室內裝修材料使用不燃材料或耐燃材料"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-22","year":2024,"roc_year":113,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":22,"question":"有關消防安全設備設置標準用語定義，高度危險工作場所，指儲存一般可燃性固體物質倉庫 之高度超過 T 公尺者，或易燃性液體物質之閃火點未超過攝氏 U 度與攝氏溫度為 V 時，其 蒸氣壓未超過每平方公分 W 公斤或 X 百萬帕斯卡（MPa）者，或可燃性高壓氣體製造、儲 存、處理場所或石化作業場所，木材加工業作業場所及油漆作業場所等。請問 TUVWX 各為 多少？","options":{"A":"7.5/ 80/ 39.8/ 4.8/ 0.48","B":"6.5/ 70/ 38.8/ 3.8/ 0.38","C":"5.5/ 60/ 37.8/ 2.8/ 0.28","D":"4.5/ 50/ 36.8/ 1.8/ 0.18"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-23","year":2024,"roc_year":113,"subject":"消防法規","category":"各類場所設置標準","no":23,"question":"依各類場所消防安全設備設置標準規定，下列場所對應之用途分類分別為何：護理機構（一 般護理之家、精神護理之家、產後護理機構） 、地下建築物、高度危險工作場所、博物館、室 內停車場及建築物依法附設之室內停車空間。","options":{"A":"乙、丙、戊、丁、甲","B":"丙、甲、乙、戊、丁","C":"甲、戊、丁、乙、丙","D":"丁、乙、甲、丙、戊"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-24","year":2024,"roc_year":113,"subject":"消防法規","category":"消防設備人員制度","no":24,"question":"依消防設備人員法施行細則規定，消防設備人員受撤銷、廢止執業執照或停止執行業務之處 分者，應於處分送達之次日起幾日內，將執業執照繳回執業登記所在地之直轄市、縣（市） 主管機關註銷或收存？","options":{"A":"21 日","B":"14 日","C":"10 日","D":"7日"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-25","year":2024,"roc_year":113,"subject":"消防法規","category":"各類場所設置標準","no":25,"question":"依複合用途建築物判斷基準之規定，符合下列規定時，視為設置標準第 12 條第 5 款第 2 目之 複合用途建築物。複合用途建築物中，甲類場所樓地板面積合計小於該建築物總樓地板面 積 X%。複合用途建築物中，甲類場所樓地板面積合計未滿 Y 平方公尺。X+Y 是多少？","options":{"A":"320","B":"310","C":"300","D":"290"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-26","year":2024,"roc_year":113,"subject":"消防法規","category":"各類場所設置標準","no":26,"question":"依各類場所消防安全設備設置標準第 159 條規定，各類場所之各樓層符合規定者，其應設之 避難器具得免設，下列敘述何者正確？","options":{"A":"主要構造為防火構造，居室面向戶外部分，設有陽臺等有效避難設施，且該陽臺等設施設 有可通往地面之樓梯或通往他棟建築物之設施","B":"主要構造為防火構造，由居室或住戶可直接通往直通樓梯，且該居室或住戶所面向之直通 樓梯，設有隨時可自動關閉之具一小時以上防火時效之防火門（不含防火鐵捲門） ，且收容 人員未滿 40 人","C":"長期照顧服務機構各樓層以具半小時以上防火時效之牆壁及防火設備分隔為二個以上之區 劃，各區劃均以走廊連接安全梯，或分別連接不同安全梯","D":"兒童及少年福利機構設有自動撒水設備（含同等以上效能之滅火設備）"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-27","year":2024,"roc_year":113,"subject":"消防法規","category":"各類場所設置標準","no":27,"question":"依各類場所消防安全設備設置標準有關泡沫滅火設備規定，下列敘述何者正確？","options":{"A":"泡沫滅火設備之放射區域，使用泡沫噴頭時，每一放射區域在樓地板面積 100 平方公尺以 上 200 平方公尺以下","B":"泡沫滅火設備之放射區域，使用泡水噴頭時，放射區域占其樓地板面積三分之一以上，且 至少 200 平方公尺。但樓地板面積未達 200 平方公尺者，放射區域依其實際樓地板面積計算","C":"移動式泡沫滅火設備之水源容量，在二具泡沫瞄子同時放水 20 分鐘之水量以上","D":"泡沫原液與水混合使用之濃度，蛋白質泡沫液為 5%或 10%"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-28","year":2024,"roc_year":113,"subject":"消防法規","category":"各類場所設置標準","no":28,"question":"依各類場所消防安全設備設置標準規定，有關瓦斯漏氣火警自動警報設備之配線，除依用戶 用電設備裝置規則外，有關設置規定，下列敘述何者錯誤？","options":{"A":"電源回路導線間及導線對大地間之絕緣電阻值，以直流 600 伏特額定之絕緣電阻計測定，對 地電壓在 160 伏特以下者，應在 0.1 MΩ 以上，對地電壓超過 160 伏特者，在 0.2 MΩ 以上","B":"檢知器回路導線間及導線與大地間之絕緣電阻值，以直流 500 伏特額定之絕緣電阻計測定， 每一警報分區在 0.1 MΩ 以上","C":"常開式檢知器信號回路之配線採用串接式，並加設終端電阻，以便藉由瓦斯漏氣受信總機 作斷線自動檢出用","D":"檢知器回路不得與瓦斯漏氣火警自動警報設備以外之設備回路共用"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-29","year":2024,"roc_year":113,"subject":"消防法規","category":"其他消防法規","no":29,"question":"依消防安全設備測試報告書測試方法及判定要領第 2 章室內消防栓設備規定，有關加壓送水 裝置消防幫浦試驗，關閉幫浦出水側之止水閥，測定全閉揚程、電壓及電流。其中全閉揚程 應在額定負荷運轉時之測得揚程的多少%以下？","options":{"A":"110","B":"120","C":"130","D":"140"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-30","year":2024,"roc_year":113,"subject":"消防法規","category":"其他消防法規","no":30,"question":"依滅火器性能檢查及藥劑更換充填作業專業廠商認可及管理要點規定，為確保滅火器性能檢 查及藥劑更換充填作業品質，專業廠商應每 A 年會同當地消防機關，就滅火器性能檢查及藥 劑更換充填作業登記清冊抽樣 B 具，送內政部登錄機構就噴射時間、藥劑充填量、藥劑主成 分等項目進行檢測及保存。但滅火器抽樣檢測連續合格達 C 次者，得 D 年內免再辦理抽樣檢 測，有關 A、B、C 及 D 之敘述下列何者正確？","options":{"A":"A＝3 個月、B＝1 具、C＝2 次、D＝1 年","B":"A＝半年、B＝1 具、C＝2 次、D＝2 年","C":"A＝半年、B＝2 具、C＝2 次、D＝1 年","D":"A＝1 年、B＝2 具、C＝3 次、D＝2 年"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-31","year":2024,"roc_year":113,"subject":"消防法規","category":"各類場所設置標準","no":31,"question":"依據各類場所消防安全設備設置標準，緊急供電系統之配線除依用戶用電設備裝置規則外， 下列敘述何者錯誤？","options":{"A":"緊急用電源回路及操作回路，使用 300 伏特耐熱絕緣電線，或同等耐熱效果以上之電線","B":"電源回路之配線，應施予耐燃保護，電線裝於金屬導線管槽內，並埋設於防火構造物之混 凝土內，混凝土保護厚度為 20 毫米以上","C":"使用 MI 電纜或耐燃電纜時，得按電纜裝設法，直接敷設","D":"電氣配線應設專用回路，不得與一般電路相接，且開關有消防安全設備別之明顯標示"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-32","year":2024,"roc_year":113,"subject":"消防法規","category":"其他消防法規","no":32,"question":"依消防機具器材及設備認可實施辦法規定，委託他人製造生產消防機具器材及設備者，有關 申請型式認可應依規定辦理事項，下列敘述何者錯誤？","options":{"A":"檢附勞務委託契約證明文件，契約內容應載明產品於製造、加工、組裝及試驗時，契約雙 方之權利義務關係及其他必要事項","B":"試驗設備、試驗設備之維護管理及試驗場所概要說明書、品質管理說明書產品之設計圖等 文件，應有契約雙方負責人及公司之簽章","C":"使用受託者之試驗設備者，其試驗紀錄須有受託者操作人員及委託者會同人員之簽章","D":"產品有型式變更者，應由產製者提出申請"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-33","year":2024,"roc_year":113,"subject":"消防法規","category":"各類場所設置標準","no":33,"question":"依潔淨區消防安全設備設置要點規定，潔淨區應依各類場所消防安全設備設置標準第 28 條 規定，檢討設置或免設排煙設備。下列何者非屬上述免設排煙設備之條件？","options":{"A":"為防火構造建築物","B":"避難步行距離符合建築技術規則建築設計施工編第 93 條之規定","C":"設有吸氣式偵煙探測系統","D":"設置室內消防栓設備"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-34","year":2024,"roc_year":113,"subject":"消防法規","category":"住宅用火災警報器","no":34,"question":"依住宅用火災警報器設置辦法規定，有關住宅用火災警報器之裝置，下列敘述何者錯誤？","options":{"A":"警報器下端距離天花板或樓板 60 公分以內","B":"裝設於距離牆面或樑 60 公分以上之位置","C":"裝置於牆面者，距天花板或樓板下方 15 公分以上 45 公分以下","D":"距離出風口 1.5 公尺以上"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-35","year":2024,"roc_year":113,"subject":"消防法規","category":"消防法／施行細則","no":35,"question":"依消防法有關消防設備人員獨占業務之規定，下列敘述何者錯誤？","options":{"A":"依各類場所消防安全設備設置標準設置之消防安全設備，其設計、監造應由消防設備師為 之；其測試、檢修應由消防設備師或消防設備士為之","B":"消防安全設備之設計、監造、測試及檢修，得由現有相關專門職業及技術人員或技術士暫 行為之；其期限至本法中華民國一百十二年五月三十日修正之條文施行之日起三年止","C":"開業建築師、電機技師得執行滅火器、標示設備或緊急照明燈等非系統式消防安全設備之 設計、監造或測試、檢修","D":"高層建築物、地下建築物或中央主管機關公告之場所應委託中央主管機關許可之消防安全 設備檢修專業機構辦理"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-36","year":2024,"roc_year":113,"subject":"消防法規","category":"各類場所設置標準","no":36,"question":"設有符合各類場所消防安全設備設置標準之自動撒水設備或同等性能以上之滅火設備者，在 該有效範圍內，得免設置住宅用火災警報器。上述滅火設備應限制條件為何？","options":{"A":"限使用標示溫度在 90 度以下，動作時間在 75 秒以內之密閉型撒水頭","B":"限使用標示溫度在 85 度以下，動作時間在 70 秒以內之密閉型撒水頭","C":"限使用標示溫度在 80 度以下，動作時間在 65 秒以內之密閉型撒水頭","D":"限使用標示溫度在 75 度以下，動作時間在 60 秒以內之密閉型撒水頭"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2024-消防法規-37","year":2024,"roc_year":113,"subject":"消防法規","category":"住宅用火災警報器","no":37,"question":"關於住宅用火災警報器之安裝位置，下列何者錯誤？","options":{"A":"寢室、旅館客房或其他供就寢用之居室","B":"廚房","C":"樓梯：有寢室之樓層。但該樓層為避難層者，不在此限。僅避難層有寢室者，通往上層樓 梯之最頂層","D":"任一樓層有超過 10 平方公
