<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>消防設備師｜消防法規刷題</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#17202a;--muted:#68737d;--line:#dfe4e8;--accent:#ad2430;--ok:#157347;--bad:#b02a37;--chip:#eef1f4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif}
.wrap{max-width:920px;margin:auto;padding:24px 18px 56px}h1{font-size:26px;margin:0 0 6px}.sub{color:var(--muted);margin-bottom:20px}
.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:14px}.panel{padding:14px;margin-bottom:16px}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr auto auto auto;gap:10px}select,button{font:inherit;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px}
button{cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.stats{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:12px}
.card{padding:22px}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.badge{background:var(--chip);border-radius:999px;padding:5px 9px;font-size:13px;color:#45515c}
.question{font-size:20px;line-height:1.7;margin:12px 0 18px}.options{display:grid;gap:10px}.option{display:flex;gap:12px;text-align:left;width:100%;padding:14px;border:1px solid var(--line);background:#fff;border-radius:11px;line-height:1.55}
.option:hover{border-color:#9aa5ad}.option.selected{border-color:#555;background:#f4f5f6}.option.correct{border-color:var(--ok);background:#eef8f2}.option.wrong{border-color:var(--bad);background:#fff0f1}
.letter{font-weight:800;min-width:22px}.feedback{margin-top:16px;padding:12px 14px;border-radius:10px;display:none}.feedback.ok{display:block;background:#eef8f2;color:#0c5b36}.feedback.bad{display:block;background:#fff0f1;color:#842029}
.actions{display:flex;gap:10px;justify-content:space-between;margin-top:18px}.right{display:flex;gap:10px}.progress{height:7px;background:#e9ecef;border-radius:999px;overflow:hidden;margin-bottom:16px}.bar{height:100%;background:var(--accent);width:0}
.empty{padding:30px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:center;justify-content:center;padding:20px;z-index:999}.modal.show{display:flex}.modalBox{width:min(440px,100%);background:#fff;border-radius:16px;padding:22px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.18)}.modalBox h2{margin:0 0 14px}.summaryGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.summaryItem{background:var(--bg);border-radius:10px;padding:12px}.summaryItem b{display:block;font-size:22px;margin-top:4px}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
@media(max-width:700px){.controls{grid-template-columns:1fr 1fr}.controls button{grid-column:span 1}.question{font-size:18px}.card{padding:16px}}
</style></head>
<body><div class="wrap">
<h1>消防設備師｜消防法規刷題</h1>
<div class="sub">考選部歷屆選擇題 2010–2026，共 <span id="totalAll"></span> 題。點選選項立即判定；每題標註年份、民國年、類別與題號。</div>
<div class="panel">
<div class="controls">
<select id="year"><option value="all">全部年份</option></select>
<select id="category"><option value="all">全部類別</option></select>
<select id="mode"><option value="random" selected>隨機刷題</option><option value="sequential">依年份順序</option><option value="wrong">只刷錯題</option><option value="bookmarked">只刷收藏</option></select>
<button id="apply" class="primary">開始／重新篩選</button><button id="settle">結算</button><button id="resetRecords">重置紀錄</button>
</div>
<div class="stats"><span>本輪：<b id="roundCount">0</b> 題</span><span>已答：<b id="answered">0</b></span><span>答對：<b id="correct">0</b></span><span>正確率：<b id="rate">—</b></span></div>
</div>
<div class="progress"><div id="bar" class="bar"></div></div><div id="quiz"></div>
</div><div id="settleModal" class="modal"><div class="modalBox"><h2>本輪結算</h2><div id="settleBody"></div><div class="modalActions"><button id="closeSettle" class="primary">關閉</button></div></div></div>
<script>
const QUESTIONS=[{"id":"2010-消防法規-01","year":2010,"roc_year":99,"subject":"消防法規","category":"其他消防法規","no":1,"question":"區分所有權之建築物，未有契約特別約定狀況下，其管理權人認定，下列何者為正確？","options":{"A":"以所有人或使用人中，具管理權者，為管理權人","B":"滅火器之設置或維護，為所有人","C":"防焰物品之設置或維護，為所有人","D":"自動撒水設備加壓送水裝置之設置或維護，為使用人"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-02","year":2010,"roc_year":99,"subject":"消防法規","category":"其他消防法規","no":2,"question":"對感熱式探測器種類及設置埸所之組合，下列何者有誤？","options":{"A":"顯著高溫狀態場所內設置定溫式局限型一種","B":"會結露的場所內設置定溫式局限型特種","C":"會散發腐蝕性氣體之場所應設差動式局限型二種","D":"常有水蒸氣滯留的場所內使用差動式分布型空氣管二種，而檢出器設置於室外"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-03","year":2010,"roc_year":99,"subject":"消防法規","category":"其他消防法規","no":3,"question":"各類場所管理權人認定，下列何者有誤？","options":{"A":"由總公司直營之連鎖店，為總公司之負責人","B":"數機關共同使用一建築物並成立管理委員會者，為管理委員會主任委員","C":"所有權未區分之建築物，為所有人","D":"集合住宅共用部分、約定共用部分，為管理委員會或管理負責人"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-04","year":2010,"roc_year":99,"subject":"消防法規","category":"其他消防法規","no":4,"question":"關於型式認可，下列敘述何者為正確？","options":{"A":"型式認可合格者，由內政部核發型式認可書","B":"申請型式認可應檢附內政部消防署出具之試驗報告","C":"型式認可經審查合格，得領用型式認可標示","D":"自國外進口之消防器材，依申請人所提具之資料文件審查外，並應派員會同實施型式試驗"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-05","year":2010,"roc_year":99,"subject":"消防法規","category":"其他消防法規","no":5,"question":"消防機具、器材及設備認可作業規定，有關試驗中發現之缺點，下列敘述何者為正確？","options":{"A":"標示錯誤，致使用上對機具、器材及設備之功能產生障礙之虞者，為一般缺點","B":"無法達到機具、器材及設備之基本功能者，為嚴重缺點","C":"同一樣品有不同等級之缺點者，列為致命缺點","D":"同一樣品有二項以上相同等級之缺點者，列為嚴重缺點"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-06","year":2010,"roc_year":99,"subject":"消防法規","category":"其他消防法規","no":6,"question":"關於消防機具、器材及設備認可作業規定之敘述，下列何者有誤？","options":{"A":"個別認可之抽樣試驗，產品第一次申請試驗時，應以嚴格試驗為之","B":"輕微變更時，以變更前之試驗等級進行試驗","C":"個別認可依機具、器材及設備之種類、試驗項目及數量，分為全數試驗或抽樣試驗","D":"生產或進口數量較少者，得適用少量生產或少量進口之普通試驗"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-07","year":2010,"roc_year":99,"subject":"消防法規","category":"其他消防法規","no":7,"question":"關於型式認可與個別認可，下列敘述何者為正確？","options":{"A":"取得型式認可，未經個別認可，其消防器材可以領用認可標示","B":"未取得型式認可，假如個別認可合格，其消防器材可以領用認可標示","C":"取得型式認可，假如個別認可不合格，其消防器材可以部分領用認可標示","D":"取得型式認可書之日起二年內，應申請個別認可"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-08","year":2010,"roc_year":99,"subject":"消防法規","category":"防焰","no":8,"question":"關於防焰性能試驗之敘述，下列何者有誤？","options":{"A":"經接觸火源時會產生熔融之纖維製品時，應追加四十五度線圈法（接焰次數試驗）","B":"經接觸火源時會產生收縮之纖維製品時，應追加四十五度鬆弛法","C":"厚纖維製品應使用四十五度空氣混合焰法","D":"地毯等地坪舖設物應使用四十五度空氣混合焰法"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-09","year":2010,"roc_year":99,"subject":"消防法規","category":"防焰","no":9,"question":"橡膠製或合成樹脂製，邊長 30 公分正方形或其他不同規則形狀之地坪舖設物，以拼裝之方式，組合成任 意形狀，其面積在多少平方公尺以上時，視為防焰物品？","options":{"A":"二平方公尺","B":"四平方公尺","C":"十平方公尺","D":"二十平方公尺"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-10","year":2010,"roc_year":99,"subject":"消防法規","category":"防焰","no":10,"question":"下列何者，係屬應使用防焰物品之場所？","options":{"A":"樓地板面積二百平方公尺之百貨商場","B":"樓地板面積二百平方公尺之餐廳","C":"樓地板面積一百五十平方公尺之安養中心","D":"樓地板面積一百五十平方公尺之補習班"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-11","year":2010,"roc_year":99,"subject":"消防法規","category":"防焰","no":11,"question":"為查核防焰物品，中央主管機關得自行或委由各級消防機關進行何種檢驗？","options":{"A":"抽樣檢驗或購樣檢驗","B":"性能檢驗或綜合檢驗","C":"外觀檢驗或性能檢驗","D":"外觀檢驗或綜合檢驗"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-12","year":2010,"roc_year":99,"subject":"消防法規","category":"防焰","no":12,"question":"防焰物品製造業者，有關品質管理機器設備，下列敘述何者有誤？","options":{"A":"應設置測試防焰性能之試驗機器","B":"應設置測試耐洗性能之洗衣機或乾洗機","C":"製造地毯者，得免設測試防焰性能之試驗機器","D":"產品製造出廠前，應逐批以自有之試驗設備進行防焰性能試驗"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-13","year":2010,"roc_year":99,"subject":"消防法規","category":"防焰","no":13,"question":"關於防焰性能試驗法之火焰長度，下列何者有誤？","options":{"A":"45 度空氣混合焰法，火焰長度為 24 mm","B":"45 度線圈法，火焰長度為 30 mm","C":"45 度小焰燃燒器法，火焰長度為 45 mm","D":"45 度大焰燃燒器法，火焰長度為 65 mm"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-14","year":2010,"roc_year":99,"subject":"消防法規","category":"防焰","no":14,"question":"關於展示用廣告板之防焰規定，下列敘述何者為誤？","options":{"A":"展示用廣告板包括供舞台使用之大型道具合板","B":"展示用廣告板包括作為專櫃隔間使用之背板、隔間板及桌台等","C":"半永久性陳列之展示用廣告板不必列為防焰物品","D":"一般店舖以垂掛方式裝設之合板不必使用具防焰性能者"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-15","year":2010,"roc_year":99,"subject":"消防法規","category":"防焰","no":15,"question":"關於防焰性能試驗基準用語定義之敘述，下列何者為正確？","options":{"A":"點火時間係指自火源點火接觸試樣起，至停止接觸之時間","B":"餘燃時間係指自點火時間終了起，至試樣停止燃燒之時間","C":"餘焰時間係指自點火時間終了起，試樣之火焰繼續燃燒之時間","D":"接焰次數係指試樣經接觸火源至完全收縮時之接觸火焰次數"},"answers":["A","B","C"],"answer_note":"官方更正：答A或B或C者均給分","source":"考選部歷屆試題"},{"id":"2010-消防法規-16","year":2010,"roc_year":99,"subject":"消防法規","category":"防焰","no":16,"question":"下列何者，不屬應具有防焰性能之防焰物品？","options":{"A":"醫院診療室所使用之纖維製遮簾","B":"醫院更衣室所使用之纖維製隔屏","C":"沿著牆面掛設之簾布裝飾物","D":"木質百葉窗"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-17","year":2010,"roc_year":99,"subject":"消防法規","category":"防火管理","no":17,"question":"自衛消防編組演練及驗證，有關臨界時間設算，下列何者不是計算延長時間之條件？","options":{"A":"設有自動撒水設備","B":"初期滅火使用室內消防栓","C":"寢具類使用防焰製品","D":"形成各居室不燃化區劃"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-18","year":2010,"roc_year":99,"subject":"消防法規","category":"其他消防法規","no":18,"question":"一定規模以上供公眾使用建築物施工時，對於消防安全設備機能有停止必要之規定，下列敘述何者為正確？","options":{"A":"停止消防安全設備機能之工程，應儘量在營業時間以外進行，但飯店等全天營業之場所，應在日間進行","B":"火警自動警報設備停止使用時，應增設滅火器或室內消防栓之水帶等","C":"緊急廣播設備停止使用時，應移設至能裝設之場所","D":"自動撒水設備之機能停止時，應視工程狀況，採臨時裝設方式，使其發揮作用"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-19","year":2010,"roc_year":99,"subject":"消防法規","category":"其他消防法規","no":19,"question":"關於應實施防火管理之場所，下列何者有誤？","options":{"A":"總樓地板面積三百平方公尺之餐廳","B":"總樓地板面積五百平方公尺之百貨商場","C":"總樓地板面積五百平方公尺，其員工為三十人之工廠","D":"收容人數為 90 人之寄宿舍"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-20","year":2010,"roc_year":99,"subject":"消防法規","category":"其他消防法規","no":20,"question":"有關共同防火管理業務雖然可以委託保全公司或樓管公司等來執行，但並未包括下列何者？","options":{"A":"建築物增建、改建、修建、室內裝修等工程施工中之安全對策","B":"滅火、通報、避難訓練之實施","C":"防火避難設施之維護管理","D":"自衛消防編組"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-21","year":2010,"roc_year":99,"subject":"消防法規","category":"其他消防法規","no":21,"question":"關於共同防火管理，下列敘述何者有誤？","options":{"A":"共同消防防護計畫由管理權人互推一人為召集人協議製定","B":"無法依規定互推召集人時，防火管理人得申請直轄市、縣（市）消防機關指定之","C":"集合住宅如屬 11 層以上之建築物應實施共同防火管理","D":"應設置共同防火管理協議會"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-22","year":2010,"roc_year":99,"subject":"消防法規","category":"其他消防法規","no":22,"question":"關於火源責任者及防火負責人，下列敘述何者為正確？","options":{"A":"設置火源責任者，係以樓層或區域為範圍","B":"茶水間等指定區域範圍內之用火用電安全管理工作，由防火負責人擔任，並定期檢查回報","C":"防火管理人得視場所規模、用途，依棟、樓或區，劃設責任區域，分別設置防火負責人及火源責任者","D":"火源責任者之任務為輔助防火管理人，並指導、監督防火負責人"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-23","year":2010,"roc_year":99,"subject":"消防法規","category":"防火管理","no":23,"question":"依消防防護計畫實施滅火、通報及避難訓練，至少多久（a）應舉辦一次，每次不得少於多少（b）時間？","options":{"A":"a：每半年 b：四小時","B":"a：每半年 b：六小時","C":"a：每年 b：四小時","D":"a：每年 b：八小時"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-24","year":2010,"roc_year":99,"subject":"消防法規","category":"防火管理","no":24,"question":"施工中消防防護計畫，應於何時提報？","options":{"A":"開工前三天","B":"開工前五天","C":"開工前七天","D":"開工前十天"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-25","year":2010,"roc_year":99,"subject":"消防法規","category":"其他消防法規","no":25,"question":"關於乾粉滅火設備加、蓄壓用氣體量，下列何者為正確？","options":{"A":"加壓用氣體使用氮氣時，在溫度攝氏三十五度，大氣壓力（表壓力）每平方公分零公斤狀態下，每一 公斤乾粉藥劑需氮氣二十公升以上","B":"加壓用氣體使用二氧化碳時，每一公斤乾粉藥劑需二氧化碳二十公克","C":"蓄壓用氣體使用氮氣時，在溫度攝氏三十五度，大氣壓力（表壓力）每平方公分零公斤狀態下，每一 公斤乾粉藥劑需氮氣二十公升以上，並加算清洗配管所需要量以上","D":"蓄壓用氣體使用二氧化碳時，每一公斤乾粉藥劑需二氧化碳二十公克並加算清洗配管所需要量以上"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-26","year":2010,"roc_year":99,"subject":"消防法規","category":"建築防火／原有合法建築","no":26,"question":"某原有合法建築物供補習班使用，有關應依現行法令規定辦理改善之消防安全設備為何？","options":{"A":"火警自動警報設備","B":"排煙設備","C":"室內消防栓設備","D":"避難器具"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-27","year":2010,"roc_year":99,"subject":"消防法規","category":"其他消防法規","no":27,"question":"關於消防機關辦理建築物消防安全設備審查及查驗作業規定，下列何者有誤？","options":{"A":"消防安全設備設計人無正當理由未會同審查者，得予退件","B":"變更設計或變更用途，非系統式設備僅變動滅火器、緊急照明燈等簡易設備者，設計人得免配合審查","C":"竣工現場設置之消防安全設備與原審訖消防圖說之設備位置有異動時，於不影響設備功能及性能之情 形下，得直接修改竣工圖","D":"消防安全設備測試報告書應由消防器材廠商於各項設備施工完成後依報告書內項目實際測試其性能， 並填寫其測試結果"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-28","year":2010,"roc_year":99,"subject":"消防法規","category":"其他消防法規","no":28,"question":"關於緊急進口，下列何者有誤？","options":{"A":"進口之間隔不得大於四十公尺","B":"進口應為可自外面開啟或輕易破壞得以進入室內之構造","C":"進口外應設置陽台，其寬度應為一公尺以上，長度四公尺以上","D":"進口應設地面臨道路或寬度在一公尺以上通路之各層外牆面"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-29","year":2010,"roc_year":99,"subject":"消防法規","category":"其他消防法規","no":29,"question":"關於無窗戶居室，下列何者有誤？","options":{"A":"有效採光面積未達該居室樓地板面積百分之五","B":"可直接開向戶外或可通達戶外之有效防火避難構造開口，其高度未達一公尺，寬度未達七十五公分","C":"可直接開向戶外或可通達戶外之有效防火避難構造開口，為圓型時直徑未達一公尺者","D":"樓地板面積超過五十平方公尺之居室，其天花板或天花板下方八十公分範圍以內之有效通風面積未達 樓地板面積百分之二"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-30","year":2010,"roc_year":99,"subject":"消防法規","category":"建築防火／原有合法建築","no":30,"question":"工業、倉儲類原有合法建築物消防安全設備應依現行法令規定辦理改善者為何？","options":{"A":"避難器具","B":"室內消防栓設備","C":"排煙設備","D":"緊急電源配線"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-31","year":2010,"roc_year":99,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":31,"question":"公共危險物品製造場所四周保留空地，有關儲存量與寬度之規定，下列何者為正確？","options":{"A":"管制量 5 倍以下，為 1 公尺以上；管制量 10 倍以上，為 3 公尺以上","B":"管制量 6 倍以下，為 2 公尺以上；管制量 10 倍以上，為 4 公尺以上","C":"管制量 7 倍以下，為 3 公尺以上；管制量 10 倍以上，為 5 公尺以上","D":"管制量 5 倍以下，為 2 公尺以上；管制量 6 倍以上，為 4 公尺以上"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-32","year":2010,"roc_year":99,"subject":"消防法規","category":"其他消防法規","no":32,"question":"氧化性固體係粉粒狀時，應進行下列何種判定試驗？","options":{"A":"燃燒試驗及落錘試驗","B":"大量燃燒試驗及鐵管試驗","C":"瓦斯著火試驗","D":"閉杯式閃火點試驗"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-33","year":2010,"roc_year":99,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":33,"question":"關於可燃性高壓氣體儲存場所之安全管理，下列何者為正確？","options":{"A":"保持攝氏五十度以下之溫度；容器並應防止日光之直射","B":"周圍一公尺範圍內，應嚴禁煙火，且不得存放任何可燃性物質","C":"可燃性高壓氣體儲存場所，通路面積至少應占儲存場所面積之百分之十二以上","D":"灌氣容器與殘氣容器，應分開儲存，並直立放置，且不可重疊堆放"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-34","year":2010,"roc_year":99,"subject":"消防法規","category":"液化石油氣","no":34,"question":"關於液化石油氣儲存場所及販賣場所，下列敘述何者為正確？","options":{"A":"液化石油氣販賣場所應設置儲存場所儲放液化石油氣容器","B":"液化石油氣儲存場所設置位置與販賣場所距離，不得超過五公里","C":"液化石油氣儲存場所僅供一家處理場所使用之面積，不得少於六平方公尺","D":"液化石油氣儲存場所供二家以上共同使用者，每一販賣場所使用之儲存面積，不得少於十平方公尺"},"answers":["A","B"],"answer_note":"官方更正：答A或B者均給分","source":"考選部歷屆試題"},{"id":"2010-消防法規-35","year":2010,"roc_year":99,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":35,"question":"關於六類公共危險物品製造、儲存及處理場所標示板規格，下列何者有誤？","options":{"A":"第一類氧化性固體中之鹼性金屬過氧化物，應標示白底黑字之「禁水」字樣","B":"第二類可燃性固體，應標示紅底白字之「嚴禁煙火」字樣","C":"第二種標示板包括內容標示板及應注意事項標示板","D":"第一種標示板係依公共危險物品場所類別，分別標明名稱"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-36","year":2010,"roc_year":99,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":36,"question":"室外儲槽場所儲槽儲存第四類公共危險物品，周圍所設置防液堤，下列敘述何者有誤？","options":{"A":"防液堤之高度應在五十公分以上","B":"防液堤內面積不得超過八萬平方公尺","C":"高度一公尺以上之防液堤，每間隔三十公尺應設置出入防液堤之階梯","D":"單座儲槽周圍所設置防液堤之容量，應為該儲槽容量百分之一百以上"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-37","year":2010,"roc_year":99,"subject":"消防法規","category":"其他消防法規","no":37,"question":"室內儲存場所儲存達管制量 40 倍之柴油時，下列規定何者有誤？","options":{"A":"儲存倉庫應為獨立、專用之建築物","B":"儲存倉庫應為一層建築物，其高度不得超過 10 公尺","C":"每一儲存倉庫樓地板面積不得超過 1000 平方公尺","D":"地面應以混凝土或該物品無法滲透之不燃材料鋪設，且作適當之傾斜，並設置集液設施"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-38","year":2010,"roc_year":99,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":38,"question":"關於公共危險物品儲存場所及處理場所之敘述，下列何者有誤？","options":{"A":"室外儲存場所：位於建築物外以儲槽以外方式儲存六類物品之場所","B":"室內儲槽場所：在建築物內設置容量超過六百公升且不可移動之儲槽儲存六類物品之場所","C":"第一種販賣場所：販賣裝於容器之六類物品，其數量達管制量十五倍以上，未達四十倍之場所","D":"地下儲槽場所：在地面下埋設容量超過六百公升之儲槽儲存六類物品之場所"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-39","year":2010,"roc_year":99,"subject":"消防法規","category":"其他消防法規","no":39,"question":"下列何者，必須與收容人員在 20 人以上之學校保持 30 公尺以上之安全距離？","options":{"A":"地下儲槽場所","B":"室內儲槽場所","C":"室外儲槽場所","D":"一般處理場所"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2010-消防法規-40","year":2010,"roc_year":99,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":40,"question":"同一場所，儲存下列公共危險物品時，何者達管制量？","options":{"A":"汽油 20 公升、煤油 600 公升、重油 200 公升","B":"汽油 60 公升、煤油 400 公升、活塞油 1200 公升","C":"煤油 200 公升、柴油 800 公升、齒輪油 600 公升","D":"酒精 200 公升、煤油 40 公升、重油 400 公升"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2011-消防法規-01","year":2011,"roc_year":100,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":1,"question":"依據消防法之規定，公共危險物品及可燃性高壓氣體之製造、儲存或處理場所，其位置、構造及設備未 符合設置標準者，可處管理權人或行為人罰鍰新臺幣為何？","options":{"A":"三千元以上，一萬五千元以下","B":"一萬元以上，五萬元以下","C":"二萬元以上，十萬元以下","D":"三萬元以上，十五萬元以下"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2011-消防法規-02","year":2011,"roc_year":100,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":2,"question":"依據公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法之規定，六類物品製造場所，其外牆與廠 區外鄰近場所之距離，下列何者符合安全距離規定？","options":{"A":"與電壓超過三萬五千伏特之高架電線距離四公尺","B":"與收容人員在二十人以上之大型醫院距離四十公尺","C":"與古蹟距離四十公尺","D":"與圖書館距離四十公尺"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2011-消防法規-03","year":2011,"roc_year":100,"subject":"消防法規","category":"防焰","no":3,"question":"防焰物品或其材料之防焰性能試驗中，所稱之餘焰時間，係指試樣經點火時間終了起，試樣之火焰繼續 燃燒之時間。下列所述之試樣試驗的餘焰時間，何者符合防焰性能規定？","options":{"A":"薄纖維製品（每平方公尺質量 450 公克以下者）不得超過 5 秒","B":"薄纖維製品（每平方公尺質量 450 公克以下者）不得超過 7 秒","C":"厚纖維製品（每平方公尺質量超過 450 公克者）不得超過 5 秒","D":"厚纖維製品（每平方公尺質量超過 450 公克者）不得超過 10 秒"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2011-消防法規-04","year":2011,"roc_year":100,"subject":"消防法規","category":"消防設備人員制度","no":4,"question":"依據消防設備師及消防設備士管理辦法，直轄市、縣（市）之消防設備師或消防設備士人數達多少人以 上者，得組織消防設備師公會或消防設備士公會？","options":{"A":"十 c_year":101,"subject":"消防法規","category":"建築防火／原有合法建築","no":2,"question":"依據建築技術規則規定，針對安全梯之敘述，何者錯誤？","options":{"A":"室內安全梯間四周牆壁應具有一小時以上防火時效","B":"進入室內安全梯之出入口其寬度不得小於九十公分","C":"特別安全梯樓梯間及排煙室其天花板及牆面之裝修，應為耐燃一級材料","D":"戶外安全梯之出入口應裝設具有半小時以上防火時效且具有半小時以上阻熱性之防火門"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-03","year":2012,"roc_year":101,"subject":"消防法規","category":"各類場所設置標準","no":3,"question":"依據各類場所消防安全設備設置標準之規定，有關二氧化碳滅火設備何者敘述為錯誤？","options":{"A":"二氧化碳滅火設備之放射方式採移動放射方式，其皮管接頭至防護對象任一部分之水平距離在 十五公尺以下","B":"低壓式儲存容器應設置使容器內部溫度維持於攝氏零下二十度以上，攝氏零下十八度以下之自動 冷凍機","C":"二氧化碳噴頭之放射壓力，其滅火藥劑以常溫儲存者之高壓式為每平方公分十二公斤以上","D":"啟動用氣體容器之內容積應有一公升以上，其所儲存之二氧化碳重量在零點六公斤以上，且其充 填比在一點五以上"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-04","year":2012,"roc_year":101,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":4,"question":"依據各類場所消防安全設備設置標準之規定，有關公共危險物品等場所消防設計及消防安全設備之 敘述何者為錯誤？","options":{"A":"第三種滅火設備係指水霧、泡沫、二氧化碳或乾粉滅火設備","B":"公共危險物品儲存場所之建築物，外牆為防火構造，設置第五種滅火設備者，總樓地板面積每 一百平方公尺（含未滿）有一滅火效能值","C":"電氣設備使用之處所，每一百平方公尺（含未滿）應設置第五種滅火設備一具以上","D":"室內消防栓設備之緊急電源，其供電容量應供其有效動作四十五分鐘以上"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-05","year":2012,"roc_year":101,"subject":"消防法規","category":"檢修申報／檢修基準","no":5,"question":"依據各類場所消防安全設備檢修及申報作業基準之規定，下列之敘述何者錯誤？","options":{"A":"進行自動撒水設備綜合檢查時，末端查驗管之放水壓力應在 1 kgf／cm2以上 10 kgf／cm2以下","B":"對二氧化碳滅火器及海龍滅火器進行重量檢查時，如失重超過 10%以上或壓力表示值在綠色範圍 外時，應予以更新","C":"製造日期超過八年或無法辨識製造日期之乾粉滅火器，應予報廢","D":"第一種室內消防栓放水壓力應在 1.7 kgf／cm2以上 7 kgf／cm2以下"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-06","year":2012,"roc_year":101,"subject":"消防法規","category":"防焰","no":6,"question":"依據防焰性能認證實施要點之規定，一張材料防焰標示可申請多少張之窗簾物品防焰標示？","options":{"A":"50","B":"100","C":"150","D":"200"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-07","year":2012,"roc_year":101,"subject":"消防法規","category":"各類場所設置標準","no":7,"question":"依據各類場所消防安全設備設置標準之規定，有關室內消防栓之敘述何者錯誤？","options":{"A":"室內消防栓設備之消防立管管系竣工時，應做加壓試驗，試驗壓力不得小於加壓送水裝置全閉揚 程一點五倍以上之水壓","B":"第一種消防栓各層任一點至消防栓接頭之水平距離在二十五公尺以下","C":"幫浦出水量，第一種消防栓每支每分鐘之水量在一百三十公升以上","D":"屋頂水箱之水量，第一種消防栓有零點五立方公尺以上"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-08","year":2012,"roc_year":101,"subject":"消防法規","category":"其他消防法規","no":8,"question":"依據消防法之規定，下列之敘述何者錯誤？","options":{"A":"供公眾使用建築物之消防安全設備圖說，應由直轄市、縣（市）消防機關於主管建築機關許可開 工前，審查完成","B":"使用燃氣之熱水器及配管之承裝業自中華民國九十五年二月一日起使用燃氣熱水器之安裝，非經 僱用領有合格證照者，不得為之","C":"消防設備師或消防設備士為消防安全設備不實檢修報告者，處新臺幣三萬元以上十萬元以下罰鍰","D":"應設置消防安全設備之供營業使用場所其管理權人未依規定設置或維護，於發生火災時致人於死 者，處一年以上七年以下有期徒刑，得併科新臺幣一百萬元以上五百萬元以下罰金"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-09","year":2012,"roc_year":101,"subject":"消防法規","category":"其他消防法規","no":9,"question":"依據消防法施行細則之規定，下列何者非屬於一定規模以上供公眾使用建築物？","options":{"A":"總樓地板面積在三百平方公尺以上之百貨商場、超級市場及遊藝場等場所","B":"總樓地板面積在三百平方公尺以上之餐廳","C":"學校、總樓地板面積在二百平方公尺以上之補習班或訓練班","D":"總樓地板面積在五百平方公尺以上，其員工在三十人以上之工廠或機關（構）"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-10","year":2012,"roc_year":101,"subject":"消防法規","category":"其他消防法規","no":10,"question":"依據消防法施行細則之規定，防火管理人講習訓練時間不得少於多少小時？防火管理人每幾年至少 應接受講習訓練一次？","options":{"A":"八小時，每二年","B":"八小時，每三年","C":"十六小時，每二年","D":"十六小時，每三年"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-11","year":2012,"roc_year":101,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":11,"question":"依據公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法，室外儲槽場所儲槽儲存第四類公共 危險物品者，其防液堤之規定何者為錯誤？","options":{"A":"室外儲槽之直徑未達十五公尺者，防液堤與儲槽壁板間之距離，不得小於儲槽高度之三分之一","B":"同一地區設有二座以上儲槽者，其周圍所設置防液堤之容量，應為最大之儲槽容量百分之一百一十 以上","C":"防液堤內面積不得超過八萬平方公尺","D":"室外儲槽容量在二萬公秉以上者，其防液堤應設置洩漏檢測設備，並應於可進行處置處所設置警 報設備"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-12","year":2012,"roc_year":101,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":12,"question":"依據公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法，室內儲槽場所之位置、構造及設備 之規定何者為錯誤？","options":{"A":"儲槽專用室出入口應設置二十公分以上之門檻，或設置具有同等以上效能之防止流出措施","B":"儲槽專用室之儲槽與室內牆面之距離應在三十公分以上","C":"儲槽專用室之外牆有延燒之虞者，出入口應設置常時關閉式一小時以上防火時效之防火門","D":"儲槽容量不得超過管制量之四十倍，且第四類公共危險物品中之第二石油類及第三石油類，不得 超過二萬公升"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-13","year":2012,"roc_year":101,"subject":"消防法規","category":"液化石油氣","no":13,"question":"依據液化石油氣容器認可作業及管理要點之規定，下列敘述何者錯誤？","options":{"A":"試驗設備用壓力表或連成表應一年校正乙次","B":"型式認可之有效期限為三年，期限屆滿前三個月內得申請延展，每次延展期間為三年","C":"取得型式認可廠商之製造設施均應由專職人員擔任製造作業，確實紀錄液化石油氣容器製造相關 資料，並至少保存五年","D":"經型式認可者，應自取得型式認可書之日起三年內申請個別認可，經個別認可合格並取得液化石 油氣容器瓶身證明者，始得申購合格標示"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-14","year":2012,"roc_year":101,"subject":"消防法規","category":"防焰","no":14,"question":"依據防焰性能試驗基準之規定，下列之敘述何者錯誤？","options":{"A":"展示用廣告板之餘焰時間不得超過十秒","B":"展示用廣告板之餘燃時間不得超過二十秒","C":"展示用廣告板之碳化面積不得超過五十平方公分","D":"展示用廣告板試體之點火加熱時間為二分鐘"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-15","year":2012,"roc_year":101,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":15,"question":"依據公共危險物品試驗方法及判定基準之規定，下列之敘述何者錯誤？","options":{"A":"氧化性固體進行燃燒試驗時，所使用的標準物質為過氯酸鉀（特級）及溴酸鉀（1 級）","B":"氧化性固體進行燃燒試驗時，燃燒時間較過氯酸鉀短，判定為第一級","C":"氧化性固體進行落錘試驗時，所使用的標準物質為硝酸鉀（特級）及氯酸鉀（1 級）","D":"氧化性固體進行落錘試驗時，較氯酸鉀敏感，判定為第一級"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-16","year":2012,"roc_year":101,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":16,"question":"依據防火牆及防火水幕設置基準之規定，儲槽容量未達一萬公秉者，防火水幕設備之水源容量，不 得小於防護該儲槽連續放水多少分鐘之水量？","options":{"A":"六十分鐘","B":"一百二十分鐘","C":"一百八十分鐘","D":"二百四十分鐘"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-17","year":2012,"roc_year":101,"subject":"消防法規","category":"各類場所設置標準","no":17,"question":"依「各類場所消防安全設備設置標準」有關用途分類規定，長期照顧機構係屬何類場所？","options":{"A":"甲","B":"乙","C":"丙","D":"丁"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-18","year":2012,"roc_year":101,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":18,"question":"依據公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法之規定，下列之敘述何者正確？","options":{"A":"禁水性物質屬於第二類公共危險物品","B":"可燃性高壓氣體包含在常用溫度下或溫度在攝氏十五度時，表壓力達每平方公分二公斤以上之壓 縮乙炔氣","C":"室內儲槽場所為在建築物內設置容量超過一千公升且不可移動之儲槽儲存六類物品之場所","D":"六類物品製造場所，其外牆或相當於該外牆之設施外側與古蹟之距離，應在八十公尺以上"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-19","year":2012,"roc_year":101,"subject":"消防法規","category":"建築防火／原有合法建築","no":19,"question":"下列有關建築技術規則何者錯誤？","options":{"A":"建築物高度超過十層樓以上部分之最大一層樓地板面積，在一、五○○平方公尺以下者，至少應 設置一座緊急用昇降機","B":"緊急用昇降機之機間在避難層之位置，自昇降機出口或昇降機間之出入口至通往戶外出入口之步 行距離不得大於二十公尺","C":"緊急用昇降機道應每二部昇降機以具有一小時以上防火時效之牆壁隔開","D":"緊急進口之寬度應在七十五公分以上，高度應在一．二公尺以上。其開口之下端應距離樓地板面 八十公分範圍以內"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-20","year":2012,"roc_year":101,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":20,"question":"依據公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法之規定，下列何者錯誤？","options":{"A":"第一種販賣場所係指販賣裝於容器之六類物品，其數量未達管制量十五倍之場所","B":"第一種販賣場所其使用建築物之窗戶及出入口應設置三十分鐘以上防火時效之防火門窗","C":"內設六類物品調配室者出入口應設置三十分鐘以上防火時效之防火門","D":"內設六類物品調配室者，有積存可燃性蒸氣或可燃性粉塵之虞者，應設置將蒸氣或粉塵有效排至 屋簷以上或室外距地面四公尺以上高處之設備"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-21","year":2012,"roc_year":101,"subject":"消防法規","category":"各類場所設置標準","no":21,"question":"依「各類場所消防安全設備設置標準」規定，赤磷處理場所不得選擇下列何者滅火設備？","options":{"A":"泡沫滅火設備","B":"第二種滅火設備","C":"水霧滅火設備","D":"碳酸鹽類等乾粉滅火設備"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-22","year":2012,"roc_year":101,"subject":"消防法規","category":"各類場所設置標準","no":22,"question":"依「各類場所消防安全設備設置標準」有關簡易自動滅火設備規定，下列敘述何者錯誤？","options":{"A":"排油煙管內風速超過每分鐘五公尺，應在警戒長度外側設置放出藥劑之啟動裝置及連動閉鎖閘門","B":"防護範圍內之噴頭，應一齊放射","C":"儲存鋼瓶及加壓氣體鋼瓶設置於攝氏五十度以下之位置","D":"警戒長度，係指煙罩與排油煙管接合處往內五公尺"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-23","year":2012,"roc_year":101,"subject":"消防法規","category":"各類場所設置標準","no":23,"question":"依「各類場所消防安全設備設置標準」規定，下列何場所不得免設置緊急照明設備？","options":{"A":"在避難層，由居室任一點至通往屋外出口之步行距離在四十公尺以下之居室","B":"保齡球館球道以防煙區劃之部分","C":"集合住宅之居室","D":"儲藏室"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-24","year":2012,"roc_year":101,"subject":"消防法規","category":"各類場所設置標準","no":24,"question":"依「各類場所消防安全設備設置標準」規定，裝置面高度超過二十公尺者，可選擇何種探測器設置？","options":{"A":"偵煙式探測器","B":"火焰式探測器","C":"熱煙複合式探測器","D":"差動式分布型探測器"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-25","year":2012,"roc_year":101,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":25,"question":"依據「公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法」有關室外儲槽場所之位置、構造 及設備規定，下列敘述何者錯誤？","options":{"A":"幫浦設備與儲槽之距離不得小於儲槽保留空地寬度之三分之一","B":"儲存二硫化碳之儲槽，槽壁厚度不得小於二十公分，並應沒入於無漏水之虞之鋼筋混凝土水槽中","C":"固定式儲槽直徑四十五公尺以上者，儲存閃火點未達攝氏六十度之六類物品時，相鄰儲槽間之距 離應為相鄰二座儲槽直徑和之四分之一","D":"儲存高閃火點物品之幫浦設備保留空地寬度不得小於一公尺"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-26","year":2012,"roc_year":101,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":26,"question":"依據「公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法」規定，室內儲存場所儲存第五類 公共危險物品之有機過氧化物，儲存倉庫應以分隔牆區劃，每一區劃面積應在 A 平方公尺以下；儲 存倉庫窗戶距離地板應在 B 公尺以上，設於同一壁面窗戶之總面積不得超過該壁面面積之 C 分之一， 且每一窗戶之面積不得超過 D 平方公尺，請問前述 A，B，C，D 為何？","options":{"A":"500，1.5，100，0.5","B":"150，2，80，0.4","C":"130，1.5，60，0.5","D":"100，1，50，0.5"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-27","year":2012,"roc_year":101,"subject":"消防法規","category":"各類場所設置標準","no":27,"question":"依「各類場所消防安全設備設置標準」規定，集會堂之觀眾席設有固定座部分，且撒水頭裝置面高 度在多少公尺以上者，得免設撒水頭？","options":{"A":"八","B":"六","C":"五","D":"四"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-28","year":2012,"roc_year":101,"subject":"消防法規","category":"消防設備人員制度","no":28,"question":"依據「消防安全設備檢修專業機構管理辦法」有關消防安全設備檢修專業機構之監督及管理規定， 下列敘述何者錯誤？","options":{"A":"檢修機構應置有專任之消防設備師及消防設備士合計達十人以上，其中消防設備師至少二人","B":"檢修機構應備置檢修場所清冊及相關檢修報告，並至少保存五年","C":"檢修機構合格證書記載事項變更時，應於三十日內向內政部申請變更登記","D":"檢修機構聘用、資遣、解聘消防設備師或消防設備士，應於二十日內，報請內政部備查"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-29","year":2012,"roc_year":101,"subject":"消防法規","category":"消防設備人員制度","no":29,"question":"消防設備師依「緊急電源容量計算基準」核算供消防安全設備所須之緊急電源容量後，應以書面知 會電機技師供納入整合緊急發電系統設計容量考量，電機技師於接獲前揭消防用緊急電源容量計算 結果資料，應於 A 日內確認有無影響建築整體緊急發電設備設計之虞，並以書面通知知會之消防設 備師，逾 B 日未通知時視為無意見，請問前述 A，B 為何？","options":{"A":"60，30","B":"30，15","C":"15，10","D":"7，7"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-30","year":2012,"roc_year":101,"subject":"消防法規","category":"其他消防法規","no":30,"question":"依「滅火器藥劑更換及充填作業規定」，下列敘述何者錯誤？","options":{"A":"經營滅火器藥劑更換及充填作業廠商應有專任符合消防法規定之消防專技人員（如消防設備師、 消防設備士或暫行從事消防安全設備裝置檢修人員）至少一人，且不得同時任職於其他工廠或公司 （行號）","B":"製造日期超過十年或無法辨識製造日期之乾粉滅火器，應予報廢，非經水壓測試合格，不得再行 更換及充填藥劑","C":"重新充填滅火藥劑後之滅火器，於充填完成時其噴射性能須能噴射所充填滅火劑容量或重量 90% 以上之量","D":"重新更換藥劑及充填後之滅火器，應於滅火器瓶頸加裝檢修環，檢修環材質以一體成型之硬質無 縫塑膠、壓克力或鐵環製作，且內徑不得大於滅火器瓶口 5 mm"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-31","year":2012,"roc_year":101,"subject":"消防法規","category":"檢修申報／檢修基準","no":31,"question":"依「各類場所消防安全設備檢修及申報作業基準」有關簡易自動滅火設備之性能檢查規定，加壓式 滅火藥劑儲存容器之加壓用氣體容器等氣體量檢查方法為以手旋轉加壓用氣體容器，將容器取下， 將容器置於計量器上，測定其總重量，總重量應比標示重量不少於多少公克？","options":{"A":"14.2","B":"12.5","C":"10.5","D":"8.5"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-32","year":2012,"roc_year":101,"subject":"消防法規","category":"檢修申報／檢修基準","no":32,"question":"依「各類場所消防安全設備檢修及申報作業基準」有關消防專用蓄水池檢查規定，下列敘述何者錯誤？","options":{"A":"進水管投入孔及採水口外觀檢查周圍狀況判定方法為消防車能到達二公尺以內，且使用上應無障礙","B":"幫浦性能檢查方法先將幫浦吐出側之制水閥關閉之後，使幫浦啟動，然後緩緩的打開性能測試用 配管之制水閥，由流量計及壓力表確認額定負荷運轉及全開點時之性能","C":"呼水裝置之減水警報裝置性能檢查判定方法為當水量減少至三分之二前應發出警報","D":"幫浦之性能檢查時除需操作啟動檢查性能外，其餘均需先行切斷電源"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-33","year":2012,"roc_year":101,"subject":"消防法規","category":"檢修申報／檢修基準","no":33,"question":"依「各類場所消防安全設備檢修及申報作業基準」規定，下列敘述何者錯誤？","options":{"A":"各類場所之管理權人應委託檢修專業機構或消防法第 7 條規定之人員辦理檢修，並於檢修完成後 二十日內，分別填具消防安全設備檢修申報表及檢附消防安全設備檢修報告書，向當地消防機關 申報","B":"建築物依其用途及管理情形，採整棟申報方式申報檢修結果者，有供甲類用途使用者，視同甲類 場所辦理","C":"未申領使用執照或未依使用執照用途之違規使用場所，應以其實際用途，辦理檢修申報","D":"經消防機關會勘通過且依建築法規定取得使用執照、室內裝修許可之合法場所，自取得使用執照 或審查合格證明日期起計算，甲類場所距申報截止日期在六個月以內者，當次免辦理檢修申報"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-34","year":2012,"roc_year":101,"subject":"消防法規","category":"其他消防法規","no":34,"question":"依「建築法」規定，下列敘述何者正確？","options":{"A":"直轄市、縣（市）（局）主管建築機關應自收到申請拆除執照應備之申請書之日起十日內審查完 竣，合於規定者，發給拆除執照","B":"機械遊樂設施經營者應定期委託依法開業之相關專業技師、建築師或經中央主管建築機關指定之 檢查機構、團體實施安全檢查。安全檢查之次數，由該管直轄市、縣（市）主管建築機關定之， 每年不得少於一次","C":"起造人自領得建造執照或雜項執照之日起，應於六個月內開工；起造人因故不能於前項期限內開 工時，應敘明原因，申請展期一次，期限為三個月","D":"建築工程完竣後，應由起造人會同承造人及監造人申請使用執照。直轄市、縣（市）（局）主管 建築機關應自接到申請之日起，十日內派員查驗完竣。但供公眾使用建築物之查驗期限，得展延 為三十日"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-35","year":2012,"roc_year":101,"subject":"消防法規","category":"建築防火／原有合法建築","no":35,"question":"依「建築技術規則」有關地下建築物之緩衝區規定，下列敘述何者錯誤？","options":{"A":"緩衝區與連接之地下建築物、地下運輸系統及建築物之地下層間應以具有一小時以上防火時效之 牆壁、防火門窗等防火設備及該層防火構造之樓地板區劃分隔","B":"連接緩衝區二側之連接出入口，總寬度均應在三公尺以上，六公尺以下，且任一出入口淨寬度不 得小於一點五公尺","C":"緩衝區面積之百分之二十以上應挑空至地面層","D":"緩衝區內專供通行及緊急避難使用，不得有營業行為；牆壁得以耐燃一級材料設置嵌入式廣告物"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-36","year":2012,"roc_year":101,"subject":"消防法規","category":"建築防火／原有合法建築","no":36,"question":"依「建築技術規則」有關高層建築物規定，下列敘述何者錯誤？","options":{"A":"高層建築物在二層以上，十六層或地板面高度在五十公尺以下之各樓層，應設置緊急進口。但面 臨道路或寬度四公尺以上之通路，且各層之外牆每十公尺設有窗戶或其他開口者，不在此限","B":"高層建築物應設置二座以上之特別安全梯並應符合二方向避難原則。二座特別安全梯應在不同平 面位置，其排煙室並不得共用","C":"高層建築物地板面高度在五十公尺以上或十六層以上之樓層應設置緊急昇降機間，緊急用昇降機 載重能力應達十七人（一千一百五十公斤）以上，其速度不得小於每分鐘六十公尺，且自避難層 至最上層應在一分鐘內抵達為限","D":"高層建築物之配管立管應考慮層間變位，消防、瓦斯等配管為二百分之一"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-37","year":2012,"roc_year":101,"subject":"消防法規","category":"建築防火／原有合法建築","no":37,"question":"依「原有合法建築物防火避難設施及消防設備改善辦法」規定，供何種類組建築物使用時，其消防 設備改善項目（室內消防栓、自動撒水設備、火警自動警報設備、緊急廣播設備、標示設備、緊急 照明設備、避難器具、瓦斯漏氣火警自動警報設備、排煙設備、滅火器、緊急電源配線）、內容及 方式，應依現行法令規定辦理改善？","options":{"A":"Ａ類：公共集會類","B":"Ｂ類：商業類","C":"Ｃ類：工業、倉儲類","D":"Ｉ類：危險物品類"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-38","year":2012,"roc_year":101,"subject":"消防法規","category":"防焰","no":38,"question":"依「防焰性能認證實施要點」規定，下列敘述何者錯誤？","options":{"A":"防焰物品或其材料之製造業者，品質管理部門至少應置一名以上之防焰處理技術人員","B":"防焰物品之防焰性能加工處理業者，應設有均勻浸泡、脫水、烘乾之設備；其浸泡之器具，應為 長一百公分以上、寬五十公分以上、高五十公分以上之水槽","C":"大型布幕無法以浸泡方式進行防焰性能加工處理時，得以噴霧塗布之方式，其噴霧器之噴嘴放射 壓力不得小於每平方公分三公斤","D":"窗簾、布幕，須經水洗及乾洗處理者，供防焰性能試驗之產品試樣規格為三平方公尺以上"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-39","year":2012,"roc_year":101,"subject":"消防法規","category":"防焰","no":39,"question":"依「消防法」及「明火表演安全管理辦法」規定，經申請許可餐廳之火把秀或酒吧魔術等明火表演 ，其所在樓層應有 A 座以上直通樓梯通達避難層，且任一點至該樓梯之步行路徑重複部分之長度， 不得大於最大容許步行距離 B 分之一；表演區域及外緣 C 公尺內之地面、牆面及地面上方 D 公尺以 內之天花板或樓板，不得以木板、未固著式泡綿、未具防焰性能之布幕等易引發火災之材料裝潢或 裝飾，請問前述 A，B，C，D 為何？","options":{"A":"3，3，5，5","B":"2，2，2，6","C":"1，2，1，3","D":"2，3，1，4"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2012-消防法規-40","year":2012,"roc_year":101,"subject":"消防法規","category":"其他消防法規","no":40,"question":"依「消防法施行細則」規定，下列敘述何者錯誤？","options":{"A":"受託執行檢驗消防機具、器材與設備之機關（構）、學校、團體，其檢驗設備、員額、技術能力 、檢驗紀錄、檢驗時效、樣品管理及其他事項，中央主管機關至少每年檢討考核一次","B":"廠商申請消防機具、器材及設備認可檢驗時，應填具申請書並檢送試樣及相關資料，向中央主管 機關或其委託之檢驗單位提出，經取得型式承認後，應依檢定作業規定於二年內申請個別檢定， 檢定合格者，核發合格標示","C":"防火管理人每二年至少應接受講習訓練一次","D":"消防防護計畫中滅火、通報及避難訓練之實施；每半年至少應舉辦一次"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-01","year":2013,"roc_year":102,"subject":"消防法規","category":"消防法／施行細則","no":1,"question":"依消防法規定，下列何者不屬於管理權人必要之職責？","options":{"A":"應設置消防安全設備場所，委託消防設備師或消防設備士，定期檢修消防安全設備","B":"應設置消防安全設備場所，消防安全設備檢修結果應依限報請當地消防機關備查","C":"一定規模以上供公眾使用建築物，遴用防火管理人","D":"一定規模以上供公眾使用建築物，製定消防防護計畫"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-02","year":2013,"roc_year":102,"subject":"消防法規","category":"檢修申報／檢修基準","no":2,"question":"依各類場所消防安全設備檢修及申報作業基準，每次檢修時間之間隔為何？","options":{"A":"甲類場所不得少於 6 個月","B":"甲類場所不得少於 5 個月","C":"甲類以外之場所不得少於 12 個月","D":"甲類以外之場所不得少於 6 個月"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-03","year":2013,"roc_year":102,"subject":"消防法規","category":"防火管理","no":3,"question":"消防法所稱消防防護計畫應包含事項，下列何者正確？","options":{"A":"每年至少檢查一次防火避難設施之自行檢查","B":"每年至少應舉辦一次滅火、通報及避難訓練","C":"員工在 10 人以上者，至少編組滅火班、通報班及避難引導班","D":"場所之位置圖、逃生避難圖及立體圖"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-04","year":2013,"roc_year":102,"subject":"消防法規","category":"其他消防法規","no":4,"question":"消防法規定設置之消防栓，以採用下列何者為原則？","options":{"A":"地下單口式","B":"地下雙口式","C":"地上單口式","D":"地上雙口式"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-05","year":2013,"roc_year":102,"subject":"消防法規","category":"液化石油氣","no":5,"question":"依消防法規定，液化石油氣零售業者應備置資料，定期向轄區消防機關申報，定期申報是指下列何者？","options":{"A":"於每年 6 月及 12 月各申報一次","B":"於每年 5 月及 11 月各申報一次","C":"於每年 4 月及 10 月各申報一次","D":"於每年 3 月及 9 月各申報一次"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-06","year":2013,"roc_year":102,"subject":"消防法規","category":"消防法／施行細則","no":6,"question":"依消防法施行細則規定，火災受害人或利害關係人得向直轄市、縣 (市) 消防機關申請火災證明，證明內 容以下列何者為限？","options":{"A":"火災受害人或利害關係人姓名與火災發生時間","B":"火災發生時間與火災發生地點","C":"火災發生時間與火災發生原因","D":"火災發生原因與調查結果"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-07","year":2013,"roc_year":102,"subject":"消防法規","category":"防焰","no":7,"question":"防焰標示應採張貼、縫製、鑲釘或懸掛等方式，標示於各防焰物品或其材料本體上顯著處；其標示方式 下列何者正確？","options":{"A":"窗簾及布幕具耐洗性能者，使用張貼方式","B":"窗簾及布幕不具耐洗性能者，使用縫製方式","C":"展示用廣告板，使用鑲釘方式","D":"施工用帆布，使用縫製方式"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-08","year":2013,"roc_year":102,"subject":"消防法規","category":"其他消防法規","no":8,"question":"二氧化碳滅火設備使用之各種標示規格，下列規定何者錯誤？","options":{"A":"手動啟動裝置標示為白底紅字","B":"放射表示燈平時底及字樣均為白色","C":"音響警報裝置標示為黃底黑字","D":"放射表示燈之燈具本體為紅色"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-09","year":2013,"roc_year":102,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":9,"question":"依防火牆及防火水幕設置基準，若儲槽所儲存公共危險物品之閃火點未達攝氏七十度，且儲槽水平剖面 最大直徑為 10 公尺，其假想火面高度為多少公尺？","options":{"A":"10","B":"15","C":"20","D":"31.4"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-10","year":2013,"roc_year":102,"subject":"消防法規","category":"其他消防法規","no":10,"question":"依消防幫浦加壓送水裝置等及配管摩擦損失計算基準，幫浦之性能應符合下列何項規定？","options":{"A":"幫浦所標示之額定出水量，在其性能曲線上之全揚程必須達到額定揚程之 100%至 120%之間","B":"幫浦之出水量在額定出水量 140%時，其全揚程應達到額定出水量性能曲線上全揚程之 65%以上","C":"全閉揚程應為性能曲線上全揚程之 150%以下","D":"在額定出水量 150%時，其軸動力不得超過馬達額定輸出馬力之 110%"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-11","year":2013,"roc_year":102,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":11,"question":"依可燃性高壓氣體儲存場所防爆牆設置基準，防爆牆長度應超過設置方位儲存場所建築物牆面長度，其 牆腳與儲存場所建築物之距離不得少於多少公尺？","options":{"A":"2","B":"3","C":"4","D":"5"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-12","year":2013,"roc_year":102,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":12,"question":"依據公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法之規定，第一種販賣場所內設六類物品調 配室者，應符合的規定下列敘述何者有誤？","options":{"A":"應以牆壁分隔區劃","B":"出入口應設置一小時以上防火時效之防火門","C":"樓地板面積應在五平方公尺以上，二十平方公尺以下","D":"有積存可燃性蒸氣之虞者，應設置將蒸氣有效排至屋簷以上或室外距地面四公尺以上高處之設備"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-13","year":2013,"roc_year":102,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":13,"question":"依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法所稱高閃火點物品，係指閃火點在攝氏 X 度 以上之第 Y 類公共危險物品，X、Y 為下列何者？","options":{"A":"70；一","B":"90；二","C":"110；三","D":"130；四"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-14","year":2013,"roc_year":102,"subject":"消防法規","category":"各類場所設置標準","no":14,"question":"依各類場所消防安全設備設置標準，下列場所之用途分類規定何者正確？","options":{"A":"坐月子中心屬甲類場所","B":"網咖屬乙類場所","C":"室外停車場屬丙類場所","D":"林場屬己類場所"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-15","year":2013,"roc_year":102,"subject":"消防法規","category":"各類場所設置標準","no":15,"question":"依各類場所消防安全設備設置標準，有關水霧、泡沫、乾粉、二氧化碳滅火設備等選擇設置規定，下列 敘述何者正確？","options":{"A":"外牆開口面積（常時開放部分）達該層樓地板面積百分之十以上者，其滅火設備得採移動式設置","B":"電信機械室、電腦室或總機室及其他類似場所，樓地板面積在二百平方公尺以上者，不得使用預動式 自動撒水設備","C":"平時有特定或不特定人員使用之中央管理室、防災中心等類似處所，不得設置二氧化碳滅火設備","D":"大量使用火源場所，係指最大消費熱量合計在 30 萬千瓦（KW）以上者"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-16","year":2013,"roc_year":102,"subject":"消防法規","category":"其他消防法規","no":16,"question":"依住宅用火災警報器設置辦法，廚房應設置何種住宅用火災警報器？","options":{"A":"火焰式","B":"定溫式","C":"離子式","D":"光電式"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-17","year":2013,"roc_year":102,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":17,"question":"依各類場所消防安全設備設置標準，有關公共危險物品等場所設置室內消防栓設備之規定，下列敘述何 者錯誤？","options":{"A":"設置第一種消防栓","B":"所在建築物其各層任一點至消防栓接頭之水平距離在 25 公尺以下，且各層之出入口附近設置一支以上 之室內消防栓","C":"任一樓層內，全部消防栓同時使用時，各消防栓瞄子放水壓力在每平方公分 1.7 公斤以上，放水量在每 分鐘 130 公升以上。但全部消防栓數量超過二支時，以同時使用二支計算之","D":"室內消防栓設備之緊急電源其供電容量應供其有效動作 45 分鐘以上"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-18","year":2013,"roc_year":102,"subject":"消防法規","category":"消防設備人員制度","no":18,"question":"依據消防設備師及消防設備士管理辦法規定，下列敘述何者錯誤？","options":{"A":"不得有允諾他人假藉其名義執行業務之行為","B":"執行業務時，應備業務登記簿，至少應保存五年","C":"自取得證書日起每三年應接受講習一次或取得累計積分達一百六十分以上之訓練證明文件","D":"辦理技術研討活動或訓練之機關（構）、團體應於舉辦一個月前，檢附規定文件向中央主管機關申請 認可"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-19","year":2013,"roc_year":102,"subject":"消防法規","category":"建築防火／原有合法建築","no":19,"question":"依建築技術規則建築設計施工編，防火門窗係指防火門及防火窗，其構造規定下列何者正確？","options":{"A":"防火門窗周邊 10 公分範圍內之牆壁應以不燃材料建造","B":"防火門之門扇寬度應在 90 公分以上，高度應在 180 公分以上","C":"常時關閉式之防火門單一門扇面積不得超過 3 平方公尺","D":"防火門應朝室內方向開啟。但供住宅使用及宿舍寢室、旅館客房、醫院病房等連接走廊者，不在此限"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-20","year":2013,"roc_year":102,"subject":"消防法規","category":"其他消防法規","no":20,"question":"依住宅用火災警報器設置辦法，住宅用火災警報器之安裝方式，下列敘述何者正確？","options":{"A":"裝置於天花板或樓板者，警報器下端距離天花板或樓板 50 公分以內","B":"裝置於牆面者，距天花板或樓板下方 15 公分以上 50 公分以下","C":"距離出風口 1 公尺以上","D":"以裝置於居室出入口附近為原則"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-21","year":2013,"roc_year":102,"subject":"消防法規","category":"防焰","no":21,"question":"依據防焰性能認證實施要點，下列何者非屬於消防法第 11 條第 1 項規定之防焰物品？","options":{"A":"面積為一點五平方公尺之門墊","B":"布質製窗簾（含布製一般窗簾，直葉式、橫葉式百葉窗簾）","C":"供舞台或攝影棚使用之布幕","D":"網目為十公釐之施工用帆布"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-22","year":2013,"roc_year":102,"subject":"消防法規","category":"其他消防法規","no":22,"question":"依避難器具支固器具及固定部之結構、強度計算及施工方法，固定部材料上使用錨定螺栓，若螺栓直徑 為 1 公分，試驗荷重 (設計拉拔荷重)為 1000 公斤力(kgf)，則鎖緊扭力為多少公斤力/公分(kgf/cm)？","options":{"A":"60","B":"120","C":"240","D":"360"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-23","year":2013,"roc_year":102,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":23,"question":"依據公共危險物品試驗方法及判定基準之規定，利用「可燃性固體」與「易燃性液體」之判斷基準，下 列歸類何者錯誤？","options":{"A":"採閉杯式閃火點試驗方法時，閃火點溫度不大於 40 ℃之固體試驗物品為易燃性固體","B":"水溶性液體閃火點如低於 21℃者，為第一石油類","C":"水溶性液體閃火點如介於 40℃至 60℃者，為第二石油類","D":"水溶性液體閃火點如介於 141℃至 180℃者，為第四石油類"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-24","year":2013,"roc_year":102,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":24,"question":"依據公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法之規定，下列氣體狀態何者為符合本辦法 之可燃性高壓氣體？","options":{"A":"溫度在攝氏三十五度時，表壓力達每平方公分十五公斤之壓縮氫氣","B":"在常用溫度下，表壓力達每平方公分五公斤之壓縮甲烷","C":"在常用溫度下，表壓力達每平方公分一點五公斤之壓縮乙炔氣","D":"在攝氏三十五度以下，表壓力達每平方公分一點五公斤之液化丙烷"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-25","year":2013,"roc_year":102,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":25,"question":"依據公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法之規定，室內儲存場所儲存六類物品之數 量，如未達管制量五十倍者，下列儲存倉庫周圍保留空地寬度，何者符合規定？","options":{"A":"達管制量六倍者，無保留空地","B":"達管制量十二倍者，無保留空地","C":"達管制量二十五倍者，保留空地寬度為一公尺","D":"達管制量四十倍者，保留空地寬度為三公尺"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-26","year":2013,"roc_year":102,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":26,"question":"依據各類場所消防安全設備設置標準之規定，以室外儲槽儲存閃火點在攝氏四十度以下第四類公共危險 物品之顯著滅火困難場所者，且設於岸壁、碼頭或其他類似之地區，並連接輸送設備者，如設置泡沫射 水槍滅火設備，下列何者有誤？","options":{"A":"室外儲槽之幫浦設備等設於岸壁、碼頭或其他類似之地區時，泡沫射水槍應能防護該場所位於海面上 前端之水平距離十五公尺以內之海面","B":"距離注入口及其附屬之公共危險物品處理設備各部分之水平距離在三十公尺以內，其設置個數在二具 以上","C":"泡沫射水槍為移動式，設於無礙滅火活動及可啟動、操作之位置","D":"射水槍同時放射時，泡沫放射量為每分鐘一千九百公升以上，且其有效水平放射距離在三十公尺以上"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-27","year":2013,"roc_year":102,"subject":"消防法規","category":"各類場所設置標準","no":27,"question":"依據各類場所消防安全設備設置標準之規定，建築物間設有過廊，如有效寬度在 A 公尺以下，連接建築 物之間距，一樓超過 B 公尺，二樓以上超過 C 公尺，可視為另一場所，請問前述 A、B、C 分別為何？","options":{"A":"6，6，8","B":"6，6，10","C":"8，6，8","D":"8，8，15"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-28","year":2013,"roc_year":102,"subject":"消防法規","category":"各類場所設置標準","no":28,"question":"依據各類場所消防安全設備設置標準之規定，建築物設置避難器具時，開口部與地面之間必須保有必要 之下降空間，下列敘述何者有誤？","options":{"A":"設置避難梯時，二側豎桿中心線向外十五公分以上及其前方五十公分以上之範圍內","B":"設置直降式救助袋時，外牆如無突出物，救助袋與牆壁之間隔為三十公分以上。以救助袋為中心，半 徑一公尺圓柱形範圍內","C":"設置滑臺時，滑面上方一公尺以上及滑臺兩端向外二十公分以上所圍範圍內","D":"設置避難橋時，為橋之寬度以上及橋面上方二公尺以上所圍範圍內"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-29","year":2013,"roc_year":102,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":29,"question":"依據可燃性高壓氣體儲存場所防爆牆設置基準，下列規定何者錯誤？","options":{"A":"防爆牆分為鋼筋混凝土製、混凝土空心磚製及鋼板製等三種","B":"基礎混凝土經過二十八日養生後之抗壓強度 140 kgf/cm2 以上","C":"鋼板製防爆牆之鋼板應施以防銹處理，將鋼板表面清掃，油漆防銹塗料二次後，作修整油漆","D":"混凝土空心磚製防爆牆基礎埋入深度應在 250 mm 以上"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-30","year":2013,"roc_year":102,"subject":"消防法規","category":"各類場所設置標準","no":30,"question":"依據各類場所消防安全設備設置標準，設置光電式分離型探測器之規定，下列敘述何者有誤？","options":{"A":"設在與探測器光軸平行牆壁距離六十公分以上之位置","B":"探測器之受光器及送光器，設在距其背部牆壁二公尺範圍內","C":"設在天花板等高度二十公尺以下之場所","D":"探測器之光軸高度，在天花板等高度百分之八十以上之位置"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-31","year":2013,"roc_year":102,"subject":"消防法規","category":"檢修申報／檢修基準","no":31,"question":"依據各類場所消防安全設備檢修及申報作業基準之規定，對於查驗緊急照明設備之判斷標準，下列之敘 述何者錯誤？","options":{"A":"於地下建築物之地下通道，緊急照明燈在地面之水平面照度應達 2 勒克斯（lux）以上；其它場所應達 到 1 勒克斯（lux）以上","B":"緊急電源容量需能持續三十分鐘以上","C":"建築物總樓地板面積 3000 平方公尺以下者，檢查數量應在 10 個以上","D":"建築物總樓地板面積 10000 平方公尺以上者，檢查數量為 20 個再追加「每增加 5000 平方公尺、增加 5 個」的個數"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-32","year":2013,"roc_year":102,"subject":"消防法規","category":"各類場所設置標準","no":32,"question":"依據各類場所消防安全設備設置標準之規定，火警受信總機、中繼器及偵煙式探測器，有設定蓄積時間時， 蓄積時間之合計，每一火警分區在 X 秒以下，使用其他探測器時，在 Y 秒以下，請問 X 與 Y 分別為何？","options":{"A":"X=30 秒，Y=30 秒","B":"X=45 秒，Y=20 秒","C":"X=45 秒，Y=30 秒","D":"X=60 秒，Y=20 秒"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-33","year":2013,"roc_year":102,"subject":"消防法規","category":"各類場所設置標準","no":33,"question":"依據各類場所消防安全設備設置標準之規定，裝置水霧滅火設備之室內停車空間，排水設備相關規定為 車輛停駐場所地面需施作 X%以上之坡度，設高 Y 公分以上之地區境界堤，請問 X 與 Y 分別為何？","options":{"A":"X=2%，Y=5 公分","B":"X=3%，Y=5 公分","C":"X=2%，Y=10 公分","D":"X=3%，Y=10 公分"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-34","year":2013,"roc_year":102,"subject":"消防法規","category":"檢修申報／檢修基準","no":34,"question":"依據各類場所消防安全設備檢修及申報作業基準之規定，對於查驗惰性氣體滅火設備之判斷標準，下列 之敘述何者錯誤？","options":{"A":"滅火藥劑儲存容器放置場所之溫度應在 40℃以下","B":"藥劑量之測定結果與重量表或原廠技術手冊規範相互核對，差值應在充填值 10%以下","C":"每一防護區域或防護對象物之警報系統應正確動作，距警報裝置一公尺處之音量應在九十分貝以上","D":"遲延裝置之動作時限應在三十秒以上，且在設計時之設定值範圍內"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-35","year":2013,"roc_year":102,"subject":"消防法規","category":"檢修申報／檢修基準","no":35,"question":"依據各類場所消防安全設備檢修及申報作業基準之規定，對於查驗火警自動警報設備之判斷標準，下列 之敘述何者錯誤？","options":{"A":"在熱水室、消毒室等水蒸氣會大量滯留之場所，可採用定溫型 1 種之感熱式探測器","B":"在停車場、車庫等具有大量排放廢氣滯留之場所，不適合採用定溫型感熱式探測器","C":"光電式局限型２種之探測器動作時間應在 90 秒以內","D":"差動式局限型２種之探測器動作時間應在 30 秒以內"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-36","year":2013,"roc_year":102,"subject":"消防法規","category":"其他消防法規","no":36,"question":"依據防火牆及防火水幕設置基準之規定，防火水幕之防護高度在十公尺以下時，每公尺水幕長度放水量 應在每分鐘 X 公升以上；防護高度超過十公尺者，高度每增加一公尺，放水量每分鐘應增加 Y 公升。請 問 X 與 Y 分別為何？","options":{"A":"X=120 公升，Y=8 公升","B":"X=100 公升，Y=10 公升","C":"X=90 公升，Y=8 公升","D":"X=80 公升，Y=10 公升"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-37","year":2013,"roc_year":102,"subject":"消防法規","category":"其他消防法規","no":37,"question":"依據消防幫浦加壓送水裝置等及配管摩擦損失計算基準，有關啟動用水壓開關裝置應符合之規定，下列 何者有誤？","options":{"A":"在啟動用壓力槽上或其近傍應裝設壓力表、啟動用水壓開關及試驗幫浦啟動用之排水閥","B":"啟動用壓力槽容量應有 100 公升以上","C":"啟動用壓力槽之構造應符合危險性機械及設備安全檢查規則之規定","D":"啟動用壓力儲槽應使用口徑 15mm 以上配管，與幫浦出水側逆止閥之一次側配管連接"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-38","year":2013,"roc_year":102,"subject":"消防法規","category":"其他消防法規","no":38,"question":"依據消防幫浦加壓送水裝置等及配管摩擦損失計算基準，有關呼水裝置須符合之事項，下列敘述何者有誤？","options":{"A":"呼水槽應有 100 公升以上之有效儲存量","B":"呼水槽底與呼水管逆止閥中心線間距離在 1 公尺以下時，呼水管管徑須為 25A 以上","C":"減水警報之發訊裝置應採用浮筒開關或電極方式，當槽內水位降至容量二分之一前，應能發出警報音 響至平時有人駐在處","D":"呼水槽應使用鋼板，並予有效防銹處理，或使用具有防火能力之塑膠槽"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-39","year":2013,"roc_year":102,"subject":"消防法規","category":"建築防火／原有合法建築","no":39,"question":"依據建築技術規則建築設計施工編「第四章防火避難設施及消防設備」對於特別安全梯之構造規定，何 者有誤？","options":{"A":"樓梯間及排煙室四週非外牆之牆壁，應具有一小時以上防火時效。管道間之維修孔，不得開向樓梯間","B":"樓梯間及排煙室，開設採光用固定窗戶或在陽臺外牆開設之開口，除開口面積在一平方公尺以內並裝 置具有半小時以上之防火時效之防火設備者，應與其他開口相距九十公分以上","C":"自室內通陽臺或進入排煙室之出入口，應裝設具有半小時以上防火時效及半小時以上阻熱性之防火門， 自陽臺或排煙室進入樓梯間之出入口應裝設具有半小時以上防火時效之防火門","D":"樓梯間與排煙室或陽臺之間所開設之窗戶應為固定窗"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2013-消防法規-40","year":2013,"roc_year":102,"subject":"消防法規","category":"建築防火／原有合法建築","no":40,"question":"依原有合法建築物防火避難設施及消防設備改善辦法規定，十層以下之非防火構造建築物進行區劃改善， 如主要構造為使用不燃材料建造，按總樓地板面積每 X 平方公尺，以一小時防火時效之牆壁、樓地板及 防火設備區劃分隔。如主要構造為木造且屋頂以不燃材料覆蓋者，則以相同施工方法每 Y 平方公尺進行 區劃分隔。請問 X、Y 分別為何？","options":{"A":"X=300 平方公尺，Y=200 平方公尺","B":"X=500 平方公尺，Y=200 平方公尺","C":"X=500 平方公尺，Y=500 平方公尺","D":"X=1000 平方公尺，Y=500 平方公尺"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-01","year":2014,"roc_year":103,"subject":"消防法規","category":"液化石油氣","no":1,"question":"依消防法施行細則，液化石油氣零售業者有關安全技術人員之規定，下列何者正確？①應經直轄市、 縣（市）消防機關認可之專業機構，講習訓練合格並領有證書 ②講習訓練時間不得少於 8 小時 ③每一年應接受複訓一次，每次複訓時數不得少於 4 小時 ④液化石油氣零售業者定期向轄區消防 機關申報資料應含安全技術人員管理資料","options":{"A":"①④","B":"①②④","C":"①③④","D":"①②③④"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-02","year":2014,"roc_year":103,"subject":"消防法規","category":"各類場所設置標準","no":2,"question":"依據建築技術規則及各類場所消防安全設備設置標準，高層建築物之防災中心設置規定，下列敘述 何者正確？","options":{"A":"出入口至屋外任一出入口之步行距離在 40 公尺以下","B":"應設於避難層或其直上層或直下層","C":"應以具有 2 小時以上防火時效及阻熱性之牆壁、防火門窗等防火設備及該層防火構造之樓地板予 以區劃分隔","D":"內設有供操作人員睡眠、休息區域時，其間隔應使用不燃材料為限"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-03","year":2014,"roc_year":103,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":3,"question":"民國 95 年 11 月 1 日前已設置之製造、儲存或處理公共危險物品及可燃性高壓氣體之場所，依公共 危險物品及可燃性高壓氣體設置標準暨安全管理辦法，如迄今仍未改善完畢者，依消防法可處下列 何項處罰？","options":{"A":"處其管理權人或行為人新臺幣 2 萬元以上 10 萬元以下罰鍰","B":"處其管理權人或行為人新臺幣 10 萬元以上 30 萬元以下罰鍰","C":"處其管理權人及行為人新臺幣 2 萬元以上 10 萬元以下罰金","D":"處其管理權人新臺幣 2 萬元以上 10 萬元以下罰金"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-04","year":2014,"roc_year":103,"subject":"消防法規","category":"其他消防法規","no":4,"question":"依防火牆及防火水幕設置基準，防火水幕設備之緊急電源相關規定，下列何者錯誤？","options":{"A":"防火水幕設備之緊急電源，應使用發電機設備、蓄電池設備或具有相同效果之引擎動力系統","B":"防火水幕設備之水源應連結加壓送水裝置並應連接緊急電源。但加壓送水裝置之驅動系統為引擎 或渦輪機者，免設緊急電源","C":"防火水幕設備之緊急電源供電容量時間，當儲槽容量未達 1 萬公秉者為 180 分鐘","D":"防火水幕設備之緊急電源供電容量時間，當儲槽容量達 1 萬公秉以上者為 240 分鐘"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-05","year":2014,"roc_year":103,"subject":"消防法規","category":"消防法／施行細則","no":5,"question":"依消防法施行細則規定，火災受害人或利害關係人得向直轄市、縣（市）消防機關申請火災證明。 該項證明內容包括：","options":{"A":"火災發生時間及地點","B":"火災發生原因、時間及地點","C":"火災發生原因、時間、地點及被延燒戶","D":"火災發生原因、時間、地點、被延燒戶及火災損失推估情形"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-06","year":2014,"roc_year":103,"subject":"消防法規","category":"各類場所設置標準","no":6,"question":"依各類場所消防安全設備設置標準規定，儲存一般可燃性固體物質倉庫之高度未超過 5.5 公尺者，或 易燃性液體物質之閃火點超過攝氏 60 度之作業場所或輕工業場所，稱為何種危險工作場所？","options":{"A":"高度","B":"重度","C":"中度","D":"低度"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-07","year":2014,"roc_year":103,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":7,"question":"依各類場所消防安全設備設置標準規定，公共危險物品等場所之滅火設備分類中第四種滅火設備係 指下列何種設備？","options":{"A":"乾燥砂、膨脹蛭石或膨脹珍珠岩等","B":"水霧、泡沫、二氧化碳或乾粉滅火設備","C":"自動撒水設備","D":"大型滅火器"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-08","year":2014,"roc_year":103,"subject":"消防法規","category":"防焰","no":8,"question":"依防焰性能試驗基準規定，防焰物品或其材料之防焰性能有關用語定義，下列敘述何者錯誤？","options":{"A":"餘燃時間係指自點火時間終了起，試樣之火焰繼續燃燒之時間","B":"碳化面積係指試樣經加熱燃燒後碳化部分之面積","C":"碳化距離係指試樣經加熱燃燒後碳化部分之最大長度","D":"接焰次數係指試樣經接觸火源至完全熔融燃燒時之接觸火源次數"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-09","year":2014,"roc_year":103,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":9,"question":"依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法，六類公共危險物品製造場所或一般處 理場所之構造規定，下列何者錯誤？","options":{"A":"應設於建築物之地面層或地上層","B":"牆壁、樑、柱、地板及樓梯，應以不燃材料建造；外牆有延燒之虞者，除出入口外，不得設置其 他開口，且應採用防火構造","C":"窗戶及出入口應設置至少 30 分鐘防火時效之防火門窗；牆壁開口有延燒之虞者，應設置至少 1 小 時防火時效之常時關閉式防火門","D":"窗戶及出入口裝有玻璃時，應使用強化玻璃"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-10","year":2014,"roc_year":103,"subject":"消防法規","category":"消防法／施行細則","no":10,"question":"依消防法規定，毀損供消防使用之蓄、供水設備或消防、救護設備者，除處 3 年以下有期徒刑或拘 役外，還有何種可能處罰？","options":{"A":"得併科新臺幣 6 千元以上 3 萬元以下罰金","B":"另併科新臺幣 6 千元以上 3 萬元以下罰鍰","C":"得易科新臺幣 6 千元以上 3 萬元以下罰金","D":"得易科新臺幣 6 千元以上 3 萬元以下罰鍰"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-11","year":2014,"roc_year":103,"subject":"消防法規","category":"建築防火／原有合法建築","no":11,"question":"依建築技術規則總則編，若干類型建築物應檢具防火避難綜合檢討報告書及評定書，或建築物防火 避難性能設計計畫書及評定書，經中央主管建築機關認可。下列建築物何者不在規定範圍內？","options":{"A":"供建築物使用類組 B-2 組（商場百貨）使用之總樓地板面積達 3 萬平方公尺以上之建築物","B":"高度達 25 層或 90 公尺以上之高層建築物，但僅供建築物用途類組 H-2 組（住宅）使用者，不受 此限","C":"具有高度超過 20 公尺以上且面積達 500 平方公尺以上之挑空中庭或挑高樓層建築物","D":"與地下公共運輸系統相連接之地下街或地下商場"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-12","year":2014,"roc_year":103,"subject":"消防法規","category":"消防設備人員制度","no":12,"question":"依消防設備師及消防設備士管理辦法規定，消防設備師及消防設備士應遵守事項，下列何者錯誤？","options":{"A":"消防設備師及消防設備士，應受各級消防機關之監督","B":"消防設備師及消防設備士執行業務時，應攜帶資格證件","C":"自取得證書日起每 3 年應接受講習一次或取得累計積分達 160 分以上之訓練證明文件","D":"執行業務，應備業務登記簿，以書面簿冊形式或電子檔案方式，並應妥善保存至少 3 年，以備各 級消防機關之查核"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-13","year":2014,"roc_year":103,"subject":"消防法規","category":"防焰","no":13,"question":"依防焰性能認證實施要點，有關消防法第 11 條第 1 項所稱地毯之規定，下列何者錯誤？","options":{"A":"地毯包括手工毯、滿舖地毯、方塊地毯、人工草皮與面積 2 平方公尺以上之門墊等","B":"防焰性能試驗之產品試樣規格 1 平方公尺以上","C":"地毯等地坪舖設物防焰標示方法限採鑲釘方式","D":"凡毛簇形式、毛高或底材不同者，則應分別送驗，依試驗結果分別取得不同之試驗合格號碼"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-14","year":2014,"roc_year":103,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":14,"question":"依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法，公共危險物品六類物品製造場所，其 外牆或相當於該外牆之設施外側，與廠區外鄰近場所之安全距離規定，下列何者錯誤？","options":{"A":"與古蹟之距離，應在 50 公尺以上","B":"與博物館、美術館之距離，應在 30 公尺以上","C":"與加油站、加氣站、天然氣儲槽、可燃性高壓氣體儲槽之距離，應在 20 公尺以上","D":"與電壓超過 3 萬 5 千伏特之高架電線之距離，應在 5 公尺以上"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-15","year":2014,"roc_year":103,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":15,"question":"依可燃性高壓氣體儲存場所防爆牆設置基準及可燃性高壓氣體儲存場所防護牆設置基準，有關防爆 牆與防護牆之規定，下列何者錯誤？","options":{"A":"防爆牆長度應超過設置方位儲存場所建築物牆面長度，防護牆則無此規定","B":"防爆牆與防護牆之構造皆分為鋼筋混凝土製、混凝土空心磚製及鋼板製等 3 種，且防護牆厚度較 防爆牆厚度大，另防護牆應對被波及處之耐火及延燒應具有充分阻絕效果，而防爆牆強度應能承 受可能預料之氣體爆炸衝擊","C":"防爆牆與防護牆之設置皆應與各設備保持適當距離，且防爆牆不得妨礙火災時之滅火行動，防護 牆不得使洩漏之氣體滯留或妨礙日常作業","D":"防爆牆與防護牆之耐風壓力，皆應依建築技術規則建築構造編之相關規定辦理"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-16","year":2014,"roc_year":103,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":16,"question":"依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法，下列用語定義，何者錯誤？","options":{"A":"第三類公共危險物品指發火性液體、發火性固體及禁水性物質","B":"在常用溫度下或溫度在攝氏 15 度時，表壓力達每平方公分 2 公斤以上或 0.2 百萬帕斯卡（MPa）以上 之壓縮乙炔氣屬可燃性高壓氣體之一","C":"公共危險物品販賣裝於容器之六類物品，其數量達管制量 15 倍以上，未達 40 倍之場所，稱為第 二種販賣場所","D":"儲槽係純供灌裝可燃性高壓氣體之移動式高壓容器"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-17","year":2014,"roc_year":103,"subject":"消防法規","category":"建築防火／原有合法建築","no":17,"question":"依建築技術規則建築設計施工編，下列有關緊急用昇降機之規定，何者錯誤？","options":{"A":"應有緊急電源之照明設備並設置消防栓、出水口、排煙設備、緊急電源插座等消防設備","B":"每座昇降機間之樓地板面積不得小於 10 平方公尺且在避難層之位置，自昇降機出口或昇降機間之 出入口至通往戶外出入口之步行距離不得大於 40 公尺","C":"應有能使設於各層機間及機廂內之昇降控制裝置暫時停止作用，並將機廂呼返避難層或其直上層、 下層之特別呼返裝置（一次消防）","D":"應設有使機廂門維持開啟狀態仍能昇降之裝置（二次消防）"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-18","year":2014,"roc_year":103,"subject":"消防法規","category":"防火管理","no":18,"question":"依消防法規定，一定規模以上供公眾使用建築物，應由管理權人，遴用防火管理人，責其製定消防 防護計畫，報請消防機關核備。所定一定規模以上供公眾使用建築物，其適用範圍有下列那些？ ①觀光旅館、旅館 ②醫院、療養院、養老院、長期照顧機構、安養機構、護理之家機構、產後護 理機構 ③捷運車站、高速鐵路車站 ④總樓地板面積在 500 平方公尺以上，且設有香客大樓或類 似住宿、休息空間，收容人數在 100 人以上之寺廟、宗祠、教堂或其他類似場所","options":{"A":"①②","B":"①②③","C":"①②④","D":"①②③④"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-19","year":2014,"roc_year":103,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":19,"question":"依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法，液化石油氣販賣場所儲放之液化石油 氣，總儲氣量不得超過 X 公斤。液化石油氣備用量，供營業使用者，不得超過 Y 公斤；供家庭使 用者，不得超過 Z 公斤。則 X、Y、Z 各為何？","options":{"A":"X = 140；Y = 80；Z = 40","B":"X = 128；Y = 80；Z = 30","C":"X = 128；Y = 80；Z = 40","D":"X = 120；Y = 60；Z = 30"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-20","year":2014,"roc_year":103,"subject":"消防法規","category":"各類場所設置標準","no":20,"question":"依各類場所消防安全設備設置標準規定，日間型、住宿型精神復健機構屬於何項用途分類？","options":{"A":"甲類場所","B":"乙類場所","C":"丙類場所","D":"丁類場所"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-21","year":2014,"roc_year":103,"subject":"消防法規","category":"各類場所設置標準","no":21,"question":"依據消防法第 6 條規定，下列不屬於各類場所消防安全設備設置標準應設置火警自動警報設備之場 所，何者應設置住宅用火災警報器？①旅館 ②老人福利機構場所 ③住宅場所 ④商場 ⑤兒童 課後照顧服務班及中心","options":{"A":"①②③","B":"①②③⑤","C":"①②③④⑤","D":"②③⑤"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-22","year":2014,"roc_year":103,"subject":"消防法規","category":"消防法／施行細則","no":22,"question":"依據消防法第 9 條，有關應設置消防安全設備場所之定期檢修規定，下列何者正確？","options":{"A":"高層建築物或地下建築物消防安全設備之定期檢修，其管理權人應委託消防設備師辦理","B":"定期檢修消防安全設備之性能檢查係指經由消防安全設備整體性之運作或使用，判別其機能","C":"定期檢修消防安全設備之檢查，於各類場所消防安全設備設置標準規定之甲類場所，每年實施 1 次，甲類以外場所，每 2 年實施 1 次","D":"應設消防安全設備之集合住宅，其消防安全設備定期之檢查，得由直轄市、縣（市）消防機關聘 用或委託消防專業人員辦理"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-23","year":2014,"roc_year":103,"subject":"消防法規","category":"其他消防法規","no":23,"question":"消防相關法規對產品認可之規定，下列敘述何者錯誤？","options":{"A":"地面樓層達 11 層以上建築物，其管理權人應使用附有防焰標示之防焰物品，其防焰物品或其材料 非附有防焰標示，不得銷售及陳列","B":"依各類場所消防安全設備設置標準規定之消防安全設備，非經中央主管機關所登錄機構之認可， 並附加認可標示者，不得銷售、陳列或設置使用","C":"液化石油氣容器，應經中央主管機關型式認可及個別認可合格，並附加合格標示後始可使用","D":"消防法第 11 條第 1 項所稱地毯、窗簾、布幕、展示用廣告板及其他指定之防焰物品，其中布幕係 指供舞台或攝影棚使用之布幕"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-24","year":2014,"roc_year":103,"subject":"消防法規","category":"防火管理","no":24,"question":"消防相關法規對於管理權人或負責人應遴用人員進行相關安全管理制度，下列何者正確？","options":{"A":"總樓地板面積在 200 平方公尺以上之餐廳應由管理權人，遴用防火管理人，責其製定消防防護計 畫，報請消防機關核備","B":"理容院應由管理權人，遴用防火管理人，責其製定消防防護計畫，報請消防機關核備","C":"製造公共危險物品達管制量 20 倍以上之場所，應由管理權人選任管理或監督層次以上之幹部為保 安監督人，擬訂消防防災計畫，報請當地消防機關核定","D":"防火管理人應製定消防防災計畫，報請消防機關核備；保安監督人應擬訂消防防護計畫，報請當 地消防機關核定"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-25","year":2014,"roc_year":103,"subject":"消防法規","category":"消防法／施行細則","no":25,"question":"依消防法施行細則，有關山林、田野引火燃燒之規定，下列何者錯誤？","options":{"A":"引火燃燒以開墾、整地、開闢防火巷等事由為限","B":"引火地點四周，應設置 3 公尺寬之防火間隔","C":"引火人應於 5 日前，向當地消防機關申請許可","D":"引火應在上午 6 時後，下午 6 時前為之"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-26","year":2014,"roc_year":103,"subject":"消防法規","category":"消防設備人員制度","no":26,"question":"依據消防設備師及消防設備士管理辦法，下列何者錯誤？","options":{"A":"消防設備師及消防設備士執行業務，應備業務登記簿，其業務登記簿至少應保存 5 年","B":"消防設備師及消防設備士，自取得證書日起每 2 年應接受講習一次或取得累計積分達 150 分以上 之訓練證明文件","C":"直轄市、縣（市）之消防設備師或消防設備士達 30 人以上者，得組織直轄市、縣（市）消防設備 師公會或消防設備士公會","D":"各級消防機關得檢查消防設備師及消防設備士之業務或必要時得令其報告，消防設備師及消防設 備士不得拒絕"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-27","year":2014,"roc_year":103,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":27,"question":"依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法規定，下列場所何者為可燃性高壓氣體 處理場所？①販賣裝於容器之六類物品，其數量未達管制量 15 倍之場所 ②販賣裝於容器之可燃性 高壓氣體之場所 ③檢驗供家庭用或營業用之液化石油氣容器之場所 ④使用液化石油氣作為燃氣 來源，其串接使用量達 80 公斤以上之場所 ⑤從事壓縮、液化或分裝可燃性高壓氣體之作業區及供 應其氣源之儲槽","options":{"A":"①②③","B":"②④⑤","C":"②③④","D":"②③④⑤"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-28","year":2014,"roc_year":103,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":28,"question":"儲存公共危險物品之數量在管制量 20 倍以下者，建築物之一部分得供作室內儲存場所使用，其有關 位置、構造及設備規定之敘述，下列何者正確？","options":{"A":"供作室內儲存場所使用之部分，通風及排出設備，應設置防火閘門。但管路以不燃材料建造，或 內部設置撒水頭防護，或設置達同等以上防護性能之措施者，不在此限","B":"供作室內儲存場所使用之部分，地板應高於地面，且樓層高度不得超過 4 公尺","C":"供作室內儲存場所使用之部分，樓地板面積不得超過 60 平方公尺","D":"僅能設於牆壁、柱及地板均為防火構造建築物之第 1 層"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-29","year":2014,"roc_year":103,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":29,"question":"某工廠有一室外柴油（閃火點 52℃）之儲槽，其水平截面積之最大直徑為 8 公尺，高度為 10 公尺， 依規定其自該儲槽側板至其廠區境界線距離為 40 公尺，惟現場儲槽側板至其廠區境界線距離僅為 30 公尺，業者想於廠區境界線上設置防火水幕，請問其防火水幕高度應達多少公尺以上？","options":{"A":"2 公尺","B":"2.4 公尺","C":"2.5 公尺","D":"3 公尺"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-30","year":2014,"roc_year":103,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":30,"question":"有關儲槽設置泡沫滅火設備，下列敘述何者正確？","options":{"A":"I 型泡沫放出口應在泡沫放出口上附設泡沫反射板，使放出之泡沫沿儲槽之側板內面流下，又不使 泡沫沉入液面下或攪動液面","B":"II 型泡沫放出口之構造應視該儲槽設置地區預期之最大降雨量，設有可充分排水之排水口","C":"特殊型泡沫放出口使用安裝在浮頂上方者，得免附設泡沫反射板","D":"補助泡沫消防栓應設在儲槽防液堤外圍，且至少應距離防液堤 15 公尺以上"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-31","year":2014,"roc_year":103,"subject":"消防法規","category":"其他消防法規","no":31,"question":"自動撒水設備竣工時之加壓試驗，下列何者錯誤？","options":{"A":"應以水壓試驗，試驗壓力不得小於加壓送水裝置全閉揚程 1.5 倍以上","B":"水壓試驗壓力以繼續維持 2 小時無漏水現象為合格","C":"密閉乾式管系應併行空氣壓試驗，試驗時，應使空氣壓力達到每平方公分 2.8 公斤或 0.28 MPa 之 標準","D":"空氣壓試驗壓力持續 12 小時，漏氣減壓量應在每平方公分 0.1 公斤以下或 0.01 MPa 以下為合格"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-32","year":2014,"roc_year":103,"subject":"消防法規","category":"建築防火／原有合法建築","no":32,"question":"下列有關防火門構造規定，何者正確？","options":{"A":"防火門窗周邊 20 公分範圍內之牆壁，應以不燃材料建造","B":"常時關閉式之防火門，單一門扇面積，不得超過 2 平方公尺","C":"常時開放式之防火門，採用防火捲門者，應附設門扇寬度 75 公分以上，高度 180 公分以上之防火門","D":"供住宅使用及宿舍寢室、旅館客房、醫院病房等連接走廊者，防火門應朝避難方向開啟"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-33","year":2014,"roc_year":103,"subject":"消防法規","category":"建築防火／原有合法建築","no":33,"question":"依建築技術規則建築設計施工編，有關建築物防火區劃之規定，何者正確？①防火構造建築物，按 每 1500 平方公尺區劃分隔 ②防火構造建築物防火區劃之牆壁，應突出建築物外牆面 50 公分以上 ③非防火構造之建築物，其主要構造使用不燃材料建造者，按總樓地板面積每 1000 平方公尺區劃分 隔 ④非防火構造之建築物，其主要構造為木造建造者，按總樓地板面積每 500 平方公尺區劃分隔","options":{"A":"①②③","B":"②③④","C":"①③④","D":"①②③④"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-34","year":2014,"roc_year":103,"subject":"消防法規","category":"建築防火／原有合法建築","no":34,"question":"依建築技術規則建築設計施工編規定，下列何者為「不燃材料」？","options":{"A":"石膏板","B":"耐燃石膏板","C":"鋁、玻璃、玻璃纖維","D":"耐燃纖維板"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-35","year":2014,"roc_year":103,"subject":"消防法規","category":"各類場所設置標準","no":35,"question":"依各類場所消防安全設備設置標準規定，每層樓地板面積在 500 平方公尺以內，得以防煙壁區劃， 區劃範圍內任一部分至排煙口之水平距離，不得超過幾公尺？","options":{"A":"30 公尺","B":"35 公尺","C":"40 公尺","D":"45 公尺"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-36","year":2014,"roc_year":103,"subject":"消防法規","category":"其他消防法規","no":36,"question":"有關緊急廣播設備之設置，下列何者錯誤？","options":{"A":"各樓層任一點至啟動裝置之步行距離在 50 公尺以下","B":"各類場所第 11 層以上之各樓層、地下第 2 層以下之各樓層或地下建築物，應使用緊急電話方式啟動","C":"廣播區域超過 100 平方公尺時，設Ｌ級揚聲器","D":"距 L 級揚聲器 1 公尺處所測得音壓為 92 分貝以上"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-37","year":2014,"roc_year":103,"subject":"消防法規","category":"其他消防法規","no":37,"question":"有關室外消防栓之設置，下列敘述何者錯誤？①瞄子出水壓力在每平方公分 2.5 公斤以上，出水量應 在每分鐘 350 公升以上 ②防護顯著滅火困難場所時，至少應設置 2 支以上，設置數量超過 5 支時， 其放水量以同時使用 5 支計算之 ③5 公尺範圍內附設水帶箱，4 公尺以內保持空曠 ④水源容量應 在 2 具室外消防栓同時放水 30 分鐘之水量以上","options":{"A":"②③","B":"②③④","C":"①③","D":"②④"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-38","year":2014,"roc_year":103,"subject":"消防法規","category":"各類場所設置標準","no":38,"question":"依據各類場所消防安全設備設置標準，有關乾粉滅火設備之規定，下列何者錯誤？","options":{"A":"供室內停車空間使用之滅火藥劑，以第三種乾粉為限","B":"乾粉滅火設備自儲存容器起，其配管任一部分與彎曲部分之距離應為管徑 15 倍以上。但能採取乾 粉藥劑與加壓或蓄壓用氣體不會分離措施者，不在此限","C":"使用氣體啟動者，啟動用氣體容器之內容積有 0.27 公升以上，其所儲存之氣體量在 145 公克以上， 且其充填比在 1.5 以上","D":"全區及局部放射方式之噴頭之放射壓力在每平方公分 1 公斤以上或 0.1 MPa 以上"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-39","year":2014,"roc_year":103,"subject":"消防法規","category":"各類場所設置標準","no":39,"question":"依據各類場所消防安全設備設置標準規定，火警自動警報設備，其受信總機、中繼器及偵煙式探測 器，有設定蓄積時間時，其蓄積時間之合計，每一火警分區應在幾秒以下？","options":{"A":"60 秒以下","B":"80 秒以下","C":"40 秒以下","D":"20 秒以下"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2014-消防法規-40","year":2014,"roc_year":103,"subject":"消防法規","category":"其他消防法規","no":40,"question":"有關自動撒水設備之設置規定，下列何者正確？","options":{"A":"設置密閉式撒水頭時，最高周圍溫度在 64 度以上 106 度未滿時，應選用標示溫度為 75 度以上 121 度 未滿之撒水頭","B":"開放式自動撒水設備之感知撒水頭，應使用標示溫度在 79 度以下者，且每 20 平方公尺設置一個","C":"密閉乾式或預動式自動撒水設備，撒水頭動作後，流水檢知裝置應在 2 分鐘內，使撒水頭放水","D":"開放式自動撒水設備之感知撒水頭，應設在裝置面距離樓地板高度 6 公尺以下"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-01","year":2015,"roc_year":104,"subject":"消防法規","category":"其他消防法規","no":1,"question":"依二氧化碳滅火設備使用之各種標示規格之規定，下列何者錯誤？","options":{"A":"移動放射方式標示規格，為紅底白字","B":"放射表示燈規格，平時底及字樣均為紅色，點燈時紅底白字","C":"手動啟動裝置標示規格，為紅底白字","D":"音響警報裝置標示規格，為黃底黑字"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-02","year":2015,"roc_year":104,"subject":"消防法規","category":"住宅用火災警報器","no":2,"question":"依住宅用火災警報器認可基準之規定，下列何者正確？","options":{"A":"帶電部應有充分保護且人員不易從外部碰觸，額定電壓超過 40 V 時，應採用塗裝以外之絕緣方法","B":"住警器電池電壓在有效動作之電壓下限值時，應能自動以閃滅或音響方式表示電池即將耗盡，且在尚 未以手動方式停止前，能持續警示 72 小時以上","C":"住警器電池使用期限在正常使用及定時檢測（每月一次，每次 10 秒之檢測頻率）狀態下，應有 5 年以 上之使用期限","D":"火災警報具有多段性音壓增加功能者，應在發出警報音開始 15 秒以內到達 70 dB"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-03","year":2015,"roc_year":104,"subject":"消防法規","category":"檢修申報／檢修基準","no":3,"question":"下列何種場所，每年實施消防安全設備檢修申報一次？","options":{"A":"超級市場","B":"飯店","C":"幼兒園","D":"醫院"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-04","year":2015,"roc_year":104,"subject":"消防法規","category":"消防法／施行細則","no":4,"question":"依消防法，有關消防安全設備設置之規定，下列何者正確？","options":{"A":"各類場所消防安全設備設置標準應設置火警自動警報設備住宅場所之管理權人，應設置並維護住宅用 火災警報器","B":"各類場所消防安全設備設置標準應設置火警自動警報設備之旅館管理權人，應設置並維護住宅用火災 警報器","C":"各類場所之所有權人應設置並維護其消防安全設備","D":"各類場所因用途、構造特殊者，得檢附具體證明，經中央主管機關核准，不適用各類場所消防安全設 備設置標準之全部或一部"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-05","year":2015,"roc_year":104,"subject":"消防法規","category":"各類場所設置標準","no":5,"question":"依消防法及各類場所消防安全設備設置標準，有關地下建築物規定，下列何者正確？","options":{"A":"地下建築物其管理權有分屬時，各管理權人應協議製定共同消防防護計畫，並報請消防機關備查","B":"地下建築物消防安全設備之定期檢修，其管理權人應委託中央主管機關審查合格之專業機構辦理","C":"總樓地板面積在 500 平方公尺以上之地下建築物應設置自動撒水設備","D":"地下建築物其管理權人可不使用附有防焰標示之地毯、窗簾"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-06","year":2015,"roc_year":104,"subject":"消防法規","category":"消防法／施行細則","no":6,"question":"依消防法及消防機關辦理建築物消防安全設備審查及查驗作業基準，有關消防安全設備圖說審查規定， 下列何者正確？","options":{"A":"竣工現場設置之消防安全設備與原審訖消防圖說之設備數量或位置有異動時，於不影響設備功能及性 能之情形下，得直接修改竣工圖，並於申請查驗時，備具完整竣工消防圖說，一次報驗","B":"供公眾使用建築物變更為非供公眾使用時，主管建築機關應會同消防機關審查其消防安全設備圖說","C":"消防安全設備圖說審查及竣工查驗之期限，以受理案件後 14 日內結案為原則","D":"非供公眾使用建築物之消防安全設備圖說，應由直轄市、縣（市）消防機關於主管建築機關許可開工 前審查完成"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-07","year":2015,"roc_year":104,"subject":"消防法規","category":"其他消防法規","no":7,"question":"有關消防法罰則之規定，何者正確？","options":{"A":"未僱用領有合格證照者從事熱水器及配管之安裝，處負責人及行為人新臺幣 1 萬元以上 5 萬元以下罰鍰","B":"謊報火警者，處新臺幣 6 千元以上 2 萬元以下罰鍰","C":"消防設備師或消防設備士為消防安全設備不實檢修報告者，處新臺幣 1 萬元以上 5 萬元以下罰鍰","D":"毀損消防瞭望臺、無線電塔臺者，處 3 年以下有期徒刑或拘役，得併科新臺幣 1 萬元以上 5 萬元以下罰金"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-08","year":2015,"roc_year":104,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":8,"question":"依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法之規定，下列何種氣體為「其他經中央主管 機關指定之氣體」，所指定之可燃性高壓氣體？","options":{"A":"氯丙烯","B":"丁二烯","C":"氯氣","D":"氨氣"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-09","year":2015,"roc_year":104,"subject":"消防法規","category":"防火管理","no":9,"question":"依消防法之規定，何種場所，其管理權人應使用附有防焰標示之地毯、窗簾、布幕、展示用廣告板及其 他指定之防焰物品？①專用樓地板面積 500 平方公尺的零售市場 ②專用樓地板面積 300 平方公尺之托 嬰中心 ③專用樓地板面積 300 平方公尺之史蹟資料館 ④專用樓地板面積合計 300 平方公尺以上之保 齡球館","options":{"A":"①②③","B":"②③④","C":"①②④","D":"①③④"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-10","year":2015,"roc_year":104,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":10,"question":"依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法之規定，液化石油氣容器檢驗場實施檢驗應 向中央主管機關申請認可，經審查合格發給認可證書，認可證書之有效期限 A 年，期限屆滿 B 個月前得 向中央主管機關申請展延，每次展延期間 C 年，下列 A, B, C 何者正確？","options":{"A":"A = 1, B = 1, C = 1","B":"A = 2, B = 2, C = 2","C":"A = 3, B = 2, C = 3","D":"A = 3, B = 3, C = 3"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-11","year":2015,"roc_year":104,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":11,"question":"依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法之規定，有關六類物品製造場所，其外牆或 相當於該外牆之設施外側，與廠區外鄰近場所之安全距離，下列何者正確？","options":{"A":"與博物館之距離，應在 30 公尺以上","B":"與電壓超過 35,000 伏特之高架電線之距離，應在 3 公尺以上","C":"與爆竹煙火製造場所之距離，應在 10 公尺以上","D":"與加氣站之距離，應在 20 公尺以上"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-12","year":2015,"roc_year":104,"subject":"消防法規","category":"各類場所設置標準","no":12,"question":"依各類場所消防安全設備設置標準之規定，木材加工業作業場所及油漆作業場所等，稱為何種危險工作 場所？","options":{"A":"低度","B":"中度","C":"高度","D":"重度"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-13","year":2015,"roc_year":104,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":13,"question":"依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法之規定，有關公共危險物品之種類、名稱及 管制量，下列何者正確？","options":{"A":"硫磺：第二類，易燃固體，管制量 50 公斤","B":"乙醛：第四類，易燃液體，管制量 50 公升","C":"動植物油類：第四類，易燃液體，管制量 6,000 公升","D":"烷基鋁：第三類，發火性液體、發火性固體及禁水性物質，管制量 50 公斤"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-14","year":2015,"roc_year":104,"subject":"消防法規","category":"消防法／施行細則","no":14,"question":"依消防法之規定，何者應實施防火管理？①收容人數 50 人（含員工）之托嬰中心 ②總樓地板面積 300 平方公尺之產後護理機構 ③總樓地板面積 350 平方公尺之健身休閒中心 ④總樓地板面積 250 平方公 尺之補習班","options":{"A":"①②③","B":"①③④","C":"①②④","D":"②③④"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-15","year":2015,"roc_year":104,"subject":"消防法規","category":"各類場所設置標準","no":15,"question":"依各類場所消防安全設備設置標準之規定，有關水霧滅火設備之敘述，下列何者正確？","options":{"A":"水霧滅火設備之水源容量，放射區域在二區域以上者，應保持 40 立方公尺以上","B":"水霧滅火設備之水源，應連結加壓送水裝置，使用消防幫浦時，其出水量每分鐘 1,000 公升以上","C":"水霧噴頭，每一水霧噴頭之有效半徑在 2.6 公尺以下","D":"放射區域有二區域以上者，其主管管徑應在 60 毫米以上"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-16","year":2015,"roc_year":104,"subject":"消防法規","category":"各類場所設置標準","no":16,"question":"依各類場所消防安全設備設置標準之規定，有關密閉式撒水頭位置之裝置，下列何者正確？","options":{"A":"密閉式撒水頭之迴水板裝設於裝置面（指樓板或天花板）下方，其間距在 50 公分以下","B":"密閉式撒水頭裝置於樑下時，迴水板與樑底之間距在 30 公分以下，且與樓板或天花板之間距在 50 公 分以下","C":"密閉式撒水頭裝置面，四周以淨高 30 公分以上之樑或類似構造體區劃包圍時，按各區劃裝置","D":"使用密閉式撒水頭，且風管等障礙物之寬度超過 120 公分時，該風管等障礙物下方，亦應設置"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-17","year":2015,"roc_year":104,"subject":"消防法規","category":"各類場所設置標準","no":17,"question":"依各類場所消防安全設備設置標準之規定，有關火警自動警報設備探測器之裝置位置，下列何者正確？","options":{"A":"局限型探測器之裝置，得傾斜 45 度以上","B":"局限型探測器以裝置在探測區域周圍附近為原則","C":"牆上設有出風口時，應距離該出風口 1.5 公尺以上","D":"天花板設排氣口或回風口時，偵煙式探測器應裝置於排氣口或回風口周圍 2 公尺範圍內"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-18","year":2015,"roc_year":104,"subject":"消防法規","category":"消防設備人員制度","no":18,"question":"依消防設備師及消防設備士管理辦法規定，有關消防設備師之敘述，下列何者正確？①執行業務，應備業 務登記簿，業務登記簿至少應保存 3 年 ②自取得證書日起每 3 年應接受講習一次 ③直轄市、縣（市） 之消防設備師達 20 人以上者，得組織直轄市、縣（市）消防設備師公會 ④各級消防設備師公會之組織 及活動，依人民團體法規定辦理","options":{"A":"①②","B":"②④","C":"①②③","D":"②③④"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-19","year":2015,"roc_year":104,"subject":"消防法規","category":"消防設備人員制度","no":19,"question":"依消防安全設備檢修專業機構管理辦法之規定，有關消防安全設備檢修專業機構之敘述，下列何者正確？ ①應具備實收資本額在新臺幣 500 萬元以上之公司 ②專任之消防設備師及消防設備士合計達 10 人以上， 其中消防設備師至少 2 人 ③檢修機構合格證書記載事項變更時，應於 30 日內向內政部申請變更登記 ④檢修機構應於年度終結後 3 個月內，檢具書表，報請內政部核定","options":{"A":"①②","B":"①④","C":"②③","D":"②④"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-20","year":2015,"roc_year":104,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":20,"question":"依防火牆及防火水幕設置基準之規定，某儲槽儲存閃火點 90℃之公共危險物品，且儲槽水平剖面最大直 徑為 8 公尺，其假想火面高度為幾公尺？","options":{"A":"8 公尺","B":"12 公尺","C":"16 公尺","D":"24 公尺"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-21","year":2015,"roc_year":104,"subject":"消防法規","category":"防焰","no":21,"question":"依防焰性能試驗基準，有關防焰物品或其材料之防焰性能之規定，下列何者正確？①餘燃時間：展示用 廣告板不得超過 30 秒 ②餘焰時間：展示用廣告板不得超過 15 秒 ③碳化面積：展示用廣告板不得超 過 100 平方公分 ④接焰次數：具熱熔融性之纖維製品應達三次以上","options":{"A":"①②","B":"①④","C":"②③","D":"②④"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-22","year":2015,"roc_year":104,"subject":"消防法規","category":"防焰","no":22,"question":"依防焰性能認證實施要點，有關防焰性能試驗之產品試樣規格之規定，下列何者正確？①室內展示用廣 告合板：1.5 平方公尺以上 ②地毯等地坪舖設物：1 平方公尺以上 ③窗簾、布幕，須經水洗及乾洗處 理者：2 平方公尺以上 ④布製折屏或百葉窗簾：2 平方公尺以上","options":{"A":"②④","B":"①③","C":"②③","D":"①④"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-23","year":2015,"roc_year":104,"subject":"消防法規","category":"其他消防法規","no":23,"question":"依消防幫浦加壓送水裝置等及配管摩擦損失計算基準之規定，下列何者正確？","options":{"A":"幫浦所消耗之動力，在額定出水量 110%時，其軸動力不得超過馬達額定輸出馬力之 150%","B":"幫浦本體必須能耐最高水壓之 1.5 倍以上，且加壓 2 分鐘後，各部位仍無洩漏現象才算合格","C":"電動機在額定輸出連續運轉 6 小時後，不得發生異狀","D":"防止水溫上升用之排放管應使用口徑 15 mm 以上者"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-24","year":2015,"roc_year":104,"subject":"消防法規","category":"各類場所設置標準","no":24,"question":"依各類場所消防安全設備設置標準之規定，下列何種場所或樓層，應設置自動撒水設備？","options":{"A":"總樓地板面積 200 平方公尺之護理之家機構","B":"總樓地板面積 500 平方公尺以上之地下建築物","C":"15 層建築物之 6 樓層，總樓地板面積 200 平方公尺之戲院","D":"9 層建築物之 3 樓層，總樓地板面積 250 平方公尺之俱樂部"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-25","year":2015,"roc_year":104,"subject":"消防法規","category":"其他消防法規","no":25,"question":"依建築法之規定，下列何者正確？","options":{"A":"非供公眾使用建築物之室內裝修應申請審查許可","B":"直轄市、縣（市）（局）主管建築機關應自收到申請拆除執照書件之日起 10 日內審查完竣，合於規定 者，發給拆除執照","C":"建築物在施工中，鄰接其他建築物施行挖土工程時，對該鄰接建築物應視需要作防護其傾斜之措施。 挖土深度在 1 公尺以上者，其防護措施之設計圖樣及說明書，應於申請建造執照或雜項執照時一併送審","D":"2 層以上建築物施工時，其施工部分距離道路境界線或基地境界線不足 2.5 公尺者，應設置防止物體墜 落之適當圍籬"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-26","year":2015,"roc_year":104,"subject":"消防法規","category":"建築防火／原有合法建築","no":26,"question":"依建築技術規則建築設計施工編之規定，有關建築技術用語之定義，下列何者正確？","options":{"A":"基地地面：基地整地完竣後，建築物外牆與地面接觸最低一側之水平面；基地地面高低相差超過 3 公 尺，以每相差 3 公尺之水平面為該部分基地地面","B":"耐燃材料：經中央主管建築機關認定符合耐燃二級之材料","C":"無窗戶居室：樓地板面積超過 30 平方公尺之居室，其天花板或天花板下方 80 公分範圍以內之有效通 風面積未達樓地板面積 2%者","D":"集合住宅：具有共同基地及共同空間或設備。並有二個住宅單位以上之建築物"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-27","year":2015,"roc_year":104,"subject":"消防法規","category":"建築防火／原有合法建築","no":27,"question":"依建築技術規則建築設計施工編，有關防火門窗構造之規定，下列何者正確？","options":{"A":"防火門窗周邊 15 公分範圍內之牆壁應以耐燃材料建造","B":"防火門之門扇寬度應在 75 公分以上，高度應在 180 公分以上","C":"常時關閉式之防火門，單一門扇面積不得超過 5 平方公尺","D":"常時開放式之防火門，採用防火捲門者，應附設門扇寬度在 70 公分以上，高度在 180 公分以上之防火門"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-28","year":2015,"roc_year":104,"subject":"消防法規","category":"其他消防法規","no":28,"question":"依緊急電源容量計算基準之規定，下列何者正確？","options":{"A":"同一建築基地之不同場所，其各類場所之消防安全設備緊急電源負載總容量，小於供給其最大場所之 負載所需之輸出容量時，得共用緊急電源，由一緊急發電機設備供給電力","B":"一場所設置二種以上之消防安全設備同時啟動時，設有能按次序逐次於 10 秒內供給消防安全設備電力 之裝置時，得免計入瞬時全負載投入之輸出容量","C":"蓄電池容量之計算需先決定維護因數、放電時間與放電電流、容許最高電壓、最高蓄電池溫度等四項 條件","D":"發電機與原動機組合為緊急發電機組，其整合率（MR）應大於 1"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-29","year":2015,"roc_year":104,"subject":"消防法規","category":"建築防火／原有合法建築","no":29,"question":"依建築技術規則設計施工編之規定，建築物在 2 樓以上，第 10 層以下之各樓層，應設置緊急進口，有關 其構造之敘述，下列何者正確？","options":{"A":"進口應設面臨道路或寬度在 5 公尺以上通路之各層外牆面","B":"進口之間隔不得大於 50 公尺","C":"進口之寬度應在 75 公分以上，高度應在 1.2 公尺以上。其開口之下端應距離樓地板面 120 公分範圍以內","D":"進口外應設置陽台，其寬度應為 1 公尺以上，長度 4 公尺以上"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-30","year":2015,"roc_year":104,"subject":"消防法規","category":"其他消防法規","no":30,"question":"依消防機關辦理建築物消防安全設備圖說審查及竣工查驗作業基準之規定，下列何者錯誤？","options":{"A":"消防安全設備圖說審查之期限，以受理案件後 7 至 10 日內結案為原則","B":"消防機關受理竣工查驗之期限，以受理案件後 30 日內結案為原則","C":"完成竣工查驗者，其消防圖說應標明「竣工圖」字樣，送消防機關加蓋驗訖章","D":"竣工圖消防機關留存二份列管檢查，餘交起造人留存"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-31","year":2015,"roc_year":104,"subject":"消防法規","category":"各類場所設置標準","no":31,"question":"依各類場所消防安全設備設置標準之規定，建築物之各樓層供避難及消防搶救用之有效開口，下列何者 正確？","options":{"A":"開口下端距樓地板面 140 公分以內","B":"開口面臨道路或寬度 1 公尺以上之通路","C":"開口有柵欄且內部未設妨礙避難之構造或阻礙物","D":"開口為可自外面開啟或輕易破壞得以進入室內之構造，採一般玻璃門窗時，厚度應在 8 毫米以下"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-32","year":2015,"roc_year":104,"subject":"消防法規","category":"防焰","no":32,"question":"依防焰性能認證作業規定，下列何者正確？","options":{"A":"防焰性能認證之申請人為從事防焰物品或其材料之裁剪、縫製、安裝業者時，應經由直轄市、縣（市） 消防機關向內政部申請","B":"申請案不合程序或有欠缺，其可以補正者，補正期間以 2 個月為限","C":"直轄市、縣（市）消防機關於受理申請案經調查後，於 10 日內附具調查意見表，連同申請書及其相關 資料各二份送內政部審查，餘一份留存消防機關","D":"經實地調查不合規定時，由內政部檢附審查結果，通知申請人得於文到之日起 3 個月內改善，逾期不 改善或改善不合規定者，應附理由駁回其申請，審查費不予退還"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-33","year":2015,"roc_year":104,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":33,"question":"依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法第三章可燃性高壓氣體場所設置及安全管理 之規定，下列何者錯誤？","options":{"A":"液化石油氣販賣場所儲放之液化石油氣，總儲氣量不得超過 128 公斤","B":"液化石油氣儲存場所僅供一家販賣場所使用之面積，不得少於 6 平方公尺","C":"容器串接使用場所，串接使用量在 120 公斤以上未滿 300 公斤者，容器與用火設備保持 2 公尺以上距離","D":"可燃性高壓氣體儲存場所採用不燃材料構造之地面一層建築物，屋頂應以輕質金屬板或其他輕質不燃 材料覆蓋，屋簷並應距離地面 2.5 公尺以上"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-34","year":2015,"roc_year":104,"subject":"消防法規","category":"防焰","no":34,"question":"依防焰性能試驗基準之規定，有關防焰物品或其材料之防焰性能，其餘焰時間之敘述，下列何者正確？","options":{"A":"薄纖維製品（每平方公尺質量 450 公克以下者）不得超過 5 秒","B":"展示用廣告板不得超過 15 秒","C":"厚纖維製品（每平方公尺質量超過 450 公克者）不得超過 10 秒","D":"地毯等地坪舖設物類不得超過 20 秒"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-35","year":2015,"roc_year":104,"subject":"消防法規","category":"各類場所設置標準","no":35,"question":"依各類場所消防安全設備設置標準規定，各類場所於增建、改建或變更用途時，其消防安全設備之設置， 以下何者適用增建、改建或變更用途前之標準？","options":{"A":"其消防安全設備為滅火器者","B":"增建或改建部分，以「各類場所消防安全設備設置標準」中華民國 85 年 7 月 1 日修正條文施行日起， 樓地板面積合計達 2,000 平方公尺者","C":"增建或改建部分，以「各類場所消防安全設備設置標準」中華民國 85 年 7 月 1 日修正條文施行日起， 樓地板面積合計達 500 平方公尺，占原建築物總樓地板面積達二分之一者","D":"其消防安全設備為自動撒水設備者"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-36","year":2015,"roc_year":104,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":36,"question":"依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法之規定，有關六類物品製造場所位置、構造 及設備規定之敘述，下列何者正確？","options":{"A":"若無積存可燃性蒸氣或可燃性粉塵之虞之建築物，得免除充分之通風設備相關規定","B":"外牆與加油站之距離應在 10 公尺以上","C":"構造不得設於建築物之地下層","D":"外牆與古蹟之距離應在 30 公尺以上"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-37","year":2015,"roc_year":104,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":37,"question":"依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法之規定，室外儲槽場所儲存易燃液體者，應 設置防液堤，下列何者正確？","options":{"A":"防液堤高度應在 1.5 公尺以上","B":"防液堤內面積不得超過 6 萬平方公尺","C":"儲槽容量超過 1 萬公秉，應在各個儲槽周圍設置分隔堤，分隔堤高度應在 30 公分以上，且至少低於防 液堤 10 公分","D":"防液堤周圍應設道路，並與區內道路連接，道路寬度不得小於 6 公尺"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-38","year":2015,"roc_year":104,"subject":"消防法規","category":"防火管理","no":38,"question":"依消防法及消防法施行細則之規定，有關消防防護計畫應包括事項之敘述，下列何者正確？","options":{"A":"每年應舉辦一次滅火、通報及避難訓練，每次不得少於 4 小時","B":"自衛消防編組，若員工 30 人以下者，應包含滅火、通報、避難引導、安全防護及救護班","C":"防火避難設施之自行檢查，每兩個月至少檢查一次，檢查結果遇有缺失，應報告管理權人立即改善","D":"防災應變之教育訓練及防止縱火措施"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-39","year":2015,"roc_year":104,"subject":"消防法規","category":"防焰","no":39,"question":"有關防焰規制敘述，下列何者錯誤？","options":{"A":"防焰物品或其材料之防焰標示，應經中央主管機關認證具有防焰性能","B":"防焰物品包括地毯、窗簾、布幕、展示用廣告板及其他指定者","C":"防焰物品或其材料非附有防焰標示，不得銷售及陳列","D":"自點火時間終了起，至試樣停止燃燒之時間稱為點火時間"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2015-消防法規-40","year":2015,"roc_year":104,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":40,"question":"依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法之六類物品儲槽之容量、內容量、空間容積 規定，下列何者錯誤？","options":{"A":"儲槽之容量不得大於儲槽之內容積扣除其空間容積後所得之量","B":"豎型圓筒形儲槽內容積不含槽頂部分","C":"儲槽（無需設置固定式滅火設備者）空間容積為內容積之 5%至 15%","D":"儲槽上部設有固定式滅火設備者，其空間容積以其滅火藥劑放出口下方 30 公分以上，未達 1 公尺之水 平面上部計算之"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-01","year":2016,"roc_year":105,"subject":"消防法規","category":"檢修申報／檢修基準","no":1,"question":"依據各類場所消防安全設備檢修及申報作業基準之規定，下列何者符合規定？①綜合檢查係各類場所消 防安全設備檢查方式其中之一種 ②消防機關針對違規場所無須就其消防安全設備進行檢修，應逕行舉 發並令其停止使用 ③自取得使用執照之合法場所，甲類場所距申報截止日期在 1 年以內者，當次免辦 理檢修申報 ④乙類場所之所有權人，於每年 12 月 31 日前申報其檢修結果 ⑤簡易自動滅火設備係為 各類場所消防安全設備檢修項目之一","options":{"A":"①④","B":"①⑤","C":"②③④","D":"①④⑤"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-02","year":2016,"roc_year":105,"subject":"消防法規","category":"防火管理","no":2,"question":"依消防法規定，有關違反消防法第 6 條第 4 項住宅用火災警報器設置、維護之規定，經通知限期改善， 逾期不改善或複查不合規定者，處其管理權人多少罰鍰？經處罰鍰後仍不改善者，得連續處罰，並得予 以多少日以下之停業或停止其使用之處分？","options":{"A":"新臺幣三千元以上一萬元以下；20 日","B":"新臺幣三千元以上一萬五千元以下；30 日","C":"新臺幣六千元以上一萬五千元以下；30 日","D":"新臺幣六千元以上三萬元以下；30 日"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-03","year":2016,"roc_year":105,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":3,"question":"依公共危險物品試驗方法及判定基準，有關易燃性液體之判定基準，下列規定何者錯誤？①閃火點＜21℃ 者，為特殊易燃物 ②21℃℃閃火點＜70℃者，為第一石油類（非水溶性液體） ③70℃℃閃火點＜20
