"B":"16","C":"20","D":"22"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2025-消防法規-04","year":2025,"roc_year":114,"subject":"消防法規","category":"檢修申報／檢修基準","no":4,"question":"依消防安全設備檢修及申報辦法規定，有關消防安全設備檢修完成標示附加位置，下列何者 錯誤？","options":{"A":"消防專用蓄水池：檢修完成標示附加位置在蓄水池附近","B":"排煙設備：檢修完成標示附加位置在控制盤盤面","C":"無線電通信輔助設備：檢修完成標示附加位置在保護箱箱面","D":"緊急電源插座：檢修完成標示附加位置在專用回路開關附近"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2025-消防法規-05","year":2025,"roc_year":114,"subject":"消防法規","category":"其他消防法規","no":5,"question":"依消防安全設備設計監造測試及檢修作業辦法規定，有關消防設備人員簽署圖說、紀錄、測 試報告書或檢修報告書，其簽署及加蓋執業圖記方式之敘述，下列何者正確？","options":{"A":"圖說：於消防安全設備圖說審查申請書、圖說首頁簽署及加蓋執業圖記，圖說每頁設計圖 加蓋執業圖記","B":"紀錄：於監造計畫中之紀錄、表單文件每頁加蓋執業圖記","C":"測試報告書：於消防安全設備查驗申請書、各種消防安全設備測試報告書首頁簽署及加蓋 執業圖記，每頁測試報告書加蓋執業圖記","D":"檢修報告書：於消防安全設備檢修報告書、各種消防安全設備檢查表首頁簽署及加蓋執業 圖記，每頁檢查表加蓋執業圖記"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2025-消防法規-06","year":2025,"roc_year":114,"subject":"消防法規","category":"其他消防法規","no":6,"question":"依消防機關辦理建築物消防安全設備審查及查驗作業基準規定，消防安全設備圖說審查及竣 工查驗之期限，以受理案件後幾日內結案為原則：","options":{"A":"5～7","B":"7～10","C":"10～14","D":"14～21"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2025-消防法規-07","year":2025,"roc_year":114,"subject":"消防法規","category":"消防設備人員制度","no":7,"question":"依消防機關辦理建築物消防安全設備審查及查驗作業基準規定，消防設備師依「緊急電源容 量計算基準」核算供消防安全設備所須之緊急電源容量後，應以書面知會電機技師供納入整 合緊急發電系統設計容量考量，電機技師於接獲前揭消防用緊急電源容量計算結果資料，應 於幾日內確認有無影響建築整體緊急發電設備設計之虞，並以書面通知知會之消防設備師， 逾期未通知時視為無意見：","options":{"A":"7","B":"14","C":"21","D":"30"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2025-消防法規-08","year":2025,"roc_year":114,"subject":"消防法規","category":"消防設備人員制度","no":8,"question":"依消防設備人員執業執照登記辦法規定，消防設備人員受撤銷、廢止執業執照或停止執行業 務之處分者，應於處分送達次日起幾日內，將執業執照繳交原登記主管機關註銷或收存。逾 期未繳交者，由原登記主管機關公告註銷，並通知其所屬公會：","options":{"A":"7","B":"15","C":"20","D":"30"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2025-消防法規-09","year":2025,"roc_year":114,"subject":"消防法規","category":"其他消防法規","no":9,"question":"依消防安全設備設計監造測試及檢修作業辦法規定，同一案件之下列何種消防 火處，且每一層任何一 處至插座之水平距離在 50 公尺以下","B":"緊急電源插座為接地型，裝設高度距離樓地板 0.8 公尺以上 1.2 公尺以下","C":"應從主配電盤設專用回路，各層至少設 2 回路以上之供電線路，且每一回路之連接插座數 在 10 個以下","D":"各插座設容量 110 伏特、15 安培以上之無熔絲斷路器"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2025-消防法規-22","year":2025,"roc_year":114,"subject":"消防法規","category":"各類場所設置標準","no":22,"question":"依各類場所消防安全設備設置標準規定，某棟新建大樓連結送水管之配管摩擦損失水頭為 5 公尺、落差為 36 公尺，請問其連結送水管之送水設計壓力應在下列何值以上？","options":{"A":"90","B":"96","C":"100","D":"105"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2025-消防法規-23","year":2025,"roc_year":114,"subject":"消防法規","category":"各類場所設置標準","no":23,"question":"依各類場所消防安全設備設置標準，有關瓦斯漏氣檢知器依瓦斯特性裝設於天花板或牆面之 規定，下列何者錯誤？","options":{"A":"瓦斯對空氣之比重未滿 1 時，設於距瓦斯燃燒器具或瓦斯導管貫穿牆壁處水平距離 4 公尺 以內","B":"瓦斯對空氣之比重未滿 1 時，檢知器下端，裝設在天花板下方 30 公分範圍內","C":"瓦斯對空氣之比重大於 1 時，設於距瓦斯燃燒器具或瓦斯導管貫穿牆壁處水平距離 4 公尺 以內","D":"瓦斯對空氣之比重大於 1 時，檢知器上端，裝設在距樓地板面 30 公分範圍內"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2025-消防法規-24","year":2025,"roc_year":114,"subject":"消防法規","category":"各類場所設置標準","no":24,"question":"依各類場所消防安全設備設置標準，有關密閉式撒水頭之自動撒水設備末端之查驗閥配置規 定，下列何者錯誤？","options":{"A":"管徑在 25 毫米以上","B":"查驗閥依各流水檢知裝置配管系統配置，並接裝在建築物各層放水壓力最低之最遠支管末端","C":"查驗閥之一次側設壓力表，二次側設連成表","D":"距離地板面之高度在 2.1 公尺以下，並附有排水管裝置，並標明末端查驗閥字樣"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2025-消防法規-25","year":2025,"roc_year":114,"subject":"消防法規","category":"各類場所設置標準","no":25,"question":"依各類場所消防安全設備設置標準，有關緊急廣播設備之配線設置規定，下列何者正確？","options":{"A":"導線間及導線對大地間之絕緣電阻值，以直流 250 伏特額定之絕緣電阻計測定，對地電壓 在 150 伏特以下者，在 0.1 MΩ 以上","B":"導線間及導線對大地間之絕緣電阻值，以直流 250 伏特額定之絕緣電阻計測定，對地電壓 超過 150 伏特者，在 0.5 MΩ 以上","C":"不得與其他電線共用管槽。但電線管槽內之電線用於 100 伏特以下之弱電回路者，不在此限","D":"設有音量調整器時，應為二線式配線"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2025-消防法規-26","year":2025,"roc_year":114,"subject":"消防法規","category":"各類場所設置標準","no":26,"question":"依各類場所消防安全設備設置標準規定，下列何者屬於應設置排煙設備之場所？","options":{"A":"供百貨商場使用，樓地板面積合計為 500 平方公尺","B":"樓地板面積為 100 平方公尺之居室，其天花板下方 80 公分範圍內之有效通風面積為 3 平 方公尺","C":"樓地板面積為 800 平方公尺之無開口樓層","D":"依建築技術規則應設置之安全梯"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2025-消防法規-27","year":2025,"roc_year":114,"subject":"消防法規","category":"各類場所設置標準","no":27,"question":"依各類場所消防安全設備設置標準規定，下列何者屬於應設置火警自動警報設備之場所？","options":{"A":"五層之建築物，1 樓供 KTV 使用，樓地板面積為 250 平方公尺","B":"五層之建築物，1 樓及 2 樓供 KTV 使用，總樓地板面積為 250 平方公尺","C":"五層之建築物，1 樓供證券交易所使用，樓地板面積為 300 平方公尺","D":"六層之建築物，1 樓供證券交易所使用，樓地板面積為 300 平方公尺"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2025-消防法規-28","year":2025,"roc_year":114,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":28,"question":"依六類公共危險物品製造儲存及處理場所標示板規格及設置要點規定，下列何者非屬第二種 標示板內容標示板之內容？","options":{"A":"公共危險物品之種類","B":"公共危險物品場所之名稱","C":"公共危險物品製造、儲存及處理場所之最大數量及換算為管制之倍數","D":"保安監督人之姓名及職稱"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2025-消防法規-29","year":2025,"roc_year":114,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":29,"question":"依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法，有關室內儲 槽場所之位置、構造及設備應符合規定之敘述，下列何者錯誤？","options":{"A":"儲槽專用室之儲槽側板外壁與室內牆面之距離應在 50 公分以上","B":"儲槽容量不得超過管制量之 40 倍，且儲存第四類公共危險物品時，除第四石油類及動植物 油類外，不得超過 2 萬公升","C":"儲槽構造：儲槽材質應為厚度 3.2 毫米以上之鋼板或具有同等以上性能者","D":"正負壓力超過 500 毫米水柱壓力之儲槽應設置通氣管；非壓力儲槽應設置安全裝置"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2025-消防法規-30","year":2025,"roc_year":114,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":30,"question":"依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法規定，有關室 外儲槽場所儲槽儲存第四類公共危險物品，其防液堤應符合規定之敘述，下列何者錯誤？","options":{"A":"單座儲槽周圍所設置防液堤之容量，應為該儲槽容量百分之一百十以上","B":"防液堤之高度應在 50 公分以上。但儲槽容量合計超過 20 萬公秉者，高度應在 1 公尺以上","C":"防液堤內面積不得超過 6 萬平方公尺","D":"防液堤內部設置儲槽，不得超過 10 座。但其儲槽容量均在 200 公秉以下，且所儲存物之閃 火點在攝氏 70 度以上未達 200 度者，得設置 20 座以下；儲存物之閃火點在攝氏 200 度以 上者，無設置數量之限制"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2025-消防法規-31","year":2025,"roc_year":114,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":31,"question":"依公共危險物品試驗方法及判定基準規定，試驗品為粉粒狀者，進行氧化性固體判定，試驗 方式之標準物質或還原劑，下列何者錯誤？","options":{"A":"燃燒試驗之標準物質：過氯酸鉀（特級）及氯酸鉀（1 級）","B":"燃燒試驗之還原劑：木粉","C":"落錘試驗之標準物質：硝酸鉀（特級）及氯酸鉀（1 級）","D":"落錘試驗之還原劑：紅磷（1 級）"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2025-消防法規-32","year":2025,"roc_year":114,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":32,"question":"依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法規定，液化石 油氣販賣場所儲放液化石油氣，總儲氣量不得超過 W 公斤，超過部分得設容器保管室儲放 之。但總儲氣量以 X 公斤為限。又液化石油氣備用量，供營業使用者，不得超過 Y 公斤；供 家庭使用者，不得超過 Z 公斤。請問 W、X、Ｙ及 Z 分別為多少？","options":{"A":"W=120；X=1,000；Y=100；Z=50","B":"W=128；X=1,000；Y=80；Z=40","C":"W=120；X=1,200；Y=60；Z=30","D":"W=128；X=1,200；Y=100；Z=50"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2025-消防法規-33","year":2025,"roc_year":114,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":33,"question":"依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法規定，黃磷、 赤磷及過氧化氫分屬第幾類公共危險物品？","options":{"A":"黃磷：第三類；赤磷：第二類；過氧化氫：第一類","B":"黃磷：第二類；赤磷：第三類；過氧化氫：第六類","C":"黃磷：第五類；赤磷：第三類；過氧化氫：第一類","D":"黃磷：第三類；赤磷：第二類；過氧化氫：第六類"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2025-消防法規-34","year":2025,"roc_year":114,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":34,"question":"依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法規定，有關公 共危險物品製造場所或一般處理場所構造規定之敘述，下列何者錯誤？","options":{"A":"牆壁、樑、柱、地板及樓梯，應以不燃材料建造；外牆有延燒之虞者，除出入口外，不得 設置其他開口，且應採用防火構造","B":"建築物之屋頂，應以不燃材料建造，並以輕質金屬板或其他輕質不燃材料覆蓋","C":"窗戶及出入口應設置 30 分鐘以上防火時效之防火門窗；牆壁開口有延燒之虞者，應設置 1 小時以上防火時效之常時關閉式防火門","D":"設於室外之製造或處理液體六類物品之設備，應在周圍設置距地面高度在 50 公分以上之 圍阻措施，或設置具有同等以上效能之防止流出措施"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2025-消防法規-35","year":2025,"roc_year":114,"subject":"消防法規","category":"其他消防法規","no":35,"question":"依防火牆及防火水幕設置基準規定，有關防火水幕設備緊急電源供電容量時間及水源容量之 敘述，下列何者錯誤？","options":{"A":"儲槽容量未達 1 萬公秉者緊急電源供電容量時間為 240 分鐘","B":"儲槽容量達 1 萬公秉以上者緊急電源供電容量時間為 360 分鐘","C":"儲槽容量未達 1 萬公秉者，水源容量不得小於防護該儲槽連續放水 120 分鐘之水量","D":"儲槽容量達 1 萬公秉以上者，水源容量不得小於防護該儲槽連續放水 240 分鐘之水量"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2025-消防法規-36","year":2025,"roc_year":114,"subject":"消防法規","category":"其他消防法規","no":36,"question":"依防火牆及防火水幕設置基準規定，防火水幕之防護高度為 12 公尺時，其每公尺水幕長度放 水量應在每分鐘多少公升以上？","options":{"A":"80","B":"120","C":"140","D":"180"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2025-消防法規-37","year":2025,"roc_year":114,"subject":"消防法規","category":"建築防火／原有合法建築","no":37,"question":"依原有合法建築物公共安全改善辦法，有關原有合法建築物之層間區劃改善規定，防火構造 建築物之樓地板應為連續完整面，並應突出建築物外牆 A 公分以上；與樓地板交接處之外牆 或外牆之內側面高度有 B 公分以上，且該外牆或內側構造具有與樓地板同等以上防火時效 者，得免突出。下列 A 與 B 何者正確？","options":{"A":"A=50，B=100","B":"A=50，B=90","C":"A=60，B=100","D":"A=60，B=90"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2025-消防法規-38","year":2025,"roc_year":114,"subject":"消防法規","category":"建築防火／原有合法建築","no":38,"question":"依原有合法建築物公共安全改善辦法，有關原有合法高層建築物區劃改善規定，高層建築物 設有防災中心者，該防災中心應以具有多少小時以上防火時效之牆壁區劃分隔？","options":{"A":"0.5","B":"1","C":"2","D":"3"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2025-消防法規-39","year":2025,"roc_year":114,"subject":"消防法規","category":"建築防火／原有合法建築","no":39,"question":"依建築技術規則規定，下列建築技術用語之定義，何者錯誤？","options":{"A":"地下層：地板面在基地地面以下之樓層。但天花板高度有三分之一以上在基地地面上者， 視為地面層","B":"閣樓：在屋頂內之樓層，樓地板面積在該建築物建築面積三分之一以上時，視為另一樓層","C":"夾層：夾於樓地板與天花板間之樓層；同一樓層內夾層面積之和，超過該層樓地板面積三 分之一或 100 平方公尺者，視為另一樓層","D":"集合住宅：具有共同基地及共同空間或設備，並有 3 個住宅單位以上之建築物"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2025-消防法規-40","year":2025,"roc_year":114,"subject":"消防法規","category":"建築防火／原有合法建築","no":40,"question":"依建築技術規則建築設計施工篇規定，有關防火門其構造等相關規定之敘述，下列何者錯誤？","options":{"A":"防火門周邊 15 公分範圍內之牆壁應以不燃材料建造","B":"防火門之門扇寬度應在 75 公分以上，高度應在 180 公分以上","C":"常時關閉式之防火門，其單一門扇面積不得超過 4.5 平方公尺","D":"防火門應朝避難方向開啟。但供住宅使用及宿舍寢室、旅館客房、醫院病房等連接走廊者， 不在此限"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-01","year":2026,"roc_year":115,"subject":"消防法規","category":"防火管理","no":1,"question":"有關防火管理人設置及管理之敘述，下列何者正確？","options":{"A":"總樓地板面積在 450 平方公尺之健身休閒中心，應設置防火管理人","B":"總樓地板面積在 450 平方公尺之圖書館，應設置防火管理人","C":"總樓地板面積在 450 平方公尺之咖啡廳，應設置防火管理人","D":"防火管理人，應為場所管理或監督層次幹部"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-02","year":2026,"roc_year":115,"subject":"消防法規","category":"消防法／施行細則","no":2,"question":"依消防法罰則之規定，下列敘述何者正確？","options":{"A":"謊報火警，處新臺幣 1 萬元以上 5 萬元以下罰鍰","B":"無故撥打主管機關報案電話，處新臺幣 6 千元以上 10 萬元以下罰鍰","C":"電信事業人員無正當理由洩漏其經辦相關作業所知悉資料之內容，處新臺幣 6 千元以上 10 萬元以下罰鍰","D":"銷售未附有防焰標示之防焰物品者，處新臺幣 3 萬元以上 15 萬元以下罰鍰"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-03","year":2026,"roc_year":115,"subject":"消防法規","category":"消防設備人員制度","no":3,"question":"消防設備師於某場所設計設置「移動式」泡沫滅火設備，依各類場所消防安全設備設置標準 規定，選用 3%蛋白質泡沫液時，其泡沫瞄子最大放射量應為多少 L/min 以上？","options":{"A":"100","B":"200","C":"300","D":"400"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-04","year":2026,"roc_year":115,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":4,"question":"依公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法之規定，有關 室內儲存場所儲存第五類公共危險物品分級屬 A 型或 B 型，其位置、構造及設備之敘述，下 列何者正確？","options":{"A":"儲存倉庫出入口應為 1 小時以上防火時效之防火門","B":"儲存倉庫屋頂，構架屋頂面之木構材，其跨度應在 50 公分以下","C":"儲存倉庫外壁應為厚度 10 公分以上之鋼筋或鋼骨混凝土構造","D":"儲存倉庫窗戶距離地板應在 1 公尺以上"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-05","year":2026,"roc_year":115,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":5,"question":"有關公共危險物品及可燃性高壓氣體各類場所之定義，下列敘述何者正確？","options":{"A":"容器串接使用場所是可燃性高壓氣體儲存場所","B":"第一種販賣場所：販賣裝於容器之六類物品，其數量未達管制量 20 倍之場所","C":"室內儲存場所：位於建築物內以儲槽以外方式儲存六類物品之場所","D":"室內儲槽場所：在建築物內設置容量超過 600 公升且可移動之儲槽儲存六類物品之場所"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-06","year":2026,"roc_year":115,"subject":"消防法規","category":"各類場所設置標準","no":6,"question":"依各類場所消防安全設備設置標準規定，關於「連結送水管」之送水口設置位置，下列何者 正確？","options":{"A":"設置於防災中心內","B":"設置於消防車易於接近，且無礙交通之戶外顯著處","C":"設置於地下室","D":"設置於頂樓"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-07","year":2026,"roc_year":115,"subject":"消防法規","category":"其他消防法規","no":7,"question":"依消防安全設備設計監造測試及檢修作業辦法之規定，有關消防設備人員執行業務之敘述， 下列何者正確？","options":{"A":"標示設備等非系統式消防安全設備之監造及測試，不得由同一執業機構或同一消防設備人 員為之","B":"消防安全設備施工前，消防設備士應訂定監造計畫，送交委託人審閱，並依監造計畫執行 消防安全設備監造及填寫紀錄","C":"公營事業機構自行辦理場所消防安全設備之設計，所屬消防設備人員執業圖記樣式有變更 者，應自事實發生之次日起 15 日內，向執業機構所在地直轄市、縣（市）主管機關辦理變 更登記","D":"消防設備人員對於所製作完成之圖說及檢修報告書，應盡保密及妥善保管之責任，並應自 提出之日起，至少保存 6 年"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-08","year":2026,"roc_year":115,"subject":"消防法規","category":"消防設備人員制度","no":8,"question":"依消防設備人員法之規定，消防設備人員以在同一執業機構執行業務為限。若違反此規定之 罰則為何？","options":{"A":"處新臺幣 1 萬元以上 5 萬元以下罰鍰，並令其限期改善，屆期未改善者，得按次處罰","B":"處新臺幣 2 萬元以上 10 萬元以下罰鍰，並令其限期改善，屆期未改善者，得按次處罰","C":"處新臺幣 3 萬元以上 15 萬元以下罰鍰，並令其停止行為；其不停止者，得按次處罰","D":"停止執行業務 6 個月以上 2 年以下，併處新臺幣 3 萬元以上 15 萬元以下罰鍰"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-09","year":2026,"roc_year":115,"subject":"消防法規","category":"消防設備人員制度","no":9,"question":"消防設備師檢驗水道連結型自動撒水設備設置基準之「給水配管」 。若自來水壓力不足以供應 撒水頭放水時，應採取何種綜整措施？","options":{"A":"放棄設置","B":"設置專用之自動啟動加壓幫浦或蓄水池","C":"僅能手動加水","D":"改設滅火器"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-10","year":2026,"roc_year":115,"subject":"消防法規","category":"其他消防法規","no":10,"question":"依消防機具器材及設備認可實施辦法之規定，有關型式認可之敘述，下列何者正確？","options":{"A":"消防機具器材及設備型式認可之申請人為產品之所有權人","B":"型式認可之有效期間為 3 年","C":"型式認可之審查結果，登錄機構應自受理次日起 4 個月內，以書面通知申請人","D":"型式認可書遺失或毀損者，得向中央主管機關申請補發或換發"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-11","year":2026,"roc_year":115,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":11,"question":"依公共危險物品試驗方法及判定基準之規定，有關氧化性液體判定，下列敘述何者正確？","options":{"A":"氧化性液體依物質著火的難易性進行判定","B":"燃燒試驗：標準物質：90%硫酸水溶液","C":"還原劑：木粉，其材質為杉邊材","D":"燃燒試驗：比標準物質和還原劑之混合物的燃燒時間長為氧化性液體"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-12","year":2026,"roc_year":115,"subject":"消防法規","category":"消防設備人員制度","no":12,"question":"消防設備師設計一處 6 層樓之集合住宅，每層面積 300 平方公尺，設置第一種室內消防栓系 統。依據各類場所消防安全設備設置標準規定，關於該場所「室內消防栓」之水源容量研判， 下列何者正確？","options":{"A":"應以 2 具消防栓同時放水 30 分鐘之水量計之","B":"若全部消防栓數量超過 2 支，以 2 支計算，其水源容量應在 5.2 立方公尺以上","C":"僅需設置滅火器即可，免檢討設置室內消防栓","D":"水源容量應在 10 立方公尺以上"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-13","year":2026,"roc_year":115,"subject":"消防法規","category":"其他消防法規","no":13,"question":"依服勤人員訓練與專業機構登錄及管理辦法之規定，有關服勤人員，下列敘述何者正確？","options":{"A":"服勤人員訓練，分為初訓及複訓，初訓訓練時數不得少於 16 小時","B":"服勤人員資格者，應自初訓結束之日起，每 2 年至少接受複訓一次","C":"複訓訓練時數不得少於 8 小時","D":"主管機關施予服勤人員訓練之資料，自訓練結束之日起，應至少保存 4 年"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-14","year":2026,"roc_year":115,"subject":"消防法規","category":"消防設備人員制度","no":14,"question":"依消防安全設備檢修及申報辦法之規定，消防設備師（士）或消防安全設備檢修專業機構於 完成消防安全設備檢修時，交付管理權人之文件除檢修報告書外，尚包括下列何項？①各該 消防安全設備之種類及數量表 ②檢修人員執業執照影本 ③檢修人員講習訓練積分證明文 件影本 ④檢修人員加入直轄市、縣（市）消防設備師（士）公會之會員證書影本","options":{"A":"①②","B":"①②④","C":"①③④","D":"①②③④"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-15","year":2026,"roc_year":115,"subject":"消防法規","category":"檢修申報／檢修基準","no":15,"question":"依消防安全設備檢修及申報辦法之規定，有關消防安全設備檢修之敘述，下列何者正確？","options":{"A":"應檢修之消防安全設備，於場所所在地主管機關會勘通過之合法場所，為該場所現有之消 防安全設備","B":"檢修報告書所附各種設備檢查表應註明檢修項目之種別、容量及檢修使用設備器具名稱、 性能、檢驗或校準日期","C":"有消防安全設備不符規定者，檢修報告書應清楚載明其不良狀況情形、位置及處置措施","D":"管理權人依規定檢修滅火器、室內消防栓設備，標示設備或緊急照明燈消防安全設備，應 填具檢修報告書"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-16","year":2026,"roc_year":115,"subject":"消防法規","category":"消防設備人員制度","no":16,"question":"消防設備師辦理滅火器外觀檢查時，發現壓力表指標位於紅區。依據消防安全設備及必要檢 修項目檢修基準，應判定為何？","options":{"A":"合格，因為藥劑尚存","B":"不合格，代表內部壓力不足，應立即委託專業廠商重裝或更換","C":"觀察三個月後再更新","D":"只要瓶身無生鏽即可"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-17","year":2026,"roc_year":115,"subject":"消防法規","category":"各類場所設置標準","no":17,"question":"依各類場所消防安全設備設置標準之規定，關於惰性氣體滅火設備藥劑設計濃度，下列敘述 何者正確？","options":{"A":"理論滅火濃度乘以 1.2 倍安全係數以上","B":"常時有人之場所，藥劑最高設計濃度以 60%為限","C":"防護對象為含通電中之電氣設備之場所時，設計濃度應以理論滅火濃度乘以 1.3 倍安全係 數以上","D":"防護對象為含易燃液體之場所時，設計濃度應以理論滅火濃度乘以 1.1 倍安全係數以上"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-18","year":2026,"roc_year":115,"subject":"消防法規","category":"其他消防法規","no":18,"question":"在某醫療機構建築六樓病房內有 250 床病床、另有 150 名從業員工，各候診室之樓地板面積 合計為 1,350 平方公尺，則其避難收容人數為何？","options":{"A":"400 人","B":"550 人","C":"850 人","D":"1750 人"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-19","year":2026,"roc_year":115,"subject":"消防法規","category":"檢修申報／檢修基準","no":19,"question":"依消防安全設備及必要檢修項目檢修基準之規定，有關緊急照明設備性能檢查，緊急電源容 量能否持續 30 分鐘之檢查數量，下列敘述何者正確？","options":{"A":"建築物總樓地板面積 1 千平方公尺以下，檢查數量 2 個以上","B":"建築物總樓地板面積 3 千平方公尺以下，檢查數量 8 個以上","C":"建築物總樓地板面積 6 千平方公尺以下，檢查數量 14 個以上","D":"建築物總樓地板面積 1 萬平方公尺以下，檢查數量 20 個以上"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-20","year":2026,"roc_year":115,"subject":"消防法規","category":"複合用途建築","no":20,"question":"某一建築物地下 1 層為餐廳，1 至 5 層為辦公室。若該餐廳面積僅占總樓地板面積之 5%。依 據複合用途建築物判斷基準研判，該建築物應如何歸類？","options":{"A":"乙類場所","B":"複合用途建築物","C":"完全不需管理","D":"視為一般住宅"},"answers":["A","B"],"answer_note":"官方更正：答A或B或AB者均給分","source":"考選部歷屆試題"},{"id":"2026-消防法規-21","year":2026,"roc_year":115,"subject":"消防法規","category":"消防設備人員制度","no":21,"question":"依消防設備人員法之規定，有關消防設備人員執行業務之敘述，下列何者正確？","options":{"A":"領有執業執照之消防設備人員，應於執業執照效期屆滿日前 3 個月內，申請換發執業執照","B":"消防設備人員執業執照登記事項變更，應自事實發生之次日起算 30 日內，向原登記機關辦理","C":"消防設備人員以在同一執業機構執行業務為限；其執行業務區域僅限登記之直轄市、縣（市）","D":"消防設備人員執業執照有效期間 5 年"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-22","year":2026,"roc_year":115,"subject":"消防法規","category":"消防設備人員制度","no":22,"question":"依消防設備人員法施行細則之規定，消防設備人員應備業務登記簿，有關執業機構基本資料 內容，應包括下列何項？①執業機構負責人 ②服務案件名稱 ③執業圖記異動紀錄 ④服 務項目","options":{"A":"②④","B":"①②④","C":"①③④","D":"①②③④"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-23","year":2026,"roc_year":115,"subject":"消防法規","category":"其他消防法規","no":23,"question":"某滅火器藥劑更換廠商於充填過程中，發現瓶身鏽蝕嚴重。依據滅火器性能檢查及藥劑更換 充填作業專業廠商認可及管理要點，廠商應如何處理？","options":{"A":"重新塗漆覆蓋後繼續充填","B":"進行水壓試驗合格後始得充填，若不合格應予報廢","C":"直接充填，不需檢查瓶身","D":"加強外殼包裝"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-24","year":2026,"roc_year":115,"subject":"消防法規","category":"各類場所設置標準","no":24,"question":"依住宅用火災警報器設置辦法之規定，符合各類場所消防安全設備設置標準之自動撒水設備 或同等性能以上之滅火設備限使用標示溫度在攝氏 X 度以下，動作時間在 Y 秒以內之密閉 型撒水頭者，在該有效範圍內，得免設置住宅用火災警報器。下列 X 與 Y 何者正確？","options":{"A":"X=75，Y=60","B":"X=80，Y=65","C":"X=85，Y=65","D":"X=90，Y=75"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-25","year":2026,"roc_year":115,"subject":"消防法規","category":"其他消防法規","no":25,"question":"依水道連結型自動撒水設備設置基準之規定，有關水道連結型自動撒水設備的設置方式與規 定，下列敘述何者正確？","options":{"A":"水道連結型撒水頭放水量應在每分鐘 20 公升以上，最末端放水壓力應在 0.05 百萬帕斯卡 （MPa）以上","B":"管接頭及閥類應符合場所使用壓力值以上","C":"屋外或潮濕場所露出之金屬配管材質採不銹鋼鋼管者，需施以防銹塗裝等防蝕措施","D":"水源容量：以二顆水道連結型撒水頭，持續放水 30 分鐘以上計算之"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-26","year":2026,"roc_year":115,"subject":"消防法規","category":"建築防火／原有合法建築","no":26,"question":"依建築技術規則之規定，下列建築技術用語之定義，何者正確？","options":{"A":"避難層：具有出入口通達基地地面或道路之樓層","B":"特別安全梯：自室外經由陽臺或排煙室始得進入之安全梯","C":"直通樓梯：建築物地面以上或以下任一樓層可直接通達避難層或地面之樓梯（不包括坡道）","D":"耐燃材料：耐燃合板、耐燃纖維板、耐燃塑膠板、石膏板及其他經中央主管建築機關認定 符合耐燃一級之材料"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-27","year":2026,"roc_year":115,"subject":"消防法規","category":"建築防火／原有合法建築","no":27,"question":"依原有合法建築物公共安全改善辦法之規定，有關室內安全梯改善規定之敘述，下列何者正 確？","options":{"A":"四周牆壁應具有半小時以上防火時效","B":"天花板及牆面之裝修材料以耐燃二級材料為原則","C":"進入安全梯之出入口，應裝設具有 1 小時以上防火時效及遮煙性之防火門，並設置門檻","D":"安全梯出入口之寬度不得小於 90 公分"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-28","year":2026,"roc_year":115,"subject":"消防法規","category":"消防法／施行細則","no":28,"question":"依消防法施行細則規定，有關消防安全設備之設計、監造、測試及檢修，其工作項目敘述何 者錯誤？","options":{"A":"設計：指消防安全設備種類及數量之規劃，並製作消防安全設備圖說","B":"監造：指消防安全設備施工前須經試驗或勘驗事項之查核，並製作紀錄","C":"測試：指消防安全設備施工完成後之功能測試，並製作消防安全設備測試報告書","D":"檢修：指依本法第 9 條第 1 項規定，受託檢查各類場所之消防安全設備，並製作消防安全 設備檢修報告書"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-29","year":2026,"roc_year":115,"subject":"消防法規","category":"檢修申報／檢修基準","no":29,"question":"依消防安全設備及必要檢修項目檢修基準之規定，有關火警自動警報設備綜合檢查，下列敘 述何者正確？","options":{"A":"作同時動作檢查時，操作火災試驗開關及回路選擇開關，復舊使任意 5 回路進行火災動作 表示試驗","B":"進行地區音響裝置之音壓檢查時，距音響裝置設置位置中心 1 公尺處，使用噪音計確認其 音壓應在 90 分貝以上","C":"進行任一探測器加熱或加煙試驗時，受信總機處無需確認其火警分區之火災表示裝置是否 正常亮燈","D":"進行地區音響裝置之音壓檢查時，警鈴於收藏箱內者，應打開收藏箱測定其音壓"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-30","year":2026,"roc_year":115,"subject":"消防法規","category":"消防設備人員制度","no":30,"question":"依消防設備人員執業執照登記辦法相關規定，下列敘述何者錯誤？","options":{"A":"已領有消防設備人員證書者，隨時可向所在地直轄市、縣（市）主管機關提出申請登記及 核發執業執照，始得執行業務","B":"政府機關所屬消防設備人員自行辦理該場所消防安全設備之設計、監造、測試或檢修者， 得依其領有之消防設備人員證書執行業務，免申請登記及核發執業執照","C":"消防設備人員原執業執照有效期間屆滿後，未申請換發執業執照，不得再執行業務","D":"執業執照滅失或遺失者，應填具申請書，並繳納執照費，向原登記主管機關申請補發"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-31","year":2026,"roc_year":115,"subject":"消防法規","category":"其他消防法規","no":31,"question":"依消防安全設備設計監造測試及檢修作業辦法相關規定，下列敘述何者正確？","options":{"A":"消防安全設備施工前，消防安全設備測試人員應訂定測試計畫，送交委託人審閱，並依測 試計畫執行","B":"國內消防安全設備沒有公告測試方法者，消防設備人員應依申請核准或認可時提具之測試 方法與表格執行測試","C":"消防設備人員事務所執業圖記樣式有變更者，應自事實發生次日起 10 日內，向執業機構所 在地直轄市、縣（市）主管機關辦理變更登記","D":"同一案件消防安全設備之監造及測試，應由同一執業機構或同一消防設備人員為之"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-32","year":2026,"roc_year":115,"subject":"消防法規","category":"其他消防法規","no":32,"question":"依消防安全設備設計監造測試及檢修作業辦法，下列敘述何者錯誤？","options":{"A":"消防安全設備檢修報告書應自提出之日起，至少保存 6 年","B":"消防設備人員受託辦理消防安全設備檢修業務，應檢附檢修報告書，並辦理檢修申報作業","C":"消防設備人員受託辦理消防安全設備設計、監造及測試業務，應檢附相關圖說、紀錄、測 試報告書、安裝施工測試佐證資料及執業證明等文件，供起造人申請辦理圖說審查、竣工 查驗作業","D":"消防安全設備檢修報告書共同製作者，應各自保存完整資料"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-33","year":2026,"roc_year":115,"subject":"消防法規","category":"消防設備人員制度","no":33,"question":"依消防安全設備檢修專業機構管理辦法規定，有關消防安全設備檢修專業機構的敘述，下列 何者錯誤？","options":{"A":"指經中央主管機關許可辦理高層建築物、地下建築物或中央主管機關公告之場所消防安全 設備定期檢修業務之專業機構","B":"置有消防設備師及消防設備士合計十人以上，均為專任，其中消防設備師至少二人","C":"中央主管機關受理申請，經書面審查合格者，應實地審查合格者，始許可並發給消防安全 設備檢修專業機構證書","D":"證書有效期間為三年"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-34","year":2026,"roc_year":115,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":34,"question":"依據消防法、公共危險物品及可燃性高壓氣體製造儲存處理場所設置標準暨安全管理辦法， 有關公共危險物品管制量規定，下列敘述何者正確？","options":{"A":"製造、儲存及處理公共危險物品合計達管制量 25 倍以上場所之管理權人，應遴用保安監督 人及保安檢查員","B":"六類物品儲存量達管制量 10 倍以上者，四周保留空地寬度應在 10 公尺以上","C":"儲存六類物品達管制量以上者，應依其性質設置儲存場所儲存","D":"第二種販賣場所：販賣裝於容器之六類物品，其數量達管制量 20 倍以上，未達 40 倍之場所"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-35","year":2026,"roc_year":115,"subject":"消防法規","category":"各類場所設置標準","no":35,"question":"依據各類場所消防安全設備設置標準之規定，有關光電式分離型探測器設置之敘述，下列何 者正確？","options":{"A":"探測器之受光器及送光器，設在距其背部牆壁 2 公尺範圍內","B":"設在與探測器光軸平行牆壁距離 60 公分以上之位置","C":"探測器之光軸與警戒區任一點之水平距離，在 9 公尺以下","D":"設在天花板等高度 30 公尺以下之場所"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-36","year":2026,"roc_year":115,"subject":"消防法規","category":"防火管理","no":36,"question":"某化工廠既設有「防火管理人」亦設有「保安監督人」，關於兩者之敘述，下列何者正確？","options":{"A":"兩者不可由同一人擔任","B":"製造、儲存及處理公共危險物品合計達管制量 20 倍以上場所之管理權人，應遴用保安監督人","C":"消防防護計畫已納入消防防災計畫內容者，管理權人仍應責由保安監督人訂定消防防災計畫","D":"防火管理人具備保安監督人資格者，得兼任保安監督人"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-37","year":2026,"roc_year":115,"subject":"消防法規","category":"消防設備人員制度","no":37,"question":"消防設備師容許他人借用本人名義執行業務，將其執業證照租借給未具資格之公司進行簽證， 其最高處分為何？","options":{"A":"警告一次","B":"處停止執行業務六個月以上三年以下","C":"罰鍰新臺幣一萬元","D":"暫停會籍三個月"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-38","year":2026,"roc_year":115,"subject":"消防法規","category":"消防設備人員制度","no":38,"question":"消防設備師辦理「二氧化碳滅火設備」竣工查驗，發現防護區域為經常有人駐留之辦公室。 依規定其安全連動邏輯應具備下列何者？","options":{"A":"偵煙探測器動作後立即噴放","B":"必須具備 20 秒以上之預告遲延時間，且啟動裝置應設於防護區域外","C":"立即採手動啟動","D":"噴放前不需警報"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-39","year":2026,"roc_year":115,"subject":"消防法規","category":"建築防火／原有合法建築","no":39,"question":"某高層建築物設置「緊急用昇降機」 。依建築技術規則規定其機間之面積，每座昇降機間之樓 地板面積不得小於多少平方公尺？","options":{"A":"2","B":"6","C":"10","D":"20"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2026-消防法規-40","year":2026,"roc_year":115,"subject":"消防法規","category":"其他消防法規","no":40,"question":"半導體廠之「潔淨室」因高空氣換氣率，導致一般探測器失靈。依潔淨區消防安全設備設置 要點應優先採用何種設備？","options":{"A":"差動式探測器","B":"偵煙式探測器","C":"偵溫式探測器","D":"滅火器"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"}];
const LS_KEY="fire_exam_quiz_v1";
let state=JSON.parse(localStorage.getItem(LS_KEY)||'{"history":{},"bookmarks":{}}'),pool=[],index=0,selected=null,locked=false;
const $=id=>document.getElementById(id);$("totalAll").textContent=QUESTIONS.length;
[...new Set(QUESTIONS.map(q=>q.year))].sort().forEach(y=>{let o=document.createElement("option");o.value=y;o.textContent=`${y}（民國${y-1911}）`;$("year").appendChild(o)});
[...new Set(QUESTIONS.map(q=>q.category))].sort().forEach(c=>{let o=document.createElement("option");o.value=c;o.textContent=c;$("category").appendChild(o)});
function save(){localStorage.setItem(LS_KEY,JSON.stringify(state))}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildPool(){const y=$("year").value,c=$("category").value,mode=$("mode").value;pool=QUESTIONS.filter(q=>(y==="all"||String(q.year)===y)&&(c==="all"||q.category===c));if(mode==="wrong")pool=pool.filter(q=>state.history[q.id]&&!state.history[q.id].correct);if(mode==="bookmarked")pool=pool.filter(q=>state.bookmarks[q.id]);if(mode==="random")shuffle(pool);else pool.sort((a,b)=>a.year-b.year||a.no-b.no);index=0;render()}
function stats(){let a=0,c=0;pool.forEach(q=>{let h=state.history[q.id];if(h){a++;if(h.correct)c++}});$("roundCount").textContent=pool.length;$("answered").textContent=a;$("correct").textContent=c;$("rate").textContent=a?Math.round(c/a*100)+"%":"—";$("bar").style.width=pool.length?((index+1)/pool.length*100)+"%":"0%"}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
function render(){stats();const box=$("quiz");if(!pool.length){box.innerHTML='<div class="card empty">這個篩選條件目前沒有題目。</div>';return}const q=pool[index],book=!!state.bookmarks[q.id];selected=null;locked=false;
box.innerHTML=`<div class="card"><div class="badges"><span class="badge">${q.year} 年｜民國 ${q.roc_year} 年</span><span class="badge">${q.subject}</span><span class="badge">${q.category}</span><span class="badge">第 ${q.no} 題</span></div><div class="question">${esc(q.question)}</div><div class="options">${["A","B","C","D"].map(k=>`<button class="option" data-k="${k}"><span class="letter">${k}</span><span>${esc(q.options[k])}</span></button>`).join("")}</div><div id="feedback" class="feedback"></div><div class="actions"><button id="bookmark">${book?"★ 已收藏":"☆ 收藏"}</button><div class="right"><button id="next" class="primary">下一題</button></div></div></div>`;
document.querySelectorAll(".option").forEach(b=>b.onclick=()=>{if(locked)return;selected=b.dataset.k;document.querySelectorAll(".option").forEach(x=>x.classList.toggle("selected",x.dataset.k===selected));check()});
$("next").onclick=()=>{if(index<pool.length-1){index++}else{index=0;if($("mode").value==="random")shuffle(pool)}render()};$("bookmark").onclick=()=>{state.bookmarks[q.id]=!state.bookmarks[q.id];save();render()}}
function check(){if(locked||!selected)return;locked=true;const q=pool[index],ok=q.answers.includes(selected);state.history[q.id]={selected,correct:ok,at:Date.now()};save();document.querySelectorAll(".option").forEach(b=>{let k=b.dataset.k;b.classList.remove("selected");if(q.answers.includes(k))b.classList.add("correct");else if(k===selected&&!ok)b.classList.add("wrong")});const f=$("feedback");f.className="feedback "+(ok?"ok":"bad");f.innerHTML=(ok?"答對。":"答錯。")+` 官方答案：<b>${q.answers.join(" / ")}</b>`+(q.answer_note?`<br>${esc(q.answer_note)}`:"");stats()}
function settle(){let answered=0,correct=0;pool.forEach(q=>{const h=state.history[q.id];if(h){answered++;if(h.correct)correct++}});const wrong=answered-correct,unanswered=pool.length-answered,rate=answered?Math.round(correct/answered*100):0;$("settleBody").innerHTML=`<div class="summaryGrid"><div class="summaryItem">本輪題數<b>${pool.length}</b></div><div class="summaryItem">已作答<b>${answered}</b></div><div class="summaryItem">答對<b>${correct}</b></div><div class="summaryItem">答錯<b>${wrong}</b></div><div class="summaryItem">未作答<b>${unanswered}</b></div><div class="summaryItem">正確率<b>${answered?rate+"%":"—"}</b></div></div>`;$("settleModal").classList.add("show")};$("apply").onclick=buildPool;$("settle").onclick=settle;$("closeSettle").onclick=()=>$("settleModal").classList.remove("show");$("settleModal").onclick=e=>{if(e.target.id==="settleModal")$("settleModal").classList.remove("show")};$("resetRecords").onclick=()=>{if(confirm("確定要清除所有作答紀錄、錯題與收藏嗎？這個動作無法復原。")){localStorage.removeItem(LS_KEY);state={history:{},bookmarks:{}};buildPool();alert("紀錄已重置。")}};buildPool();
</script></body></html>
