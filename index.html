ce":"考選部歷屆試題"},{"id":"2016-消防法規-15","year":2016,"roc_year":105,"subject":"消防法規","category":"其他消防法規","no":15,"question":"某場所消防安全設備設置自動撒水設備，採用密閉式撒水頭，其裝置場所平時最高周圍溫度為 45℃，應 選擇何種標示溫度之撒水頭？","options":{"A":"75 度未滿","B":"75 度以上 121 度未滿","C":"121 度以上 162 度未滿","D":"162 度以上"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-16","year":2016,"roc_year":105,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":16,"question":"有關公共危險物品等場所設置之水霧滅火設備，在最大放射區域水霧噴頭同時放水時，各水霧噴頭之放 射壓力在每平方公分 X 公斤以上或 YMPa 以上；其連結之緊急電源供電容量應供其有效動作 Z 分鐘以上， 請問上述 X、Y、Z 分別為何？","options":{"A":"X=2.5；Y=0.25；Z=30","B":"X=3.5；Y=0.35；Z=45","C":"X=2.5；Y=0.25；Z=45","D":"X=16；Y=1.6；Z=30"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-17","year":2016,"roc_year":105,"subject":"消防法規","category":"建築防火／原有合法建築","no":17,"question":"有關建築物防火區劃之牆壁，應突出建築物外牆面 X 公分以上。但與其交接處之外牆面長度有 Y 公分以 上，且該外牆構造具有與防火區劃之牆壁同等以上防火時效者，得免突出。請問上述 X、Y 分別為何？","options":{"A":"X=45；Y=80","B":"X=50；Y=80","C":"X=45；Y=90","D":"X=50；Y=90"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-18","year":2016,"roc_year":105,"subject":"消防法規","category":"其他消防法規","no":18,"question":"依消防機具器材及設備認可實施辦法暨標準之規定，下列敍述何者錯誤？①型式認可之審查結果，登錄 機構應自受理次日起 4 個月內，以書面通知申請人 ②型式認可之有效期間為 5 年 ③申請個別認可， 第 2 次遺失預先領用認可標示時，停止預先領用認可標示 6 個月 ④登錄機構受理型式變更之申請，應 按月排定認可期程，並於試驗日期 10 日前通知申請人 ⑤取得國際標準組織（ISO）9002 認可登錄，個 別認可得實施免會同試驗","options":{"A":"①④","B":"③⑤","C":"①④⑤","D":"①②③⑤"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-19","year":2016,"roc_year":105,"subject":"消防法規","category":"其他消防法規","no":19,"question":"有關儲存六類物品之數量在管制量二十倍以下者，其供作室內儲存場所使用，下列何者符合規定？①均應 設於牆壁、柱及地板為防火構造建築物之第一層 ②地板應高於地面，且樓層高度不得超過 5 公尺 ③樓 地板面積不得超過 75 平方公尺 ④同一樓層不得相臨設置 ⑤不得設置窗戶","options":{"A":"①③④","B":"①②⑤","C":"③④⑤","D":"②③④⑤"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-20","year":2016,"roc_year":105,"subject":"消防法規","category":"其他消防法規","no":20,"question":"依據消防幫浦加壓送水裝置等及配管摩擦損失計算基準規定，有關呼水裝置須具備之機件，下列敘述何 者錯誤？","options":{"A":"防止水溫上升用排放裝置","B":"溢水用排水管","C":"減水警報裝置","D":"自動給水裝置"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-21","year":2016,"roc_year":105,"subject":"消防法規","category":"防焰","no":21,"question":"依據防焰性能試驗基準規定，展示用廣告板之防焰性能試驗應採何種試驗法？","options":{"A":"45 度小焰燃燒法","B":"45 度大焰燃燒法","C":"45 度鬆弛法","D":"45 度空氣混合焰法"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-22","year":2016,"roc_year":105,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":22,"question":"依據公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法規定，六類物品中何者不得儲存於室外儲 存場所？","options":{"A":"第二類公共危險物品中之硫磺","B":"閃火點在攝氏二十一度以上之易燃性固體","C":"第四類公共危險物品中之第二石油類、第三石油類、第四石油類或動植物油類","D":"第六類公共危險物品中之硝酸"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-23","year":2016,"roc_year":105,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":23,"question":"依據公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法規定，室外儲槽場所儲槽儲存第四類公共 危險物品時，有關防液堤規定之敘述何者錯誤？","options":{"A":"同一地區設有二座以上儲槽者，其周圍所設置防液堤之容量，應為所有儲槽容量總和百分之一百一十 以上","B":"儲槽容量合計超過二十萬公秉者，防液堤之高度應在一公尺以上","C":"防液堤內面積不得超過八萬平方公尺","D":"儲槽容量在一萬公秉以上者，其防液堤應設置洩漏檢測設備，並應於可進行處置處所設置警報設備"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-24","year":2016,"roc_year":105,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":24,"question":"依據公共危險物品試驗方法及判定基準，有關判定易燃液體之試驗判定方法為下列何者？","options":{"A":"依物質燃燒時間及敏感度進行判定","B":"依物質爆炸的危險性及熱分解的激烈程度進行判定","C":"以物質引火性試驗方法進行判定","D":"依物質燃燒時間之長短進行判定"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-25","year":2016,"roc_year":105,"subject":"消防法規","category":"其他消防法規","no":25,"question":"依據防火牆及防火水幕設置基準規定，有關防火水幕設備之水源容量，下列敘述何者錯誤？","options":{"A":"儲槽容量未達一萬公秉者，不得小於防護該儲槽連續放水一百二十分鐘之水量","B":"儲槽容量達一萬公秉以上者，不得小於防護該儲槽連續放水二百分鐘之水量","C":"消防用水與普通用水合併使用者，應採取必要措施，確保水源容量在有效水量範圍內","D":"水源與其他滅火設備水源併設時，其總容量不得小於防護同一儲槽各滅火設備應設水量之合計"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-26","year":2016,"roc_year":105,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":26,"question":"依據防火牆及防火水幕設置基準規定，有一儲槽容量為八千公秉，其防火水幕設備之緊急電源供電容量 時間為何？","options":{"A":"三十分鐘","B":"六十分鐘","C":"一百八十分鐘","D":"三百六十分鐘"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-27","year":2016,"roc_year":105,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":27,"question":"依據可燃性高壓氣體儲存場所防爆牆設置基準規定，下列敘述何者錯誤？","options":{"A":"防爆牆長度應超過設置方位儲存場所建築物牆面長度。其牆腳與儲存場所建築物之距離不得少於二公尺","B":"防爆牆分為鋼筋混凝土製、混凝土空心磚製及鋼板製等三種，並應設置於堅固基礎上","C":"防爆牆對被波及處之耐火及延燒應具有充分阻絕效果","D":"防爆牆之設置應與各設備保持適當距離，不得妨礙火災時之滅火行動"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-28","year":2016,"roc_year":105,"subject":"消防法規","category":"各類場所設置標準","no":28,"question":"依據各類場所消防安全設備設置標準規定，有關密閉式撒水頭之自動撒水設備末端之查驗閥，下列敘述 何者錯誤？","options":{"A":"查驗閥管徑在二十五毫米以上","B":"查驗閥接裝在建築物各層放水壓力最低之最遠支管末端","C":"查驗閥之一次側設有與撒水頭同等放水性能之限流孔，二次側設壓力表","D":"查驗閥距離地板面之高度在二點一公尺以下，並附有排水管裝置"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-29","year":2016,"roc_year":105,"subject":"消防法規","category":"其他消防法規","no":29,"question":"依據消防機關辦理建築物消防安全設備審查及查驗作業基準規定，下列有關建築物消防安全設備竣工查 驗程序敘述何者錯誤？","options":{"A":"起造人填具申請書，檢附消防安全設備測試報告書、安裝施工測試照片、證明文件、使用執照申請書、 原審訖之消防圖說等，向當地消防機關提出，資料不齊全者，消防機關通知限期補正","B":"消防安全設備裝置人攜帶消防安全設備測試報告書至竣工現場配合查驗，消防安全設備裝置人無正當 理由未會同查驗者，得予退件","C":"竣工查驗不合規定者，消防機關應製作查驗紀錄表，將不合規定項目詳為列舉一次告知起造人，起造 人於完成改善後應通知消防機關複查，其經複查仍不符合規定者，消防機關得將該申請案函退","D":"竣工現場設置之消防安全設備與原審訖消防圖說之設備數量或位置有異動時，於不影響設備功能及性 能之情形下，得直接修改竣工圖，並於申請查驗時，備具完整竣工消防圖說，一次報驗"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-30","year":2016,"roc_year":105,"subject":"消防法規","category":"各類場所設置標準","no":30,"question":"依據緊急廣播設備用揚聲器認可基準規定，採用依各類場所消防安全設備設置標準第 133 條第 3 款性能 設計之緊急廣播設備揚聲器，其標示應加註下列何項？","options":{"A":"耐電壓等級","B":"指向特性區分","C":"音壓頻率等級","D":"耐燃性等級"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-31","year":2016,"roc_year":105,"subject":"消防法規","category":"各類場所設置標準","no":31,"question":"依據各類場所消防安全設備設置標準規定，有關移動式泡沫滅火設備，下列敘述何者錯誤？","options":{"A":"移動式泡沫滅火設備之泡沫原液，應使用高發泡","B":"同一樓層各泡沫瞄子放射量，應在每分鐘一百公升以上。但全部泡沫消防栓箱數量超過二個時，以同 時使用二支泡沫瞄子計算之","C":"泡沫瞄子放射壓力應在每平方公分三點五公斤以上或 0.35 MPa 以上","D":"泡沫消防栓箱其箱面表面積應在零點八平方公尺以上，標明移動式泡沫滅火設備字樣，其上方設置紅 色幫浦啟動表示燈"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-32","year":2016,"roc_year":105,"subject":"消防法規","category":"建築防火／原有合法建築","no":32,"question":"依據建築技術規則建築設計施工編規定，下列敘述何者錯誤？①一宗土地指一幢或二幢以上有連帶使用 性之建築物所使用之建築基地 ②阻熱性為在標準耐火試驗條件下，建築構造當其一面受火時，能在一 定時間內，其非加熱面溫度不超過規定值之能力 ③同一室內之天花板高度不同時，以其室內天花板平 均高度作天花板高度 ④同一樓層內夾層面積之和，超過該層樓地板面積三分之一或一百平方公尺者， 視為另一樓層 ⑤避難層為具有出入口通達基地地面或道路之樓層 ⑥分間牆：分隔住宅單位與住宅單 位或住戶與住戶或不同用途區劃間之牆壁","options":{"A":"①④","B":"②⑤","C":"③⑥","D":"④⑤"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-33","year":2016,"roc_year":105,"subject":"消防法規","category":"建築防火／原有合法建築","no":33,"question":"依據建築技術規則建築設計施工編規定，「在常溫及中溫標準試驗條件下，建築物出入口裝設之一般門 或區劃出入口裝設之防火設備，當其構造二側形成火災情境下之壓差時，具有漏煙通氣量不超過規定值 之能力」，上述用語定義係指下列何者？","options":{"A":"防火時效","B":"阻熱性","C":"遮煙性能","D":"耐燃性"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-34","year":2016,"roc_year":105,"subject":"消防法規","category":"各類場所設置標準","no":34,"question":"依據各類場所消防安全設備設置標準規定，下列有關無線電通信輔助設備之接頭敘述何者錯誤？","options":{"A":"設於距樓地板面或基地地面高度零點三公尺至一點五公尺間","B":"裝設於保護箱內，箱內設長度二公尺以上之射頻電纜，其箱面應漆紅色，並標明消防隊專用無線電接 頭字樣","C":"設於地面消防人員便於取用處及值日室等平時有人之處所","D":"設於地面之接頭數量，在任一出入口與其他出入口之步行距離大於三百公尺時，設置二個以上"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-35","year":2016,"roc_year":105,"subject":"消防法規","category":"建築防火／原有合法建築","no":35,"question":"依據原有合法建築物防火避難設施及消防設備改善辦法規定，十一層以上之樓層面積區劃改善規定，下 列敘述何者錯誤？","options":{"A":"室內牆面及天花板（包括底材）均以耐燃一級材料裝修者，得按每五百平方公尺範圍內，以具有一小 時以上防火時效之牆壁、樓地板及防火設備區劃分隔","B":"樓地板面積超過一百平方公尺者，應按每一百平方公尺，以具有一小時以上防火時效之牆壁、樓地板 及防火設備區劃分隔","C":"自地板面起一點二公尺以上之室內牆面及天花板均使用耐燃一級材料裝修者，得按每二百平方公尺， 以具有一小時以上防火時效之牆壁、樓地板及防火設備區劃分隔","D":"區劃範圍內備有效自動滅火設備者，得免計算其有效範圍樓地板面積之三分之一"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-36","year":2016,"roc_year":105,"subject":"消防法規","category":"消防設備人員制度","no":36,"question":"依據消防設備師及消防設備士管理辦法規定，下列敘述何者錯誤？","options":{"A":"消防設備師（士），自取得證書日起每三年應接受講習一次或取得累計積分達一百六十分以上之訓練 證明文件","B":"訓練證明文件，指消防設備師（士）參加與消防安全設備設計、監造、裝置及檢修相關之技術研討活 動或訓練取得之積分證明","C":"消防設備師（士）之獎懲有公開表揚、頒發獎狀或獎牌等方式","D":"消防設備師（士）拒絕消防機關檢查業務或令其報告之要求時，經限期改善而屆期仍未改善，消防機 關得依行政執行法直接強制方法執行之"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-37","year":2016,"roc_year":105,"subject":"消防法規","category":"其他消防法規","no":37,"question":"有關消防幫浦加壓送水裝置之呼水裝置設置規定，下列何者錯誤？①呼水裝置應有 100 公升以上之有效 儲存量 ②呼水裝置之補給水管管徑應為 15 A ③呼水裝置之溢水用排水管管徑 50 A ④呼水裝置之呼 水管管徑 35 A ⑤減水警報裝置及控制盤，均為呼水裝置須具備之機件","options":{"A":"④⑤","B":"①③","C":"②③⑤","D":"③④⑤"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-38","year":2016,"roc_year":105,"subject":"消防法規","category":"其他消防法規","no":38,"question":"依據消防幫浦加壓送水裝置等及配管摩擦損失計算基準規定，附屬裝置控制盤之表示燈應易於辨認，有 關表示燈之顏色區分敘述，下列何者錯誤？","options":{"A":"電源表示燈為白色","B":"啟動表示燈為紅色","C":"呼水槽減水表示燈為橘黃色","D":"電動機電流超過負載表示燈為白色"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-39","year":2016,"roc_year":105,"subject":"消防法規","category":"檢修申報／檢修基準","no":39,"question":"依據各類場所消防安全設備檢修及申報作業基準規定，火警自動警報設備之局限型感熱型探測器，在有 關執行性能檢查時之檢查注意事項，下列敘述何者錯誤？","options":{"A":"連接蓄積性能之回路，亦可先行解除其蓄積性能","B":"設於因水蒸氣滯留而有常時潮濕之虞場所之探測器時，應由差動式局限型試驗器或回路試驗用按鈕等 試驗器進行","C":"在選出之探測器中，發現有不良品時，應再重新抽選實施檢查","D":"非再用型探測器每次測試應輪流選取，可於圖面或檢查表上註記每次選取之位置"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2016-消防法規-40","year":2016,"roc_year":105,"subject":"消防法規","category":"防焰","no":40,"question":"依據防焰性能認證實施要點規定，有關防焰標示方式之敘述下列何者正確？①地毯等地坪舖設物其標示 方式採縫製或鑲釘方式 ②窗簾具耐洗性能者，其標示方式採縫製或鑲釘方式 ③施工用帆布其標示方 式採張貼方式 ④布幕不具耐洗性能者，其標示方式採縫製方式 ⑤展示用廣告板，其標示方式採懸掛 ⑥防焰材料（合板除外），其標示方式採張貼或懸掛","options":{"A":"①⑥","B":"②④","C":"②⑤","D":"③⑤"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-01","year":2017,"roc_year":106,"subject":"消防法規","category":"防火管理","no":1,"question":"管理權人申報其檢修結果之期限，其為各類場所消防安全設備設置標準規定之甲類場所者，每年 A 月 B 日及 C 月 D 日前申報，且每次檢修時間之間隔，甲類場所不得少於 E 個月，管理權人未依限辦理檢修申 報，經主管機關限期改善後辦理完畢者，仍應依前述規定之期限辦理檢修申報，不受前項檢修時間間隔 之限制，則 A+B+C+D+E 為何？","options":{"A":"84","B":"80","C":"75","D":"60"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-02","year":2017,"roc_year":106,"subject":"消防法規","category":"其他消防法規","no":2,"question":"人民因消防人員對火災處所周圍之土地、建築物、車輛及其他物品之使用、損壞或限制使用，致其財產 遭受特別犧牲之損失時，得請求補償。但因可歸責於該人民之事由者，不予補償。前項損失補償，應以 金錢為之，並以補償實際所受之損失為限。損失補償自知有損失時起，A 年內請求之。但自損失發生後， 經過 B 年者，不得為之，則 A+B 為何？","options":{"A":"10","B":"9","C":"8","D":"7"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-03","year":2017,"roc_year":106,"subject":"消防法規","category":"消防設備人員制度","no":3,"question":"依消防機關辦理建築物消防安全設備審查及查驗作業基準及其補充規定，有關審查及竣工查驗規定，下列 敘述何者錯誤？①室內消防栓、自動撒水、…等之配管，配合建築物結構體施工須預埋消防管線時，消防 安全設備監造人應一併拍照建檔存證以供消防機關查核 ②申請建築物修建、室內裝修等涉及消防安全設 備變更之審查及查驗案件，有關變更部分，僅為探測器、撒水頭等系統部分配件之增減及位置之變動者， 申請審查時，應檢附修建、室內裝修案全部範圍之設備概要表及平面圖等相關必要文件 ③舊有建築物辦 理變更使用，無法檢附原核准消防安全設備圖說時，得由消防設備師依使用執照核准圖面之面積或現場實 際勘查認定繪製之 ④消防設備師核算避難器具支固器具及固定部之結構強度等之結果資料，應以書面知 會結構技師或機械技師供納入建築結構整合設計考量 ⑤消防設備師依「緊急電源容量計算基準」核算供 消防安全設備所須之緊急電源容量後，應以書面知會電氣設備技師供納入整合緊急發電系統設計容量考量","options":{"A":"①②④⑤","B":"②③⑤","C":"②④⑤","D":"④⑤"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-04","year":2017,"roc_year":106,"subject":"消防法規","category":"其他消防法規","no":4,"question":"特種建築物得經何機關之許可，不適用建築法全部或一部之規定？","options":{"A":"行政院","B":"內政部","C":"經濟部","D":"直轄市、縣（市）政府"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-05","year":2017,"roc_year":106,"subject":"消防法規","category":"其他消防法規","no":5,"question":"出水口為雙口形，接裝口徑 63 毫米快速接頭，距樓地板面之高度在 A 公尺以上 B 公尺以下，並設於厚度在 C 毫米以上之鋼板或同等性能以上之不燃材料製箱內，其箱面短邊在 D 公分以上，長邊在 E 公分以上，並標 明出水口字樣，每字在 F 平方公分以上。但設於第十層以下之樓層，得用單口形，則 A+B+C+D+E+F 為何？","options":{"A":"94.1","B":"100.6","C":"102.6","D":"113.6"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-06","year":2017,"roc_year":106,"subject":"消防法規","category":"各類場所設置標準","no":6,"question":"依各類場所消防安全設備設置標準規定，安養機構屬於何項用途分類？","options":{"A":"甲類場所","B":"乙類場所","C":"丙類場所","D":"丁類場所"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-07","year":2017,"roc_year":106,"subject":"消防法規","category":"其他消防法規","no":7,"question":"有關消防法規定，下列敘述何者錯誤？","options":{"A":"立法目的為預防火災、搶救災害及緊急救護，以維護公共安全，確保人民生命財產","B":"管理權人係指依法令或契約對各該場所有實際支配管理權者，其屬法人者，為其負責人；如為公寓大 廈者，則管委會應為管理權人","C":"使用燃氣之熱水器及配管之承裝業，應向直轄市、縣（市）政府申請營業登記後，始得營業","D":"應設消防安全設備之集合住宅，其消防安全設備定期之檢查，得由地方消防機關聘用或委託消防專業 人員辦理，並編列預算支付"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-08","year":2017,"roc_year":106,"subject":"消防法規","category":"各類場所設置標準","no":8,"question":"依各類場所消防安全設備設置標準規定，下列場所應設置排煙設備？","options":{"A":"供地下建築物使用，樓地板面積合計在 300 平方公尺以上","B":"樓地板面積在 100 平方公尺以上之居室，其天花板下方 80 公分範圍內之有效通風面積未達該居室樓地 板面積百分之二者","C":"樓地板面積在 500 平方公尺以上之無開口樓層","D":"供集會堂使用，舞臺部分之樓地板面積在 300 平方公尺以上者"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-09","year":2017,"roc_year":106,"subject":"消防法規","category":"其他消防法規","no":9,"question":"室外儲存場所儲存塊狀之硫磺，放置於地面者，每 100 平方公尺（含未達）應以圍欄區劃，圍欄高度應 在 A 公尺以下。圍欄每隔 B 公尺，最少應設一個防水布固定裝置，以防止硫磺溢出或飛散，則 A+B 為何？","options":{"A":"6","B":"5.5","C":"4.5","D":"3.5"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-10","year":2017,"roc_year":106,"subject":"消防法規","category":"其他消防法規","no":10,"question":"裝設火警自動警報設備之建築物，樓梯或斜坡通道，垂直距離每多少公尺以下為一火警分區。但其地下 層部分應為另一火警分區？","options":{"A":"45","B":"50","C":"60","D":"100"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-11","year":2017,"roc_year":106,"subject":"消防法規","category":"其他消防法規","no":11,"question":"博物館收容人員計算方式為從業員工數與閱覽室、展示室、展覽室、會議室及休息室之樓地板面積和除 多少平方公尺所得之數，合計之？","options":{"A":"10","B":"6","C":"4","D":"3"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-12","year":2017,"roc_year":106,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":12,"question":"電氣設備使用之公共危險物品製造、儲存或處理場所，每多少平方公尺（含未滿）應設置第五種滅火設 備一具以上？","options":{"A":"100","B":"150","C":"300","D":"500"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-13","year":2017,"roc_year":106,"subject":"消防法規","category":"消防設備人員制度","no":13,"question":"直轄市、縣（市）之消防設備師或消防設備士達多少人以上者，得組織直轄市、縣（市）消防設備師公 會或消防設備士公會？","options":{"A":"10","B":"15","C":"25","D":"30"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-14","year":2017,"roc_year":106,"subject":"消防法規","category":"其他消防法規","no":14,"question":"檢修機構應備置檢修場所清冊及相關檢修報告書面文件或電子檔，並至少保存多少年？","options":{"A":"5","B":"3","C":"2","D":"1"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-15","year":2017,"roc_year":106,"subject":"消防法規","category":"防焰","no":15,"question":"依防焰性能認證實施要點之規定，下列敘述何者正確？","options":{"A":"中央主管機關受理防焰性能認證申請後，應將審查結果於申請之日起 3 個月內通知申請人","B":"品質管理部門至少應置一名以上之防焰處理技術人員","C":"防焰物品之防焰性能加工處理業者，應設有均勻浸泡、脫水、烘乾之設備；其浸泡之器具，應為長 80 公分以上、寬 50 公分以上、高 40 公分以上之水槽","D":"大型布幕無法以浸泡方式進行防焰性能加工處理時，得以噴霧塗布之方式，其噴霧器之噴嘴放射壓力 不得小於每平方公分 3 公斤"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-16","year":2017,"roc_year":106,"subject":"消防法規","category":"消防法／施行細則","no":16,"question":"依消防法規「消防用緊急發電機組審核認可須知」，相關認可程序之敘述，下列敘述何者錯誤？","options":{"A":"申請人填具申請書及審核表並檢附相關文件向內政部（消防署）提出申請","B":"申請人應自主品質管理，自 106 年 1 月 1 日起每一發電機組出廠前應經第三公證機構或 TAF 認證之實 驗室測試","C":"合格測試報告送建築物起造人或場所管理權人，並副本送地方消防機關備查","D":"經審查通過者，發給審核認可書；審查不合格者，將其不合格部分，詳為列舉，通知申請人"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-17","year":2017,"roc_year":106,"subject":"消防法規","category":"其他消防法規","no":17,"question":"依消防幫浦加壓送水裝置等及配管摩擦損失計算基準之規定，下列敘述何者錯誤？","options":{"A":"與幫浦相連接之配管系中所使用之凸緣須使用國家標準七九○、七九一及七九二等鐵金屬製管凸緣基 準尺度","B":"幫浦之出水量在額定出水量之 150%時，其全揚程應達到額定出水量；性能曲線上全揚程之 65%以上","C":"幫浦所消耗之動力在額定出水量 150%時，其軸動力不得超過馬達額定輸出馬力之 110%","D":"電動機須使用單向誘導馬達或低壓三相誘導鼠籠式電動機或 2 KV 以上之三相誘導鼠籠式電動機"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-18","year":2017,"roc_year":106,"subject":"消防法規","category":"建築防火／原有合法建築","no":18,"question":"依建築技術規則建築設計施工編第三章規定，防火構造之建築物自頂層起算第十五層以上之各樓層，其 主要構造之柱之防火時效為多少小時？","options":{"A":"0.5","B":"1","C":"2","D":"3"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-19","year":2017,"roc_year":106,"subject":"消防法規","category":"建築防火／原有合法建築","no":19,"question":"依建築技術規則建築設計施工編第四章有關直通樓梯規定，下列敘述何者錯誤？","options":{"A":"直通樓梯於避難層開向屋外之出入口，寬度不得小於 1.2 公尺，高度不得小於 1.8 公尺","B":"集合住宅採取複層式構造者，其自無出入口之樓層居室任一點至直通樓梯之步行距離不得超過 50 公尺","C":"通達六層以上，十四層以下或通達地下二層之各樓層，應設置安全梯","D":"通達十五層以上或地下三層以下之各樓層，應設置戶外安全梯或特別安全梯。但十五層以上或地下三 層以下各樓層之樓地板面積未超過 100 平方公尺者，戶外安全梯或特別安全梯改設為一般安全梯"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-20","year":2017,"roc_year":106,"subject":"消防法規","category":"建築防火／原有合法建築","no":20,"question":"依建築技術規則建築設計施工編第十二章有關高層建築物規定，下列敘述何者錯誤？","options":{"A":"高層建築物昇降機道併同昇降機間應以具有 1 小時以上防火時效之牆壁、防火門窗等防火設備及該處 防火構造之樓地板自成一個獨立之防火區劃。昇降機間出入口裝設之防火設備應具有遮煙性能。連接 昇降機間之走廊，應以具有 1 小時以上防火時效之牆壁、防火門窗等防火設備及該層防火構造之樓地 板自成一個獨立之防火區劃","B":"高層建築物在二層以上，十六層或地板面高度在 50 公尺以下之各樓層，應設置緊急進口。但面臨道路 或寬度 4 公尺以上之通路，且各層之外牆每 10 公尺設有窗戶或其他開口者，不在此限","C":"住宅區高層建築物之總樓地板面積與留設空地之比，不得大於 30","D":"高層建築物應設置二座以上之特別安全梯並應符合二方向避難原則。二座特別安全梯應在不同平面位 置，其排煙室並不得共用"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-21","year":2017,"roc_year":106,"subject":"消防法規","category":"建築防火／原有合法建築","no":21,"question":"依據建築技術規則，有關高層建築物之規定，下列敘述何者正確？","options":{"A":"高度每超過 70 公尺者，應設置中繼幫浦","B":"昇降機道併同昇降機間應自成 2 小時以上防火時效之獨立防火區劃，且昇降機間出入口裝設之防火設 備應具有遮煙性能","C":"設有燃氣設備時，應將燃氣設備集中設置，並設置瓦斯漏氣自動警報設備","D":"瓦斯管之管道間應單獨設置，不得與其他水、電管路共構設置"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-22","year":2017,"roc_year":106,"subject":"消防法規","category":"防焰","no":22,"question":"消防相關法規規定有關防焰物品之使用，下列何者敘述錯誤？","options":{"A":"地面樓層達十一層以上建築物、地下建築物，其管理權人應使用附有防焰標示之地毯、窗簾、…等防 焰物品","B":"樓地板面積 150 平方公尺以上之身心障礙福利機構、身心障礙者職業訓練機構應使用防焰物品","C":"防焰物品或其材料非附有防焰標示，不得銷售及陳列","D":"所有防焰物品相關業者均須依規定申請防焰性能認證，應檢具經中央主管機關評鑑合格之試驗機構出 具之防焰性能試驗合格報告書"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-23","year":2017,"roc_year":106,"subject":"消防法規","category":"其他消防法規","no":23,"question":"依防火牆及防火水幕設置基準，防火水幕設備設置相關規定，下列敘述何者錯誤？","options":{"A":"公共危險物品之閃火點達攝氏 70 度以上，假想火面高度即為儲槽水平剖面最大直徑","B":"防火水幕之防護高度在 10 公尺以下時，其每公尺水幕長度放水量應在每分鐘 100 公升以上","C":"防火水幕之防護高度超過 10 公尺者，高度每增加 1 公尺，放水量每分鐘應增加 10 公升","D":"防火水幕設備之水源應連結加壓送水裝置，啟動後 10 分鐘內應能形成水幕"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-24","year":2017,"roc_year":106,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":24,"question":"依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法，高閃火點物品係指下列何者？","options":{"A":"閃火點在攝氏 130 度以上之第三類公共危險物品","B":"閃火點在攝氏 100 度以上之第三類公共危險物","C":"閃火點在攝氏 130 度以上之第四類公共危險物品","D":"閃火點在攝氏 100 度以上之第四類公共危險物"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-25","year":2017,"roc_year":106,"subject":"消防法規","category":"防焰","no":25,"question":"依消防法規「防焰性能試驗基準」，地毯等地坪舖設物類應測試下列何項防焰性能？","options":{"A":"餘焰時間和碳化面積","B":"餘燃時間和碳化距離","C":"餘焰時間和碳化距離","D":"餘燃時間、碳化距離和接焰次數"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-26","year":2017,"roc_year":106,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":26,"question":"依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法，有關六類物品製造場所與下列場所之安全 距離，下列敘述何者錯誤？","options":{"A":"與電壓超過三萬五千伏特之高架電線之距離，應在 5 公尺以上","B":"與收容 20 人以上長期照顧機構、安養機構、老人服務機構之距離，應在 30 公尺以上","C":"與加油站、加氣站之距離，應在 30 公尺以上","D":"與古蹟、博物館、美術館之距離，應在 50 公尺以上"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-27","year":2017,"roc_year":106,"subject":"消防法規","category":"各類場所設置標準","no":27,"question":"依各類場所消防安全設備設置標準規定，下列那些場所不屬於甲類場所？","options":{"A":"醫院、療養院","B":"護理之家機構、產後護理機構","C":"日間型精神復健機構、住宿型精神復健機構","D":"啟明、啟智、啟聰等特殊學校"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-28","year":2017,"roc_year":106,"subject":"消防法規","category":"建築防火／原有合法建築","no":28,"question":"依建築技術規則設計施工編第 99 條之 1 規定，供下列用途使用之樓層，除避難層外，各樓層應以具 1 小 時以上防火時效之牆壁及防火設備分隔為 2 個以上之區劃？①身心障礙福利機構 ②護理之家 ③兒童 及少年安置教養機構 ④精神病院 ⑤老人福利機構","options":{"A":"①②⑤","B":"①②③⑤","C":"①②④⑤","D":"①②③④⑤"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-29","year":2017,"roc_year":106,"subject":"消防法規","category":"消防設備人員制度","no":29,"question":"依消防設備師及消防設備士管理辦法規定，消防設備師及消防設備士有下列情事之一者，直轄市、縣（市） 主管機關得予以獎勵。下列何者錯誤？","options":{"A":"對消防安全設計或學術研究，有卓越表現","B":"對公共安全或預防災害等有關消防事項襄助辦理，成績卓著","C":"對參與火災調查工作，有卓越表現","D":"對消防法規襄助研究及建議，有重大貢獻"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-30","year":2017,"roc_year":106,"subject":"消防法規","category":"消防法／施行細則","no":30,"question":"依消防法相關防火管理規定，下列何者不屬於「一定規模以上供公眾使用建築物」之場所？","options":{"A":"捷運車站、高速鐵路車站","B":"總樓地板面積在 500 平方公尺以上之圖書館、博物館","C":"總樓地板面積在 500 平方公尺以上之寺廟","D":"總樓地板面積在 300 平方公尺以上之餐廳、咖啡廳"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-31","year":2017,"roc_year":106,"subject":"消防法規","category":"防焰","no":31,"question":"依防焰性能認證實施要點規定，有關「展示用廣告板」及加工處理業者之敘述，下列何者錯誤？","options":{"A":"展示用廣告板係指室內展示用廣告合板","B":"防焰合板之製造或其防焰性能加工處理業者應設置符合規定之防焰處理、加工設備","C":"防焰性能試驗之產品試樣規格為 1 平方公尺以上","D":"防焰標示應採張貼方式，標示於材料本體上顯著處"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-32","year":2017,"roc_year":106,"subject":"消防法規","category":"複合用途建築","no":32,"question":"依複合用途建築物判斷基準規定，下列敘述何者正確？①供飲食店用途使用之樓地板面積合計小於 36 平 方公尺，且較供住宅使用之樓地板合計面積小時，該建築物視為住宅 ②供飲食店用途使用之樓地板面 積合計小於供住宅使用之樓地板面積合計，且前者樓地板面積合計在 50 平方公尺以上時，該建築物視為 複合用途建築物 ③供飲食店用途使用之樓地板面積合計，與供住宅使用之樓地板合計面積大致相等 時，應視為複合用途建築物 ④供飲食店用途使用之樓地板合計面積大於供住宅使用之樓地板合計面積 時，視為飲食店用途之建築物","options":{"A":"①②③④","B":"②③④","C":"①③④","D":"①②④"},"answers":["A"],"answer_note":"官方更正：答A給分","source":"考選部歷屆試題"},{"id":"2017-消防法規-33","year":2017,"roc_year":106,"subject":"消防法規","category":"建築防火／原有合法建築","no":33,"question":"依建築技術規則，有關建築物垂直管道設置具遮煙性能設備之規定，下列敘述何者錯誤？","options":{"A":"昇降機道裝設之防火設備（防火乘場門）應具有遮煙性能","B":"昇降機道前設有昇降機間且併同區劃，昇降機道裝設不具防火功能之乘場門，則機間出入口應裝設具 有遮煙性能之防火門","C":"管道間之維修門應具有 1 小時以上防火時效及遮煙性能","D":"緊急用昇降機機間出入口應為具有 1 小時以上防火時效之防火門，且具有遮煙性能"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-34","year":2017,"roc_year":106,"subject":"消防法規","category":"其他消防法規","no":34,"question":"依建築法第 77 條之 2，建築物室內裝修不得妨害或破壞消防設備。室內裝修從業者違反前述規定者，依 同法第 95 條之 1，將處下列那些罰則？①新臺幣 6 萬元以上 30 萬元以下罰鍰 ②得勒令其停止業務，必 要時並撤銷其登記 ③其為公司組織者，通知該管主管機關撤銷其登記 ④處一年以下有期徒刑、拘役 或科或併科新臺幣 30 萬元以下罰金","options":{"A":"①②③④","B":"①②③","C":"①②④","D":"①②"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2017-消防法規-35","year":2017,"roc_year":106,"subject":"消防法規","category":"各類場所設置標準","no":35,"question":"依各類場所消防安全設備設置標準規定，各類場所視為另一場所之敘述，下列何者錯誤？","options":{"A":"符合建築技術規則以無開口且具一小時以上防火時效之牆壁、樓地板區劃分隔者","B":"建築物間設有過廊， wers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-02","year":2018,"roc_year":107,"subject":"消防法規","category":"消防設備人員制度","no":2,"question":"依消防安全設備檢修專業機構管理辦法之規定，有關消防安全設備檢修專業機構之申請設立及管理，下 列敘述何者錯誤？","options":{"A":"應置有 10 人以上專任之消防設備師及消防設備士，其中消防設備師至少 2 人","B":"投保每一事故身體傷亡責任保險之最低保險金額為新臺幣 2 千萬元","C":"檢修報告書至少保存 5 年，檢修機構合格證書有效期限為 3 年","D":"消防設備師或消防設備士檢修不實經裁罰達 5 件以上之檢修機構，不得申請合格證書期限展延"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-03","year":2018,"roc_year":107,"subject":"消防法規","category":"其他消防法規","no":3,"question":"依滅火器認可基準之規定，滅火器之分類屬大型滅火器者，其中乾粉滅火器所充填之滅火藥劑量應該為 幾 kg 以上？","options":{"A":"16 kg 以上","B":"18 kg 以上","C":"20 kg 以上","D":"25 kg 以上"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-04","year":2018,"roc_year":107,"subject":"消防法規","category":"防焰","no":4,"question":"依防焰性能認證實施要點之規定，有關防焰物品之認定及其管理，下列敘述何者正確？","options":{"A":"防焰物品包括網目在 12 公釐以下之施工用帆布","B":"防焰物品使用狀況紀錄至少保存 5 年","C":"不具耐洗性能之窗簾及布幕，其防焰標示方法應採縫製方式","D":"以不正當方法取得防焰標示者，中央主管機關得逕予廢止其防焰認證"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-05","year":2018,"roc_year":107,"subject":"消防法規","category":"防火管理","no":5,"question":"依消防法之規定，地面樓層達多少層以上之建築物，其管理權人應使用附有防焰標示之地毯？","options":{"A":"6 層","B":"11 層","C":"16 層","D":"25 層"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-06","year":2018,"roc_year":107,"subject":"消防法規","category":"防焰","no":6,"question":"依防焰性能試驗基準之規定，下列敘述何者正確？ ①自火源點火接觸試樣起，至火源熄滅之時間，稱為點火時間 ②自火源點火接觸試樣起，至試樣停止 燃燒之時間，稱為餘焰時間 ③自點火時間終了起，至試樣停止燃燒之時間，稱為餘燃時間 ④試樣經 加熱燃燒後碳化部分之最大長度，稱為碳化距離","options":{"A":"①②","B":"②③","C":"①③","D":"③④"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-07","year":2018,"roc_year":107,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":7,"question":"依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法之規定，有關類別及場所定義，下列敘述何 者正確？","options":{"A":"可燃性高壓氣體包括在攝氏 15 度時，表壓力達每平方公分 2 公斤以上之液化石油氣","B":"室內儲槽場所及室外儲槽場所之儲槽，其設置容量為超過 600 公升，且不可移動之儲槽","C":"販賣裝於容器之六類物品，其數量達管制量 15 倍以上，未達 30 倍之場所，稱為第二種販賣場所","D":"閃火點在攝氏 200 度以上之第四類公共危險物品，稱為高閃火點物品"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-08","year":2018,"roc_year":107,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":8,"question":"依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法之規定，有關六類物品製造場所之設置位 置，下列敘述何者正確？","options":{"A":"製造場所與廠區外之戲院、電影院之安全距離應在 50 公尺以上","B":"製造場所設有擋牆防護與廠區外之古蹟之安全距離應在 25 公尺以上","C":"儲存量達管制量 10 倍以上者，四周保留空地寬度應在 3 公尺以上","D":"因作業流程具有連接性，設有高於屋頂，為不燃材料建造且具 2 小時以上防火時效之防火牆者，其四 周保留空地寬度得減半計算"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-09","year":2018,"roc_year":107,"subject":"消防法規","category":"其他消防法規","no":9,"question":"甲乙丙三家瓦斯行設有容器儲存室，其儲存面積分別為 6、16、30 平方公尺，容器儲存室與場外第一類 保護物之法定安全距離分別為 X、Y、Z 公尺，請問 X、Y、Z 為多少？","options":{"A":"8.4、12.0、22.5","B":"8.4、12.0、15.0","C":"12.6、12.0、15.0","D":"12.6、18.0、22.5"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-10","year":2018,"roc_year":107,"subject":"消防法規","category":"其他消防法規","no":10,"question":"依滅火器認可基準之規定，有關滅火器重量（不含固定掛鉤、背負帶或輪架之重量）在 X kg 以下者應為 手提式或背負式，超過 Y kg 以上者應為輪架方式。請問 X、Y 為多少？","options":{"A":"X：15 kg，Y：25 kg","B":"X：18 kg，Y：25 kg","C":"X：18 kg，Y：28 kg","D":"X：28 kg，Y：35 kg"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-11","year":2018,"roc_year":107,"subject":"消防法規","category":"其他消防法規","no":11,"question":"依防火牆及防火水幕設置基準之規定，有關防火水幕設備設置，下列敘述何者正確？","options":{"A":"加壓送水裝置啟動後 3 分鐘內應能形成水幕","B":"防護之儲槽容量達一萬公秉以上者，其緊急電源供電容量時間為 180 分鐘","C":"防護之儲槽容量未達一萬公秉者，其水源容量不得小於防護該儲槽連續放水 120 分鐘之水量","D":"防火水幕之水源不得與其他滅火設備水源併設"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-12","year":2018,"roc_year":107,"subject":"消防法規","category":"其他消防法規","no":12,"question":"依一齊開放閥認可基準之規定，下列敘述何者錯誤？","options":{"A":"本基準適用於消防用自動撒水設備、水霧滅火設備及自動泡沫滅火設備等所使用之一齊開放閥","B":"依據控制部之構造可分為加壓型、減壓型、電動型、電磁型等四種","C":"控制部動作後 15 秒內開啟出水；但內徑超過 200 mm 者，則需於 60 秒內開啟出水","D":"利用壓力進行開啟之控制部，施以規定之壓力值試驗 5 分鐘後，不得有漏水、變形等破壞之情形產生"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-13","year":2018,"roc_year":107,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":13,"question":"依可燃性高壓氣體儲存場所防護牆設置基準之規定，有關防護牆之設置，下列敘述何者正確？","options":{"A":"防護牆種類雖有不同，惟其高度均應為 2 公尺以上","B":"鋼筋混凝土製防護牆之厚度應為 12 公分以上","C":"鋼板製 A 防護牆之厚度應為 9 公分以上","D":"鋼筋混凝土經過 28 日養生後之抗壓強度應為 140 kgf/cm2 以上"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-14","year":2018,"roc_year":107,"subject":"消防法規","category":"各類場所設置標準","no":14,"question":"依各類場所消防安全設備設置標準之規定，有關高度及中度危險工作場所之定義，下列敘述何者錯誤？","options":{"A":"儲存一般可燃性固體物質倉庫之高度未超過 5.5 公尺之場所，可稱為中度危險工作場所","B":"儲存易燃性液體物質之閃火點超過攝氏 60 度之作業場所，可稱為中度危險工作場所","C":"儲存一般可燃性固體物質倉庫之高度超過 5.5 公尺之場所，可稱為高度危險工作場所","D":"儲存易燃性液體物質之閃火點未超過攝氏 60 度與攝氏溫度為 37.8 度時，其蒸氣壓未超過每平方公分 3 公斤之場所，可稱為高度危險工作場所"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-15","year":2018,"roc_year":107,"subject":"消防法規","category":"各類場所設置標準","no":15,"question":"依各類場所消防安全設備設置標準之規定，有關室內及室外消防栓設備之設置，下列敘述何者正確？","options":{"A":"6 層以上建築物，供甲類場所使用，任何一層之樓地板面積在 150 m2 以上者，應設置室內消防栓設備","B":"總樓地板面積在 100 m2 以上之地下建築物，應設置室內消防栓設備","C":"中度危險工作場所，其建築物及儲存面積在 3000 m2 以上者，應設置室外消防栓設備","D":"設有室外消防栓設備之場所，在有效範圍內，得免設室內消防栓設備"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-16","year":2018,"roc_year":107,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":16,"question":"有一液化石油氣分裝場內之供應分裝台氣源之儲槽，其容積為 10 m3，假設液化石油氣之比重為 0.5（水=1）， 依各類場所消防安全設備設置標準第四編之規定，下列敘述何者錯誤？","options":{"A":"依法可免設防護設備","B":"依法可設置室外消防栓","C":"依法可設置射水槍","D":"依法應設置滅火器"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-17","year":2018,"roc_year":107,"subject":"消防法規","category":"其他消防法規","no":17,"question":"分裝場實施油氣灌裝之分裝台，其長、寬分別為 15 公尺及 30 公尺，如僅依面積檢討最小應設滅火器數 量，其法定最小 B 類滅火效能值應為？","options":{"A":"40","B":"50","C":"60","D":"70"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-18","year":2018,"roc_year":107,"subject":"消防法規","category":"各類場所設置標準","no":18,"question":"依複合用途建築物判斷基準之規定，供設置標準第 12 條第 1 款至第 4 款各目用途使用之樓地板面積合計 小於供住宅使用之樓地板面積合計，且前者樓地板面積合計在 50 m2 以上時，該建築物視為下列何者？","options":{"A":"住宅","B":"各目用途之建築物","C":"住宅或各目用途之建築物","D":"複合用途建築物"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-19","year":2018,"roc_year":107,"subject":"消防法規","category":"各類場所設置標準","no":19,"question":"依各類場所消防安全設備設置標準之規定，有關滅火器之設置，下列敘述何者正確？","options":{"A":"供設置標準第 12 條第 2 款至第 4 款使用之場所，各層樓地板面積每 200 平方公尺（含未滿）有一滅火 效能值","B":"設有滅火器之樓層，自樓面居室任一點至滅火器之步行距離在 30 公尺以下","C":"懸掛於牆上或放置滅火器箱中之滅火器，其上端與樓地板面之距離，18 公斤以上者在 1.5 公尺以下","D":"大眾運輸工具每輛（節）配置 2 具"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-20","year":2018,"roc_year":107,"subject":"消防法規","category":"其他消防法規","no":20,"question":"依消防機關辦理建築物消防安全設備審查及查驗作業基準之規定，消防安全設備圖說審查及竣工查驗之 期限，以受理案件後 X 日內結案為原則。但供公眾使用建築物或構造複雜者，得視需要延長，最長不得 超過 Y 日。請問 X、Y 為下列何者？","options":{"A":"10 至 14，20","B":"7 至 10，20","C":"7 至 10，30","D":"10 至 20，30"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-21","year":2018,"roc_year":107,"subject":"消防法規","category":"其他消防法規","no":21,"question":"依消防幫浦加壓送水裝置等及配管摩擦損失計算基準之規定，有關防止水溫上升用之排放裝置，下列敘 述何者錯誤？","options":{"A":"設呼水槽時，防止水溫上升用排放管應從呼水管逆止閥之靠幫浦側連結","B":"防止水溫上升之排放管之配管中途須裝設控制閥","C":"防止水溫上升之排放管應使用口徑 15 mm 以上者","D":"防止水溫上升之排水管之流量，應使幫浦在全閉狀態下連續運轉時，不使幫浦內部水溫升高至 35℃以上"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-22","year":2018,"roc_year":107,"subject":"消防法規","category":"建築防火／原有合法建築","no":22,"question":"依原有合法建築物防火避難設施及消防設備改善辦法之規定，有關原有合法建築物 10 層以下之非防火構 造建築物，其主要構造部分使用不燃材料建造之建築物者，應按其總樓地板面積每 X 平方公尺，以具有 1 小時防火時效之牆壁、樓地板及防火設備區劃分隔。請問 X 為多少？","options":{"A":"300","B":"500","C":"1000","D":"1500"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-23","year":2018,"roc_year":107,"subject":"消防法規","category":"其他消防法規","no":23,"question":"依建築法之規定，建築物之基礎、樑柱、承重牆壁、樓地板、屋架或屋頂，其中任何一種有過半之修理 或變更者，屬於建築物之何種行為？","options":{"A":"新建","B":"增建","C":"改建","D":"修建"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-24","year":2018,"roc_year":107,"subject":"消防法規","category":"建築防火／原有合法建築","no":24,"question":"依建築技術規則建築設計施工編之規定，有關建築技術用語定義，下列敘述何者錯誤？","options":{"A":"總樓地板面積係建築物各層包括地下層、屋頂突出物及夾層等樓地板面積之總和","B":"門廳、走廊、樓梯間、廁所盥洗室、浴室、機械室、車庫等，不視為居室","C":"具有共同基地及共同空間或設備，並有 5 個住宅單位以上之建築物，稱為集合住宅","D":"有效採光面積未達居室樓地板面積 5%者，可視為無窗戶居室"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-25","year":2018,"roc_year":107,"subject":"消防法規","category":"防火管理","no":25,"question":"依消防法施行細則之規定，有關防火管理人之遴用條件，下列敘述何者錯誤？","options":{"A":"總樓地板面積在 300 m2 以上之餐廳","B":"總樓地板面積在 200 m2 以上之補習班","C":"總樓地板面積在 300 m2 以上之超級市場","D":"總樓地板面積在 500 m2 以上，其員工在 30 人以上之工廠"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-26","year":2018,"roc_year":107,"subject":"消防法規","category":"防焰","no":26,"question":"依防焰性能試驗基準之規定，接焰次數係指試樣經接觸火源至完全熔融燃燒時之接觸火源次數。對於具 熱熔融性之纖維製品應達多少次以上之接焰次數？","options":{"A":"2 次","B":"3 次","C":"4 次","D":"5 次"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-27","year":2018,"roc_year":107,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":27,"question":"依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法之規定，六類物品製造場所，其外牆與廠區 外鄰近之大型電影院（電影院內人員在 300 人以上）之最小安全距離為何？","options":{"A":"10 公尺","B":"20 公尺","C":"30 公尺","D":"50 公尺"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-28","year":2018,"roc_year":107,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":28,"question":"依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法之規定，室外儲存場所如儲存塊狀之硫磺， 放置於地面者，有關位置、構造及設備等規定之敘述，下列何者正確？","options":{"A":"每 100 平方公尺（含未達）應以圍欄區劃，圍欄高度應在 1.5 公尺以下","B":"設有 2 個以上圍欄者，其內部之面積合計應在 1500 平方公尺以下","C":"設有 2 個以上圍欄者，圍欄間之距離，不得小於法定保留空地寬度之二分之一","D":"圍欄每隔 3 公尺，最少應設一個防水布固定裝置，以防止硫磺溢出或飛散"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-29","year":2018,"roc_year":107,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":29,"question":"依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法之規定，室外儲槽場所之儲槽儲存第四類公 共危險物品者，其防液堤之規定為：單座儲槽周圍所設置防液堤之容量，應為該儲槽容量百分之 X 以上； 同一地區設有二座以上儲槽者，其周圍所設置防液堤之容量，應為最大之儲槽容量百分之 Y 以上。請問 X、Y 為多少？","options":{"A":"X：110，Y：110","B":"X：120，Y：110","C":"X：120，Y：120","D":"X：125，Y：125"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-30","year":2018,"roc_year":107,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":30,"question":"依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法之規定，液化石油氣儲存場所設置位置與販 賣場所距離不得超過 X 公里。但儲存場所設有圍牆防止非相關人員進入，並有 24 小時專人管理時，其距 離得為 Y 公里內。請問 X、Y 為多少？","options":{"A":"X：3 公里，Y：10 公里","B":"X：5 公里，Y：20 公里","C":"X：5 公里，Y：25 公里","D":"X：6 公里，Y：18 公里"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-31","year":2018,"roc_year":107,"subject":"消防法規","category":"公共危險物品／高壓氣體","no":31,"question":"依公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法之規定，對於室內儲槽場所供幫浦及其電動 機使用之幫浦室，下列敘述何者錯誤？","options":{"A":"屋頂應以不燃材料建造，並以輕質金屬板或其他輕質不燃材料覆蓋。但設置設施使幫浦室無產生爆炸 之虞者，得免以輕質金屬板或其他輕質不燃材料覆蓋","B":"窗戶及出入口，應設置 60 分鐘以上防火時效之防火門窗","C":"地板應採用不滲透之構造，並設置適當之傾斜度及集液設施，且其周圍應設置高於地面 20 公分以上之 圍阻措施，或設置具有同等以上效能之防止流出措施","D":"有可燃性蒸氣滯留之虞者，應設置可將該蒸氣有效排至屋簷以上或室外距地面 4 公尺以上高處之設備"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-32","year":2018,"roc_year":107,"subject":"消防法規","category":"防火管理","no":32,"question":"依各類場所消防安全設備檢修及申報作業基準之規定，管理權人每次進行消防安全設備檢修時間之間 隔，甲類場所不得少於 X 個月，甲類以外之場所不得少於 Y 個月。請問 X、Y 為多少？","options":{"A":"X：5 個月，Y：10 個月","B":"X：5 個月，Y：11 個月","C":"X：6 個月，Y：11 個月","D":"X：6 個月，Y：12 個月"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-33","year":2018,"roc_year":107,"subject":"消防法規","category":"其他消防法規","no":33,"question":"依消防幫浦加壓送水裝置等及配管摩擦損失計算基準之規定，電動機在額定輸出連續運轉 X 小時後，不 得發生異狀，且在超過額定輸出之百分之十輸出力運轉 Y 小時，仍不致發生障礙，引起過熱現象。請問 X、Y 為多少？","options":{"A":"X：4 小時，Y：0.5 小時","B":"X：4 小時，Y：1 小時","C":"X：8 小時，Y：1 小時","D":"X：8 小時，Y：2 小時"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-34","year":2018,"roc_year":107,"subject":"消防法規","category":"其他消防法規","no":34,"question":"依密閉式撒水頭認可基準之規定，有關玻璃球型撒水頭標示溫度及顏色標示，下列敘述何者錯誤？","options":{"A":"工作液色標為橙色者，表示標示溫度區分為 57℃","B":"工作液色標為紅色者，表示標示溫度區分為 68℃","C":"工作液色標為綠色者，表示標示溫度區分為 79℃","D":"工作液色標為黑色者，表示標示溫度區分為 204℃以上"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2018-消防法規-35","year":2018,"roc_year":107,"subject":"消防法規","category":"其他消防法規","no":35,"question":"依滅火器用滅火藥劑認可基準之規定，對於乾粉滅火劑之主成分說明，下列敘述何者錯誤？","options":{"A":"多效磷鹽乾粉之主成分為 50%以上之磷酸二氫銨（NH4H2PO4）","B":"紫焰乾粉為 85% "options":{"A":"16 個","B":"18 個","C":"22 個","D":"24 個"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2019-消防法規-19","year":2019,"roc_year":108,"subject":"消防法規","category":"消防法／施行細則","no":19,"question":"依消防法及消防機關辦理建築物消防安全設備審查及查驗作業基準及其補充規定，有關消防 安全設備圖說之審查規定，下列何者正確？","options":{"A":"消防安全設備圖說審查及竣工查驗之期限，以受理案件後 7 至 10 日內結案為限","B":"供公眾使用建築物變更為非供公眾使用時，主管建築機關應會同消防機關審查其消防安全 設備圖說","C":"變更設計或變更用途，非系統式設備僅變動滅火器、緊急照明燈等簡易設備者，設計人應 配合審查","D":"消防設備師核算避難器具支固器具及固定部之結構強度等之結果資料，應以書面知會結構 技師供納入建築結構整合設計考量"},"answers":["D"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2019-消防法規-20","year":2019,"roc_year":108,"subject":"消防法規","category":"各類場所設置標準","no":20,"question":"依各類場所消防安全設備設置標準之規定，一一九火災通報裝置設置之敘述，何者正確？","options":{"A":"僅應具手動啟動功能","B":"設置近端啟動裝置時，應設有可與設置一一九火災通報裝置場所通話之設備","C":"手動啟動裝置之操作開關距離樓地板面之高度，在 0.8 公尺以上 1.5 公尺以下","D":"裝置附近，不可設置送、收話器"},"answers":["C"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2019-消防法規-21","year":2019,"roc_year":108,"subject":"消防法規","category":"其他消防法規","no":21,"question":"依消防幫浦加壓送水裝置等及配管摩擦損失計算基準之規定，下列何者正確？","options":{"A":"電動機在額定輸出連續運轉 12 小時後，不得發生異狀","B":"電動機須使用單向誘導馬達或低壓三相誘導鼠籠式電動機或 3 KV 以上之三相誘導鼠籠式 電動機","C":"加壓送水裝置之閥類應能承受幫浦最高揚水壓力 2 倍以上壓力","D":"啟動用壓力槽容量應有 50 公升以上"},"answers":["B"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2019-消防法規-22","year":2019,"roc_year":108,"subject":"消防法規","category":"其他消防法規","no":22,"question":"依避難器具支固器具及固定部之結構、強度計算及施工方法之規定，有關施工基準之敘述， 何者正確？","options":{"A":"螺栓應使用標稱 M10 以上者","B":"金屬膨脹錨定螺栓間之間隔，應為埋入深度之 2 倍以上","C":"固定器具埋設在降落面之場所，固定部展開救助袋時，與降落面角度約為 25 度","D":"供焊接或掛接螺栓之鋼筋，直徑應在 6 mm 以上，長度應在 0.6 m 以上"},"answers":["A"],"answer_note":"","source":"考選部歷屆試題"},{"id":"2019-消防法規-23","year":2019,"roc_year":108,"subject":"消防法規","category":"各類場所設置標準","no":23,"question":"依複合用途建築物判斷基準之規定，一棟建築物中，供各類場所消防安全設備設置標準第 12 條第 1 款至第 4 款所列用途二種以上，符合「建築物主用途及從屬用途關係對照表」所 列主用途部分樓地板面積合計應超過該建築物總樓地板面積百分之 P 以上，且從屬用途部分 之樓地板面積合計未超過 L 平方公尺時，得判定為在管理及使用形態上構成從屬關係。請問 P、L 應各為多少？","options":{"A":"P：30，L：100","B":"P：50，L：150","C":"P：80，L：250","D":"P：90，L：300"},"answers":["D"],"answer_
